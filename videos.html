<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiryu10 // Video Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800&family=HarmonyOS+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
        @font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Medium.woff') format('woff'); font-weight: 500; font-style: normal; }
        @font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
        @font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
        @font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
        @font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
        @font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
        :root {
            --primary: #007DFF;
            --bg-color: #F1F3F5;
            --card-bg: rgba(255, 255, 255, 0.6);
            --modal-text-main: #000000;
            --modal-text-sub: #666666;
            --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif;
            --spring-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        :root:lang(ja) { --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif; }
        :root:lang(en) { --font-stack: 'HarmonyOS Sans', sans-serif; }
        :root:lang(zh) { --font-stack: 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif; }
        :root:lang(zh-TW) { --font-stack: 'HarmonyOS Sans TC', 'Microsoft JhengHei', sans-serif; }
        :root:lang(ko) { --font-stack: 'HarmonyOS Sans', 'Noto Sans KR', sans-serif; }
        :root:lang(ru) { --font-stack: 'HarmonyOS Sans', sans-serif; }
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: rgba(40, 40, 40, 0.5);
            --modal-text-main: #FFFFFF;
            --modal-text-sub: #A0A0A0;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--modal-text-main);
            font-family: var(--font-stack);
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
            overflow: hidden;
        }

        #statusMessage { font-size: 18px; font-weight: 800; margin-bottom: 20px; text-align: center; }
        
        .video-container {
            width: 100%; max-width: 1200px; width: 90vw; aspect-ratio: 16 / 9;
            background: #000; border-radius: 24px; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); display: none;
            position: relative; z-index: 10;
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        .btn-back {
            margin-top: 30px; padding: 12px 40px; background: var(--modal-text-main); color: var(--bg-color);
            border: none; border-radius: 50px; text-decoration: none; font-weight: 800; font-size: 16px; 
            transition: transform 0.2s; cursor: pointer; z-index: 10;
        }
        .btn-back:hover { transform: scale(0.95); opacity: 0.9; }

        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(128,128,128,0.2);
            border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- Modal System --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-sheet {
            background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-radius: 32px; box-shadow: 0 30px 80px rgba(0,0,0,0.2);
            width: 90%; max-width: 450px; padding: 40px;
            font-family: var(--font-stack); text-align: left;
            transform: translateY(40px) scale(0.95); opacity: 0;
            transition: transform 0.6s var(--spring-ease), opacity 0.4s ease;
        }
        [data-theme="dark"] .modal-sheet {
            background: rgba(40, 40, 40, 0.8); box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .modal-overlay.active .modal-sheet {
            transform: translateY(0) scale(1); opacity: 1;
        }

        /* Error Layout inside Modal */
        .error-title-color { color: #FF3B30; font-size: 24px; font-weight: 800; margin: 0 0 20px 0; display: flex; align-items: center; gap: 8px;}
        [data-theme="dark"] .error-title-color { color: #FF453A; }
        .modal-error-main-msg { font-size: 18px; font-weight: 800; color: var(--modal-text-main); margin: 0 0 20px 0; line-height: 1.4;}
        
        .modal-grey-box {
            background: rgba(128,128,128,0.1); border-radius: 16px; padding: 20px;
            margin-bottom: 24px; display: flex; flex-direction: column; gap: 10px;
        }
        [data-theme="dark"] .modal-grey-box { background: rgba(255,255,255,0.08); }
        .modal-box-text { font-size: 14px; font-weight: 700; color: var(--modal-text-sub); margin: 0; line-height: 1.5; white-space: pre-wrap;}
        .modal-box-time { font-size: 14px; font-weight: 800; color: var(--modal-text-main); margin: 0; }

        .btn-outline {
            width: 100%; height: 50px; border-radius: 25px; border: 2px solid var(--modal-text-main);
            background: transparent; color: var(--modal-text-main); font-weight: 800; font-size: 16px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; text-decoration: none;
        }
        [data-theme="dark"] .btn-outline { border-color: rgba(255,255,255,0.6); color: #fff; }
        .btn-outline:hover { background: rgba(128,128,128,0.1); transform: scale(0.98);}
        [data-theme="dark"] .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

        /* Background blur effect */
        #particleCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.3; filter: blur(60px); pointer-events: none;}
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div id="loadingBox" style="text-align: center; position: relative; z-index: 5;">
        <div class="spinner"></div>
        <div id="statusMessage" data-translate="loading">認証中...</div>
    </div>

    <div class="video-container" id="videoContainer">
        <iframe id="youtubePlayer" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>

    <a href="index.html" class="btn-back" id="btnCloseMain" style="display:none;" data-translate="btn_close">閉じる</a>

    <!-- Error Modal -->

        <div class="modal-sheet">
            <h2 class="error-title-color">
                <i data-lucide="triangle-alert"></i> 
                <span data-translate="error_title_prefix">エラー</span> 
                <span id="errorCodeText" style="margin-left:auto; font-size:18px; opacity:0.7;">5001</span>
            </h2>
            <h3 id="errorMessage" class="modal-error-main-msg"></h3>
            <div class="modal-grey-box" id="errorInfoBox">

            <a href="index.html" id="btnErrorAction" class="btn-outline" data-translate="btn_home">ホームに戻る</a>

            },
            ru: {
                loading: "Установка безопасного соединения...",

                btn_home: "Вернуться на главную",
                btn_login: "Войти",
                error_title_prefix: "Ошибка",
                err_login_required: "Вы должны войти в систему для просмотра этого контента.",
                err_login_sub: "Если у вас есть аккаунт, пожалуйста, войдите и попробуйте снова.",
                err_invalid_access: "У вас нет прав доступа.",
                err_invalid_sub: "В целях вашей безопасности, пожалуйста, начните заново с главной страницы.",

                err_session_sub: "В целях безопасности вы были автоматически отключены. Пожалуйста, войдите снова.",
                err_load_failed: "Не удалось загрузить видео",

                err_no_history: "У вас нет прав доступа.",

                err_expired: "Срок действия контента истек.",
                err_not_released: "Контент еще не выпущен.",
                err_no_url: "URL-адрес видео не установлен.", err_support_sub: "Пожалуйста, начните заново с главной страницы."
            }
        };
        // Utility: Get Formatted Time (端末タイムゾーン ＆ 多言語 ＆ GMTオフセット)
        function getCurrentTime(lang) {
            try {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
                });
                const parts = formatter.formatToParts(now);
                const p = {};
                parts.forEach(part => { p[part.type] = part.value; });
                let hr = p.hour === '24' ? '00' : p.hour;

                // 端末のタイムゾーンオフセットを取得してGMT表記を作成
                const offset = -now.getTimezoneOffset();
                const sign = offset >= 0 ? '+' : '-';
                const pad = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
                const gmt = `GMT${sign}${pad(offset / 60)}:${pad(offset % 60)}`;

                const mInt = parseInt(p.month, 10) - 1;
                const enM = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                const ruM = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

                switch(lang) {
                    case 'ja': case 'zh': case 'zh-TW':
                        return `${p.year}年${p.month}月${p.day}日 ${hr}:${p.minute}:${p.second} ${gmt}`;
                    case 'ko':
                        return `${p.year}년 ${p.month}월 ${p.day}일 ${hr}:${p.minute}:${p.second} ${gmt}`;
                    case 'ru':
                        return `${p.day} ${ruM[mInt]} ${p.year} г. ${hr}:${p.minute}:${p.second} ${gmt}`;
                    case 'en': default:
                        return `${enM[mInt]} ${p.day}, ${p.year} ${hr}:${p.minute}:${p.second} ${gmt}`;
                }
            } catch (e) {
                return new Date().toLocaleString();
            }
        }
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();

            // Setup Language
            const userLang = localStorage.getItem('user_lang') || 'ja';
            const t = TRANSLATIONS[userLang] || TRANSLATIONS.ja;
            document.documentElement.lang = userLang;
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (t[key]) el.textContent = t[key];
            });

            // Elements
            const loadingBox = document.getElementById('loadingBox');
            const videoContainer = document.getElementById('videoContainer');
            const youtubePlayer = document.getElementById('youtubePlayer');
            const btnCloseMain = document.getElementById('btnCloseMain');
            
            // Modal Elements
            const errorModal = document.getElementById('errorModal');
            const errorCodeText = document.getElementById('errorCodeText');
            const errorMessage = document.getElementById('errorMessage');
            const errorSubMessage = document.getElementById('errorSubMessage');
            const errorTime = document.getElementById('errorTime');
            const btnErrorAction = document.getElementById('btnErrorAction');

            // Show Error Modal Function
            const showError = (code, mainText, subText, actionUrl = "index.html", actionLabel = t.btn_home) => {
                loadingBox.style.display = 'none';
                
                errorCodeText.innerHTML = `<a href="error.html?code=${code}" target="_blank" style="color: inherit; text-decoration: underline;">${code}</a>`;
                errorMessage.textContent = mainText;
                errorSubMessage.textContent = subText || "";
                errorTime.textContent = getCurrentTime(userLang);
                
                btnErrorAction.href = actionUrl;
                btnErrorAction.textContent = actionLabel;

                errorModal.classList.add('active');
            };

            // Parameters & Token
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const target = urlParams.get('target') || "";
            const token = localStorage.getItem('user_session_token');

            // --- 1. 未ログインチェック ---
            if (!token) {
                showError("5001", t.err_login_required, t.err_login_sub, "Access.html?auth=required", t.btn_login);
                return;
            }

            // --- 2. パラメータ不足チェック ---
            if (!code) {
                showError("5002", t.err_invalid_access, t.err_invalid_sub);
                return;
            }

            // --- 3. API通信 ---
            try {
                const response = await fetch('api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ type: 'get_video_url', code: code, target: target })
                });

                const data = await response.json();

                if (data.success && data.embedUrl) {
                    // --- 成功時 ---
                    loadingBox.style.display = 'none';
                    videoContainer.style.display = 'block';
                    btnCloseMain.style.display = 'inline-block';
                    youtubePlayer.src = data.embedUrl;
                } else {
                    // --- APIエラー時 ---
                    if (data.message && data.message.includes("Unauthorized")) {
                        localStorage.removeItem('user_session_token');
                        localStorage.removeItem('user_session_identity');
                        showError("5003", t.err_session_expired, t.err_session_sub, "Access.html?auth=required", t.btn_login);
                    } else {
                        // ★ 2. ここを修正: APIからのメッセージを検知して、多言語辞書のテキストに差し替える
                        const apiMsg = data.message || "";
                        let specificCode = "5004";
                        let displayMsg = t.err_load_failed;

                        if (apiMsg.includes('履歴が存在しません')) {
                            displayMsg = t.err_no_history;
                            specificCode = "3000"; // 履歴なし
                        } else if (apiMsg.includes('所有していません')) {
                            displayMsg = t.err_not_owned;
                            specificCode = "3001"; // 未所有
                        } else if (apiMsg.includes('期限切れ')) {
                            displayMsg = t.err_expired;
                            specificCode = "3002"; // 期限切れ
                        } else if (apiMsg.includes('解禁されていません')) {
                            displayMsg = t.err_not_released;
                            specificCode = "3003"; // 解禁前
                        } else if (apiMsg.includes('URLが設定されていません')) {
                            displayMsg = t.err_no_url;
                            specificCode = "5005"; // URL未設定
                        }
                        
                        // ★ ここを修正： t.err_support_sub を使う
                        showError(specificCode, displayMsg, t.err_support_sub);
                    }
                }
            } catch (error) {
                // ついでにここ（通信エラー時）も多言語対応させたい場合は、辞書に追加して差し替えることができます。
                showError("5000", t.err_network, "インターネット接続を確認して再度お試しください。");
            }
        });

        // Background Particles
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particleHue = document.documentElement.getAttribute('data-theme') === 'light' ? 210 : 220;
        
        const resizeCanvas = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.size=Math.random()*150+50; this.speedX=Math.random()*0.2-0.1; this.speedY=Math.random()*0.2-0.1; this.opacity=Math.random()*0.2+0.05; }
            update() { this.x+=this.speedX; this.y+=this.speedY; if(this.x<0||this.x>canvas.width)this.speedX*=-1; if(this.y<0||this.y>canvas.height)this.speedY*=-1; }
            draw() { ctx.fillStyle=`hsla(${particleHue}, 100%, 50%, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
        }
        let p = Array.from({length: 6}, () => new Particle());
        function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); p.forEach(i=>{i.update();i.draw();}); requestAnimationFrame(animate); }
        animate();
    </script>
</body>
</html>
