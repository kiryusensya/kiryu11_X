<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Enforcement Administrator</title>

<script>
  function checkCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return true;
      return false;
  }
  if (!checkCookie('admin_token')) {
      window.location.replace('signin.html');
  }
</script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --primary: #007DFF; --bg-color: #121212; --card-bg: rgba(40, 40, 40, 0.6);
    --card-border: rgba(255, 255, 255, 0.1); --text-main: #FFFFFF; --text-sub: #A0A0A0;
    --danger: #FF3B30; --success: #04CF22;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; display: flex; overflow-x: hidden; }
  * { box-sizing: border-box; }

  .sidebar { width: 280px; background: #000; border-right: 1px solid var(--card-border); display: flex; flex-direction: column; padding: 24px; flex-shrink: 0; transition: all 0.3s ease; }
  .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .brand { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .mobile-menu-toggle { display: none; background: transparent; border: none; color: var(--text-main); cursor: pointer; padding: 8px; }

  .sidebar-nav { display: flex; flex-direction: column; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 12px; color: var(--text-sub); font-weight: 700; cursor: pointer; transition: 0.2s; margin-bottom: 8px; }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
  .nav-item.active { background: rgba(0, 125, 255, 0.15); color: var(--primary); border: 1px solid rgba(0, 125, 255, 0.3); }

  .main-content { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg-color); }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .header h1 { margin: 0; font-size: 28px; font-weight: 800; }

  .panel { display: none; animation: fadeIn 0.4s; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 30px; max-width: 600px; margin-bottom: 20px; backdrop-filter: blur(10px); }
  .card.wide { max-width: 900px; }
  .card h2 { margin: 0 0 20px 0; font-size: 18px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px;}

  .form-group { margin-bottom: 20px; text-align: left; }
  label { display: block; font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; }
  input, select, textarea { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: var(--text-main); padding: 0 16px; font-size: 14px; font-family: inherit; outline: none; }
  input, select { height: 50px; }
  select { appearance: none; cursor: pointer; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); background: rgba(0, 125, 255, 0.05); }
  
  .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  button { height: 50px; border-radius: 25px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
  .btn-primary { background: var(--primary); color: #fff; width: 100%; }
  .btn-primary:hover:not(:disabled) { opacity: 0.8; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); width: auto; padding: 0 20px; height: 40px; border-radius: 20px; font-size: 14px;}
  .btn-danger:hover { background: rgba(255, 59, 48, 0.1); }
  .msg { margin-top: 15px; font-size: 14px; font-weight: 700; min-height: 20px; text-align: center; }
  .history-list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
  .history-list li { background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); padding: 16px; margin-bottom: 10px; border-radius: 12px; }
  .history-title { font-weight: 800; font-size: 16px; margin-bottom: 6px; display: block; }
  .history-meta { color: var(--text-sub); font-size: 12px; line-height: 1.5; }

  @media (max-width: 768px) {
    body { flex-direction: column; overflow-y: auto; }
    .sidebar { width: 100%; padding: 16px 20px; border-right: none; border-bottom: 1px solid var(--card-border); height: auto; }
    .sidebar-header { margin-bottom: 0; }
    .mobile-menu-toggle { display: block; }
    .sidebar-nav { display: none; margin-top: 20px; }
    .sidebar-nav.open { display: flex; animation: fadeIn 0.3s ease; }
    .nav-item { padding: 14px 16px; font-size: 14px; justify-content: flex-start; }
    .main-content { padding: 20px; overflow-y: visible; }
    .header { flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 24px; }
    .header h1 { font-size: 22px; }
    .card { padding: 20px; }
    .grid-form { grid-template-columns: 1fr; gap: 0; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
      <div class="brand"><i data-lucide="server"></i> 管理コントロール</div>
      <button class="mobile-menu-toggle" id="mobileMenuBtn"><i data-lucide="menu"></i></button>
  </div>
  <div class="sidebar-nav" id="sidebarNav">
      <div class="nav-item active" onclick="switchTab('create')"><i data-lucide="user-plus"></i> ユーザー発行</div>
      <div class="nav-item" onclick="switchTab('reset')"><i data-lucide="key-round"></i> パスワード強制</div>
      <div class="nav-item" onclick="switchTab('search')"><i data-lucide="users"></i> ユーザー管理</div>
      <div class="nav-item" onclick="switchTab('codes')"><i data-lucide="package"></i> コンテンツ管理</div>
      <div class="nav-item" onclick="switchTab('code-support')"><i data-lucide="life-buoy"></i> コード追跡・復旧</div>
      <div style="margin-top: auto; padding-top: 20px;">
          <button id="btnLogout" class="btn-danger" style="width:100%; border:none; text-align:center; justify-content:center; background: rgba(255,59,48,0.1);"><i data-lucide="log-out"></i> ログアウト</button>
      </div>
  </div>
</div>

<div class="main-content">
  <div class="header">
      <h1 id="pageTitle">ユーザー発行</h1>
      <div style="font-size:12px; color:var(--text-sub); background:rgba(255,255,255,0.05); padding:8px 16px; border-radius:20px;">権限: Enforcement Administrator</div>
  </div>

  <div id="panel-create" class="panel active">
      <div class="card">
          <h2>新規アカウントの作成</h2>
          <div class="form-group"><label>新しいユーザーID (Email)</label><input type="text" id="newUserId" placeholder="例: user_001@example.com"></div>
          <div class="form-group"><label>初期パスワード</label><input type="text" id="newUserPass" placeholder="初期パスワードを入力"></div>
          <button id="btnCreate" class="btn-primary">アカウントを発行</button>
          <div id="createResult" class="msg"></div>
      </div>
  </div>

  <div id="panel-reset" class="panel">
      <div class="card">
          <h2>パスワードの強制リセット</h2>
          <div class="form-group"><label>対象のユーザーID</label><input type="text" id="resetUserId" placeholder="例: user_001"></div>
          <div class="form-group"><label>新しい仮パスワード</label><input type="text" id="resetUserPass" placeholder="新しい仮パスワードを入力"></div>
          <button id="btnReset" class="btn-primary" style="background:#FF9500; color:#000;">強制リセットを実行</button>
          <div id="resetResult" class="msg"></div>
      </div>
  </div>

  <div id="panel-search" class="panel">
      <div class="card" style="max-width: 100%;">
          <h2>ユーザー検索・サポート</h2>
          <div style="display: flex; gap: 16px; align-items: flex-end;">
            <div class="form-group" style="flex:1; margin-bottom:0;"><label>対象のユーザーID</label><input type="text" id="searchUserId" placeholder="検索したいユーザーID"></div>
            <button id="btnSearch" class="btn-primary" style="width: 100px;">検索</button>
          </div>
          <div id="searchResult" style="margin-top: 30px;"></div>
      </div>
  </div>

  <div id="panel-codes" class="panel">
      <div class="card wide">
          <h2>コンテンツ（コード）の発行・編集</h2>
          <p style="font-size:12px; color:var(--text-sub); margin-bottom:20px;">
            <span style="color:var(--danger); font-weight:bold;">※すべての項目が必須です。1つでも空欄があると保存できません。</span><br>
            既存のコードを入力すると上書き更新、新しいコードを入力すると新規作成されます。
          </p>
          
          <div style="max-height: 600px; overflow-y: auto; padding-right: 15px;">
              <h3 style="border-bottom: 1px solid var(--card-border); padding-bottom: 8px; margin-top:0;">基本設定</h3>
              <div class="grid-form">
                  <div class="form-group"><label>アクティベーションコード</label><input type="text" class="mng-input" data-col="アクティベーションコード" placeholder="必須"></div>
                  <div class="form-group"><label>コードタイプ</label><select class="mng-input" data-col="Types"><option value="ONCE">ONCE</option><option value="MULTIPLE">MULTIPLE</option><option value="POINT">POINT</option></select></div>
                  <div class="form-group"><label>表示設定</label><select class="mng-input" data-col="show/ hide"><option value="show">show</option><option value="hide">hide</option></select></div>
                  <div class="form-group"><label>価格 (ポイント)</label><input type="number" class="mng-input" data-col="価格" placeholder="0"></div>
                  <div class="form-group"><label>解禁時間</label><input type="datetime-local" class="mng-input" data-col="解禁時間"></div>
                  <div class="form-group"><label>有効時間</label><input type="datetime-local" class="mng-input" data-col="有効時間"></div>
                  <div class="form-group"><label>アイコン</label><input type="text" class="mng-input" data-col="アイコン" placeholder="例: download"></div>
                  <div class="form-group"><label>重複 (グループID)</label><input type="text" class="mng-input" data-col="重複" placeholder="必須"></div>
                  <div class="form-group" style="grid-column: 1 / -1;"><label>付与ポイント数 (POINT時のみ)</label><input type="number" class="mng-input" data-col="Point PPP" placeholder="0"></div>
                  <div class="form-group" style="grid-column: 1 / -1;"><label>Action_url</label><input type="text" class="mng-input" data-col="Action_url" placeholder="必須"></div>
                  <div class="form-group" style="grid-column: 1 / -1;"><label>Imag_Url</label><input type="text" class="mng-input" data-col="Imag_Url" placeholder="必須"></div>
              </div>

              <div id="langFormsContainer"></div>
          </div>
          
          <button id="btnSaveCode" class="btn-primary" style="background:#04CF22; margin-top:20px;">保存 / 登録する</button>
          <div id="codeManageResult" class="msg"></div>
      </div>
  </div>

  <div id="panel-code-support" class="panel">
      <div class="card">
          <h2>コードステータス追跡・復旧</h2>
          <div class="form-group">
              <label>対象のコード</label>
              <div style="display: flex; gap: 10px;">
                  <input type="text" id="targetSupportCode" placeholder="AAAA-BBBB-CCCC" style="flex:1;">
                  <button id="btnCheckCode" class="btn-primary" style="width:100px;">確認</button>
              </div>
          </div>
          <div id="codeSupportResult" style="margin-top: 20px;"></div>
      </div>
  </div>
</div>

<script>
  const escapeHTML = (str) => {
  if (!str) return "";
  return String(str).replace(/[&<>"']/g, (match) => {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match];
  });
};
  lucide.createIcons();
  const GAS_API_URL = "api/proxy"; 

  // --- 多言語フォームの自動生成 ---
  const langs = ['jp', 'en', 'SC', 'TC', 'ko', 'ru'];
  const txtFields = ['ボタン', 'バンドル', 'メッセージ', 'タイトル', '詳細'];
  const langContainer = document.getElementById('langFormsContainer');
  let langHtml = '';
  langs.forEach(l => {
      langHtml += `<h3 style="border-bottom: 1px solid var(--card-border); padding-bottom: 8px; margin-top: 30px; color:var(--primary);">言語: ${l}</h3><div class="grid-form">`;
      txtFields.forEach(f => {
          langHtml += `<div class="form-group"><label>${f}(${l})</label><input type="text" class="mng-input" data-col="${f}(${l})" placeholder="必須"></div>`;
      });
      langHtml += `</div>`;
  });
  langContainer.innerHTML = langHtml;

  function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
  }

  async function safeFetch(bodyObj) {
      const token = getCookie('admin_token');
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const response = await fetch(GAS_API_URL, { method: 'POST', headers: headers, body: JSON.stringify(bodyObj) });
      const data = await response.json();
      if (data.error === "invalid_token" || data.error === "unauthorized" || data.error === "expired") {
          document.cookie = "admin_token=; path=/; max-age=0;"; window.location.replace('signin.html'); throw new Error("認証切れ");
      }
      return data;
  }

  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      document.getElementById('sidebarNav').classList.toggle('open');
  });

  function switchTab(tabId) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('panel-' + tabId).classList.add('active');
      event.currentTarget.classList.add('active');
      const titles = { 'create': 'ユーザー発行', 'reset': 'パスワード強制', 'search': 'ユーザー管理', 'codes': 'コンテンツ管理', 'code-support': 'コード追跡・復旧' };
      document.getElementById('pageTitle').textContent = titles[tabId];
      if(window.innerWidth <= 768) document.getElementById('sidebarNav').classList.remove('open');
  }

  document.getElementById('btnLogout').addEventListener('click', () => {
      document.cookie = "admin_token=; path=/; max-age=0;"; window.location.href = 'signin.html';
  });

  // 1 & 2 (Create & Reset)
  document.getElementById('btnCreate').addEventListener('click', async () => {
      const u = document.getElementById('newUserId').value.trim(), p = document.getElementById('newUserPass').value.trim();
      const resEl = document.getElementById('createResult');
      if(!u || !p) { resEl.textContent = "すべて入力してください"; resEl.style.color = "var(--danger)"; return; }
      resEl.textContent = "処理中..."; resEl.style.color = "var(--text-sub)";
      try {
          const d = await safeFetch({ type: 'admin_create_user', email: u, password: p });
          if(d.success) { resEl.textContent = `✅ 発行成功！ ID: ${u}`; resEl.style.color = "var(--success)"; document.getElementById('newUserId').value = ""; document.getElementById('newUserPass').value = ""; } 
          else { resEl.textContent = `エラー: ${d.message}`; resEl.style.color = "var(--danger)"; }
      } catch(e) { resEl.textContent = "通信エラー"; resEl.style.color = "var(--danger)"; }
  });

  document.getElementById('btnReset').addEventListener('click', async () => {
      const u = document.getElementById('resetUserId').value.trim(), p = document.getElementById('resetUserPass').value.trim();
      const resEl = document.getElementById('resetResult');
      if(!u || !p) { resEl.textContent = "すべて入力してください"; resEl.style.color = "var(--danger)"; return; }
      if(!confirm(`パスワードを強制リセットしますか？`)) return;
      resEl.textContent = "処理中..."; resEl.style.color = "var(--text-sub)";
      try {
          const d = await safeFetch({ type: 'admin_reset_password', targetEmail: u, newPassword: p });
          if(d.success) { resEl.textContent = `✅ リセット完了`; resEl.style.color = "var(--success)"; document.getElementById('resetUserId').value = ""; document.getElementById('resetUserPass').value = ""; } 
          else { resEl.textContent = `エラー: ${d.message}`; resEl.style.color = "var(--danger)"; }
      } catch(e) { resEl.textContent = "通信エラー"; resEl.style.color = "var(--danger)"; }
  });

  // 3. ユーザー管理 (ポイント上書き設定機能)
  document.getElementById('btnSearch').addEventListener('click', async () => {
    const u = document.getElementById('searchUserId').value.trim();
    const resEl = document.getElementById('searchResult');
    if (!u) return;
    resEl.innerHTML = "<div style='text-align:center; color:var(--text-sub);'>検索中...</div>";
    
    try {
        const d = await safeFetch({ type: 'admin_search', targetEmail: u });
        resEl.innerHTML = '';
        if (d.success) {
            const actionsDiv = document.createElement('div');
            actionsDiv.style.cssText = 'background:rgba(255,255,255,0.05); padding:20px; border-radius:12px; margin-bottom:20px; border: 1px solid var(--card-border);';
            actionsDiv.innerHTML = `
                <h3 style="margin:0 0 16px 0; font-size:16px;">
                    <i data-lucide="user" style="width:16px; height:16px; margin-right:4px;"></i> ${d.userId || u}
                </h3>
                <div style="display:flex; flex-direction:column; gap:10px; margin-bottom: 20px;">
                    <div style="font-size:14px; color:var(--text-sub);">現在の所持ポイント: <strong style="color:#fff; font-size:20px; margin-left:8px;">${d.points}</strong> pt</div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <input type="number" id="setPtVal" placeholder="新しいポイント数を入力 (例: 3850)" style="width:250px; height:44px; margin-bottom:0;">
                        <button class="btn-primary" id="btnSetPt" style="width:auto; height:44px; padding:0 20px; background:#04CF22;">ポイントを設定</button>
                    </div>
                </div>
                <div style="border-top: 1px solid rgba(255,59,48,0.3); padding-top:16px;">
                    <button class="btn-danger" id="btnDeleteUser" style="width:100%; color:var(--danger); border-color:var(--danger); background: rgba(255,59,48,0.1);">
                        <i data-lucide="alert-triangle" style="margin-right:4px;"></i> アカウント完全削除
                    </button>
                </div>
            `;
            resEl.appendChild(actionsDiv);

            // ポイント設定イベント
            actionsDiv.querySelector('#btnSetPt').addEventListener('click', async (e) => {
                const ptVal = actionsDiv.querySelector('#setPtVal').value;
                if(ptVal === '') return;
                const btn = e.currentTarget;
                btn.textContent = "処理中..."; btn.disabled = true;
                try {
                    const ptRes = await safeFetch({ type: 'admin_set_points', targetEmail: d.userId || u, amount: parseInt(ptVal) });
                    if(ptRes.success) {
                        alert(`成功: ポイントを ${ptVal} pt に設定しました。`);
                        document.getElementById('btnSearch').click(); // 画面リロード
                    } else alert(`エラー: ${ptRes.message}`);
                } catch(err) { alert('通信エラー'); }
                btn.textContent = "ポイントを設定"; btn.disabled = false;
            });

            actionsDiv.querySelector('#btnDeleteUser').addEventListener('click', async (e) => {
                const confCode = prompt(`【危険】本当に削除する場合は対象のID「${d.userId || u}」を入力してください。`);
                if(confCode !== (d.userId || u)) return alert("IDが一致しません。");
                try {
                    const delRes = await safeFetch({ type: 'admin_delete_user', targetEmail: d.userId || u });
                    if(delRes.success) { alert("完全に削除しました。"); resEl.innerHTML = ''; } 
                    else alert(`エラー: ${delRes.message}`);
                } catch(err) { alert('通信エラー'); }
            });

            if (!d.history || d.history.length === 0) {
                resEl.innerHTML += '<div style="text-align:center; color:var(--text-sub); padding:20px;">履歴なし</div>';
            } else {
                const ul = document.createElement('ul'); ul.className = 'history-list';
                d.history.forEach(h => {
                    const li = document.createElement('li');
                    li.style.display = 'flex'; li.style.justifyContent = 'space-between'; li.style.alignItems = 'center';
                    li.innerHTML = `<div><span class="history-title">${h.title}</span><span class="history-meta">コード: ${h.code}<br>日時: ${h.date}</span></div>`;
                    const rBtn = document.createElement('button'); rBtn.className = 'btn-danger'; rBtn.style.cssText = 'height:32px; padding:0 16px; font-size:12px;'; rBtn.innerHTML = '無効化';
                    rBtn.addEventListener('click', async () => {
                        if (!confirm(`削除しますか？`)) return;
                        rBtn.disabled = true;
                        try {
                            const r = await safeFetch({ type: 'admin_revoke_content', targetEmail: d.userId || u, code: h.code });
                            if (r.success) li.remove(); else { alert(r.message); rBtn.disabled=false; }
                        } catch(e) { alert('エラー'); rBtn.disabled=false; }
                    });
                    li.appendChild(rBtn); ul.appendChild(li);
                });
                resEl.appendChild(ul);
            }
            lucide.createIcons();
        } else { resEl.innerHTML = `<span style='color:var(--danger);'>エラー: ${d.message}</span>`; }
    } catch (e) { resEl.innerHTML = "<span style='color:var(--danger);'>通信エラー</span>"; }
  });

  // 4. コンテンツ（コード）管理 (厳格なバリデーション付き)
  document.getElementById('btnSaveCode').addEventListener('click', async () => {
      const resEl = document.getElementById('codeManageResult');
      const payload = {};
      let isMissing = false;

      // mng-inputクラスが付いた全入力欄をチェック
      document.querySelectorAll('.mng-input').forEach(el => {
          const val = el.value.trim();
          if (val === '') {
              isMissing = true;
              el.style.borderColor = "var(--danger)"; // エラー箇所を赤くする
          } else {
              el.style.borderColor = "rgba(255,255,255,0.2)";
          }
          
          let col = el.getAttribute('data-col');
          if (el.type === 'number') payload[col] = parseInt(val) || 0;
          else payload[col] = val;
      });

      if (isMissing) {
          resEl.textContent = "【エラー】すべての項目を入力してください！";
          resEl.style.color = "var(--danger)";
          return;
      }

      resEl.textContent = "保存中..."; resEl.style.color = "var(--text-sub)";
      try {
          const d = await safeFetch({ type: 'admin_save_code', payload: payload });
          if(d.success) {
              resEl.textContent = `✅ 保存成功！`; resEl.style.color = "var(--success)";
          } else {
              resEl.textContent = `エラー: ${d.message}`; resEl.style.color = "var(--danger)";
          }
      } catch(e) {
          resEl.textContent = "通信エラー"; resEl.style.color = "var(--danger)";
      }
  });

  // 5. コード追跡・復旧
  document.getElementById('btnCheckCode').addEventListener('click', async () => {
      const code = document.getElementById('targetSupportCode').value.trim();
      const resEl = document.getElementById('codeSupportResult');
      if(!code) return;
      resEl.innerHTML = "<div style='color:var(--text-sub);'>確認中...</div>";
      try {
          const d = await safeFetch({ type: 'admin_check_code', code: code });
          if(d.success) {
              const statusText = d.isUsed ? "<span style='color:var(--danger); font-weight:800;'>使用済み (USED)</span>" : "<span style='color:var(--success); font-weight:800;'>未使用 (AVAILABLE)</span>";
              let timeText = "記録なし";
              if (d.usedTime) {
                  timeText = new Date(d.usedTime).toLocaleString(navigator.language, { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
              }
              let html = `<div style="background:rgba(0,0,0,0.3); padding:16px; border-radius:12px; border:1px solid var(--card-border);">
                      <div style="margin-bottom:8px;"><strong>コード:</strong> ${d.code}</div>
                      <div style="margin-bottom:8px;"><strong>タイトル:</strong> ${d.title || '-'}</div>
                      <div style="margin-bottom:16px;"><strong>ステータス:</strong> ${statusText}</div>`;
              if (d.isUsed) {
                  html += `<div style="margin-bottom:8px; font-size:13px; color:var(--text-sub);">使用日時: ${timeText}<br>使用者: ${d.usedBy || '不明'}</div>
                      <button id="btnResetCodeStatus" class="btn-primary" style="height:40px; margin-top:10px; background:#FF9500; color:#000;">ステータスを「未使用」に戻す</button>`;
              }
              html += `</div>`;
              resEl.innerHTML = html;
              
              const btnReset = document.getElementById('btnResetCodeStatus');
              if (btnReset) {
                  btnReset.addEventListener('click', async () => {
                      if(!confirm("「未使用」状態に戻しますか？")) return;
                      btnReset.textContent = "処理中..."; btnReset.disabled = true;
                      try {
                          const r = await safeFetch({ type: 'admin_reset_code', code: d.code });
                          if(r.success) { alert("リセットしました。"); document.getElementById('btnCheckCode').click(); } 
                          else { alert(`エラー: ${r.message}`); btnReset.textContent = "ステータスを戻す"; btnReset.disabled = false; }
                      } catch(err) { alert("通信エラー"); btnReset.disabled = false; }
                  });
              }
          } else { resEl.innerHTML = `<span style='color:var(--danger);'>エラー: ${d.message}</span>`; }
      } catch(e) { resEl.innerHTML = "<span style='color:var(--danger);'>通信エラー</span>"; }
  });
</script>
</body>
</html>
