<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enforcement Administrator</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root { --primary: #007DFF; --bg-color: #121212; --text-main: #FFFFFF; --text-sub: #A0A0A0; --danger: #FF3B30; }
  body { font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .login-card { background: rgba(30, 30, 30, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 40px; width: 90%; max-width: 400px; text-align: center; }
  
  .form-group { margin-bottom: 20px; text-align: left; }
  input {
    width: 100%; height: 50px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px; color: var(--text-main); padding: 0 16px; font-size: 15px; font-family: inherit; outline: none;
    box-sizing: border-box;
  }
  input:focus { border-color: var(--primary); background: rgba(0, 125, 255, 0.05); }
  
  button {
    height: 50px; border-radius: 25px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s;
    border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit;
    box-sizing: border-box;
  }
  .btn-primary { background: var(--primary); color: #fff; width: 100%; }
  .btn-primary:hover { opacity: 0.8; }
  .msg { margin-top: 15px; font-size: 14px; font-weight: 700; min-height: 20px; text-align: center; }
</style>
</head>
<body>

  <div class="login-card">
    <div style="display:flex; justify-content:center; margin-bottom:20px;">
        <i data-lucide="shield-check" style="width:48px; height:48px; color:var(--primary);"></i>
    </div>
    <h1 style="margin: 0 0 30px 0; font-size: 24px;">Enforcement Administrator</h1>
    <div class="form-group"><input type="text" id="adminId" placeholder="个人识别号码"></div>
    <div class="form-group"><input type="password" id="adminPass" placeholder="激活码"></div>
    <button id="btnLogin" class="btn-primary">登录</button>
    <div id="loginResult" class="msg" style="color: var(--danger);"></div>
  </div>

<script>
  lucide.createIcons();
  const GAS_API_URL = "api/proxy"; 

  // 【追加】悪さをしている古い localStorage の残骸を確実に消去
  localStorage.removeItem('admin_session_token');

  // 【追加】Cookieが存在するかチェックする関数
  function checkCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return true;
      return false;
  }

  // 【修正】localStorageではなく、Cookieを見てダッシュボードへ飛ばす
  if (checkCookie('admin_token')) {
      window.location.replace('dashboard.html');
  }

  // --- ログイン処理 ---
  document.getElementById('btnLogin').addEventListener('click', async () => {
      const u = document.getElementById('adminId').value.trim();
      const p = document.getElementById('adminPass').value.trim();
      const resEl = document.getElementById('loginResult');
      
      if(!u || !p) { resEl.textContent = "入力してください"; return; }
      resEl.textContent = "認証中..."; resEl.style.color = "var(--text-sub)";

      try {
          const res = await fetch(GAS_API_URL, {
              method: 'POST', 
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'user_login', email: u, password: p })
          });
          const d = await res.json();
          
          if(d.success && d.isAdmin) {
              // ログイン成功時、Cookieにトークンを保存 (有効期限1日)
              document.cookie = `admin_token=${d.token}; path=/; max-age=86400; Secure; SameSite=Strict`;
              
              // ダッシュボードへ遷移
              window.location.href = 'dashboard.html'; 
          } else {
              resEl.textContent = "無効な管理者IDまたはパスワードです";
              resEl.style.color = "var(--danger)";
          }
      } catch(e) { 
          resEl.textContent = "通信エラーが発生しました";
          resEl.style.color = "var(--danger)";
      }
  });
</script>
</body>
</html>
