<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login // Enterprise</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root { 
    --primary: #007DFF; 
    --bg-color: #0f0f11; 
    --text-main: #FFFFFF; 
    --text-sub: #A0A0A0; 
    --danger: #FF3B30;
    --success: #04CF22;
    --card-bg: rgba(30, 30, 30, 0.9);
    --card-border: rgba(255, 255, 255, 0.15);
    --input-bg: rgba(255, 255, 255, 0.05);
    --btn-bg: #FFFFFF;
    --btn-text: #000000;
  }
  
  [data-theme="light"] {
    --bg-color: #F1F3F5;
    --text-main: #000000;
    --text-sub: #666666;
    --card-bg: rgba(255, 255, 255, 1);
    --card-border: rgba(0, 0, 0, 0.15);
    --input-bg: rgba(0, 0, 0, 0.03);
    --btn-bg: #000000;
    --btn-text: #FFFFFF;
  }

  body { 
    font-family: 'Noto Sans JP', sans-serif; 
    background-color: var(--bg-color); 
    color: var(--text-main); 
    margin: 0; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    overflow: hidden;
    transition: background-color 0.3s ease;
  }

  /* 上部コントロール（言語・テーマ切り替え） */
  .top-controls {
    position: absolute; top: 24px; right: 24px; z-index: 100;
    display: flex; gap: 12px; align-items: center;
  }

  .ctrl-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; 
    background: var(--card-bg); border: 1px solid var(--card-border);
    height: 40px; border-radius: 50px; color: var(--text-main); font-size: 13px; font-weight: 700;
    cursor: pointer; transition: 0.2s;
  }
  .ctrl-btn:hover { background: rgba(128,128,128,0.2); }
  .ctrl-btn.icon-only { width: 40px; padding: 0; }
  .ctrl-btn.lang-trigger { padding: 0 16px; }

  .lang-menu {
    position: absolute; top: 100%; right: 0; margin-top: 8px; width: 140px; background: var(--card-bg);
    border: 1px solid var(--card-border); border-radius: 16px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.3); list-style: none; padding: 6px; display: none;
  }
  .lang-menu.open { display: block; }
  .lang-option {
    padding: 10px 12px; font-size: 13px; font-weight: 500; color: var(--text-main); border-radius: 10px; cursor: pointer; transition: 0.2s;
  }
  .lang-option:hover { background: rgba(128,128,128,0.15); }

  /* メインレイアウト */
  .login-wrapper {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 420px; /* スマホ時の最大幅 */
  }
  
  .login-card { 
    background: var(--card-bg); 
    border: 1px solid var(--card-border); 
    border-radius: 24px; 
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  
  .login-content {
      padding: 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
  }

  /* PC向け 2カラムレイアウト (スクショの再現) */
  .login-image-side { display: none; }

  @media (min-width: 769px) {
      .login-wrapper { max-width: 800px; }
      .login-card { flex-direction: row; min-height: 480px; border-radius: 16px; }
      .login-content { width: 50%; padding: 50px; }
      .login-image-side {
          display: block; width: 50%;
          position: relative; overflow: hidden;
      }
      .login-image-side img {
          width: 100%; height: 100%; object-fit: cover;
      }
  }

  /* タイトル・テキスト */
  h1 { margin: 0 0 30px 0; font-size: 28px; font-weight: 800; }
  
  /* 入力フォーム (角丸) */
  .form-group { margin-bottom: 20px; text-align: left; }
  input {
    width: 100%; height: 50px; background: transparent; border: 1px solid var(--card-border);
    border-radius: 50px; color: var(--text-main); padding: 0 24px; font-size: 15px; 
    outline: none; box-sizing: border-box; transition: 0.3s; font-family: inherit;
  }
  input::placeholder { color: var(--text-sub); font-weight: 700; font-size: 13px; }
  input:focus { border-color: var(--text-main); background: var(--input-bg); }

  /* ボタン */
  button.btn-primary {
    height: 50px; border-radius: 50px; font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.2s;
    border: none; display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 10px;
    background: var(--btn-bg); color: var(--btn-text);
  }
  button.btn-primary:hover { opacity: 0.8; }
  
  /* メッセージ */
  .msg { margin-bottom: 16px; font-size: 13px; font-weight: 700; min-height: 18px; text-align: left; color: var(--danger); }
</style>
</head>
<body>

  <div class="top-controls">
    <button class="ctrl-btn icon-only" id="themeToggle" aria-label="Toggle Theme">
      <i data-lucide="moon" id="themeIcon"></i>
    </button>
    <div style="position: relative;">
      <button class="ctrl-btn lang-trigger" id="langTrigger">
        <i data-lucide="globe" style="width: 16px; height: 16px;"></i>
        <span id="currentLangLabel">日本語</span>
        <i data-lucide="chevron-down" style="width: 14px; height: 14px; opacity: 0.5;"></i>
      </button>
      <ul class="lang-menu" id="langMenu">
        <li class="lang-option" data-value="ja">日本語</li>
        <li class="lang-option" data-value="en">English</li>
        <li class="lang-option" data-value="zh">简体中文</li>
        <li class="lang-option" data-value="zh-TW">繁體中文</li>
        <li class="lang-option" data-value="ko">한국어</li>
        <li class="lang-option" data-value="ru">Русский</li>
      </ul>
    </div>
  </div>

  <div class="login-wrapper">
    
    <div class="login-card" id="loginView">
      <div class="login-content">
        <h1 data-i18n="title_login">ログイン</h1>
        <div id="authStatus" class="msg"></div>
        
        <div class="form-group">
          <input type="email" id="inputEmail" placeholder="ユーザー名" data-i18n-ph="ph_user">
        </div>
        <div class="form-group">
          <input type="password" id="inputPass" placeholder="PASS" data-i18n-ph="ph_pass">
        </div>
        
        <button id="btnAuthAction" class="btn-primary">
          <span data-i18n="btn_login">ログイン</span>
        </button>
        
        <div style="margin-top: 30px; font-size: 12px; font-weight: 700; color: var(--text-sub); text-align: center;">
            <a href="support.html" style="color: var(--text-sub); text-decoration: none;" data-i18n="link_support">ログインできない場合</a>
        </div>
      </div>
      <div class="login-image-side">
        <img src="https://static.wixstatic.com/media/2f0694_6033c90d3f664b9fa50abace1f46664e~mv2.jpg" alt="Background">
      </div>
    </div>

    <div class="login-card" id="forcePasswordChangeView" style="display:none;">
      <div class="login-content">
        <h1 style="font-size: 22px; margin-bottom: 10px;" data-i18n="title_force">パスワードの変更が必要です</h1>
        <p style="color: var(--text-sub); font-size: 12px; margin-bottom: 20px;" data-i18n="desc_force">セキュリティのため、初期パスワードからの変更をお願いします。</p>
        
        <div id="newPassError" class="msg"></div>

        <div class="form-group">
          <input type="password" id="newPassInput" placeholder="新しいパスワード" data-i18n-ph="ph_new_pass">
        </div>
        <div class="form-group">
          <input type="password" id="newPassConfirm" placeholder="新しいパスワード(確認用)" data-i18n-ph="ph_conf_pass">
        </div>
        
        <button id="btnSubmitNewPass" class="btn-primary">
            <span data-i18n="btn_change">変更してログイン</span>
        </button>
      </div>
      <div class="login-image-side">
        <img src="https://static.wixstatic.com/media/2f0694_6033c90d3f664b9fa50abace1f46664e~mv2.jpg" alt="Background">
      </div>
    </div>
    
  </div>

<script>
  lucide.createIcons();
  
  if (localStorage.getItem('user_session_token')) {
      window.location.replace('index.html');
  }

  // テーマ設定 (端末設定に追従)
  const htmlEl = document.documentElement;
  const themeIcon = document.getElementById('themeIcon');

  function applyTheme(theme) {
    htmlEl.setAttribute('data-theme', theme);
    if(themeIcon) themeIcon.setAttribute('data-lucide', theme === 'light' ? 'sun' : 'moon');
    lucide.createIcons();
  }

  const savedTheme = localStorage.getItem('user_theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    localStorage.setItem('user_theme', next);
    applyTheme(next);
  });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('user_theme')) applyTheme(e.matches ? 'dark' : 'light');
  });

  // 翻訳データ
  const TRANSLATIONS = {
    ja: {
      title_login: "ログイン", ph_user: "ユーザー名", ph_pass: "PASS", btn_login: "ログイン", link_support: "ログインできない場合",
      title_force: "パスワードの変更", desc_force: "セキュリティのため、初期パスワードからの変更をお願いします。",
      ph_new_pass: "新しいパスワード", ph_conf_pass: "確認用パスワード", btn_change: "変更してログイン",
      msg_logging_in: "ログイン中...", msg_changing: "変更中...",
      err_empty: "ユーザー名とパスワードを入力してください。", err_invalid: "無効なユーザー名またはパスワードです。",
      err_net: "通信エラーが発生しました。", err_input_all: "入力してください", err_len: "パスワードは6文字以上にしてください",
      err_match: "パスワードが一致しません", msg_success: "変更完了！ログインします...", lang_label: "日本語"
    },
    en: {
      title_login: "LOGIN", ph_user: "Username", ph_pass: "Password", btn_login: "Login", link_support: "Trouble logging in?",
      title_force: "Change Password", desc_force: "For security reasons, please change your initial password.",
      ph_new_pass: "New Password", ph_conf_pass: "Confirm Password", btn_change: "Update & Login",
      msg_logging_in: "Logging in...", msg_changing: "Updating...",
      err_empty: "Please enter your username and password.", err_invalid: "Invalid username or password.",
      err_net: "Network error occurred.", err_input_all: "Please fill in all fields.", err_len: "Password must be at least 6 characters.",
      err_match: "Passwords do not match.", msg_success: "Success! Logging you in...", lang_label: "English"
    },
    zh: {
      title_login: "登录", ph_user: "用户名", ph_pass: "密码", btn_login: "登录", link_support: "无法登录？",
      title_force: "修改密码", desc_force: "出于安全原因，请修改您的初始密码。",
      ph_new_pass: "新密码", ph_conf_pass: "确认密码", btn_change: "修改并登录",
      msg_logging_in: "正在登录...", msg_changing: "正在修改...",
      err_empty: "请输入用户名和密码。", err_invalid: "用户名或密码无效。",
      err_net: "发生网络错误。", err_input_all: "请填写所有字段。", err_len: "密码长度至少为6个字符。",
      err_match: "两次输入的新密码不一致。", msg_success: "修改成功！正在登录...", lang_label: "简体中文"
    },
    "zh-TW": {
      title_login: "登入", ph_user: "使用者名稱", ph_pass: "密碼", btn_login: "登入", link_support: "無法登入？",
      title_force: "修改密碼", desc_force: "出於安全原因，請修改您的初始密碼。",
      ph_new_pass: "新密碼", ph_conf_pass: "確認密碼", btn_change: "修改並登入",
      msg_logging_in: "登入中...", msg_changing: "修改中...",
      err_empty: "請輸入使用者名稱和密碼。", err_invalid: "使用者名稱或密碼無效。",
      err_net: "發生網路錯誤。", err_input_all: "請填寫所有欄位。", err_len: "密碼長度至少為6個字符。",
      err_match: "兩次輸入的新密碼不一致。", msg_success: "修改成功！正在登入...", lang_label: "繁體中文"
    },
    ko: {
      title_login: "로그인", ph_user: "사용자 이름", ph_pass: "비밀번호", btn_login: "로그인", link_support: "로그인할 수 없습니까?",
      title_force: "비밀번호 변경", desc_force: "보안을 위해 초기 비밀번호를 변경해 주세요.",
      ph_new_pass: "새 비밀번호", ph_conf_pass: "비밀번호 확인", btn_change: "변경 후 로그인",
      msg_logging_in: "로그인 중...", msg_changing: "변경 중...",
      err_empty: "사용자 이름과 비밀번호를 입력해 주세요.", err_invalid: "잘못된 사용자 이름 또는 비밀번호입니다.",
      err_net: "통신 오류가 발생했습니다.", err_input_all: "모든 항목을 입력해 주세요.", err_len: "비밀번호는 6자 이상이어야 합니다.",
      err_match: "비밀번호가 일치하지 않습니다.", msg_success: "변경 완료! 로그인합니다...", lang_label: "한국어"
    },
    ru: {
      title_login: "ВХОД", ph_user: "Имя пользователя", ph_pass: "Пароль", btn_login: "Войти", link_support: "Забыли пароль?",
      title_force: "Смена пароля", desc_force: "В целях безопасности измените начальный пароль.",
      ph_new_pass: "Новый пароль", ph_conf_pass: "Подтвердите пароль", btn_change: "Обновить и войти",
      msg_logging_in: "Вход...", msg_changing: "Обновление...",
      err_empty: "Введите имя пользователя и пароль.", err_invalid: "Неверное имя пользователя или пароль.",
      err_net: "Произошла ошибка сети.", err_input_all: "Заполните все поля.", err_len: "Пароль минимум 6 символов.",
      err_match: "Пароли не совпадают.", msg_success: "Успешно! Выполняется вход...", lang_label: "Русский"
    }
  };

  let CURRENT_LANG = localStorage.getItem('user_lang') || 'ja';
  
  function applyLanguage(lang) {
    CURRENT_LANG = lang;
    localStorage.setItem('user_lang', lang);
    const t = TRANSLATIONS[lang] || TRANSLATIONS.ja;
    
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t[el.getAttribute('data-i18n')]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t[el.getAttribute('data-i18n-ph')]; });
    document.getElementById('currentLangLabel').textContent = t.lang_label;
    document.documentElement.lang = lang;
  }

  // 言語セレクター
  const langTrigger = document.getElementById('langTrigger');
  const langMenu = document.getElementById('langMenu');
  langTrigger.addEventListener('click', (e) => { e.stopPropagation(); langMenu.classList.toggle('open'); });
  document.querySelectorAll('.lang-option').forEach(opt => {
    opt.addEventListener('click', () => { applyLanguage(opt.getAttribute('data-value')); langMenu.classList.remove('open'); });
  });
  document.addEventListener('click', (e) => { if (!langTrigger.contains(e.target)) langMenu.classList.remove('open'); });

  applyLanguage(CURRENT_LANG);

  // 認証ロジック
  const API_URL = "api/proxy";
  let tempChangeData = null;

  document.getElementById('btnAuthAction').addEventListener('click', async () => {
      const email = document.getElementById('inputEmail').value.trim();
      const pass = document.getElementById('inputPass').value.trim();
      const statusEl = document.getElementById('authStatus');
      const btn = document.getElementById('btnAuthAction');
      const t = TRANSLATIONS[CURRENT_LANG];
      
      if (!email || !pass) { statusEl.textContent = t.err_empty; return; }
      
      btn.disabled = true;
      btn.innerHTML = `<span>${t.msg_logging_in}</span>`;
      
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'user_login', email: email, password: pass })
        });
        const data = await res.json();
        
        if (data.success) {
          if (data.requirePasswordChange) {
              tempChangeData = { userId: data.userId, oldPassword: pass };
              document.getElementById('loginView').style.display = 'none';
              document.getElementById('forcePasswordChangeView').style.display = 'flex';
              return; 
          }
          localStorage.setItem('user_session_identity', JSON.stringify({ userId: data.userId, email: email }));
          localStorage.setItem('user_session_token', data.token);
          window.location.href = 'index.html';
        } else { 
          // サーバーから英語エラーが返ってきたら、多言語辞書（t.err_invalid）に変換する
          const msg = (data.message || "").toLowerCase();
          if (msg.includes('invalid') || msg.includes('not found') || msg.includes('incorrect')) {
              statusEl.textContent = t.err_invalid;
          } else {
              statusEl.textContent = t.err_invalid; // 予期せぬエラーもとりあえず無効扱いにする
          }
        }
      } catch (e) { 
        statusEl.textContent = t.err_net; 
      } finally { 
        btn.disabled = false; 
        btn.innerHTML = `<span data-i18n="btn_login">${t.btn_login}</span>`;
      }
  });

  document.getElementById('btnSubmitNewPass').addEventListener('click', async () => {
    const newPass = document.getElementById('newPassInput').value.trim();
    const confirmPass = document.getElementById('newPassConfirm').value.trim();
    const errObj = document.getElementById('newPassError');
    const btn = document.getElementById('btnSubmitNewPass');
    const t = TRANSLATIONS[CURRENT_LANG];
    
    if(!newPass || !confirmPass) { errObj.textContent = t.err_input_all; return; }
    if(newPass.length < 6) { errObj.textContent = t.err_len; return; }
    if(newPass !== confirmPass) { errObj.textContent = t.err_match; return; }
    
    btn.innerHTML = `<span>${t.msg_changing}</span>`;
    btn.disabled = true;
    
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                type: 'change_password', 
                userId: tempChangeData.userId, 
                oldPassword: tempChangeData.oldPassword, 
                newPassword: newPass 
            })
        });
        const data = await res.json();
        
        if (data.success) {
            errObj.style.color = "var(--success)";
            errObj.textContent = t.msg_success;
            setTimeout(() => {
                document.getElementById('inputPass').value = newPass;
                document.getElementById('forcePasswordChangeView').style.display = 'none';
                document.getElementById('loginView').style.display = 'flex';
                document.getElementById('btnAuthAction').click();
            }, 1000);
        } else {
            errObj.textContent = data.message;
            btn.innerHTML = `<span data-i18n="btn_change">${t.btn_change}</span>`;
            btn.disabled = false;
        }
    } catch(e) {
        errObj.textContent = t.err_net;
        btn.innerHTML = `<span data-i18n="btn_change">${t.btn_change}</span>`;
        btn.disabled = false;
    }
  });

  document.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') {
          if(document.getElementById('loginView').style.display !== 'none') document.getElementById('btnAuthAction').click();
          else if(document.getElementById('forcePasswordChangeView').style.display !== 'none') document.getElementById('btnSubmitNewPass').click();
      }
  });
</script>
</body>
</html>
