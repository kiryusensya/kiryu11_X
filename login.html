<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login // Enterprise</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  /* --- FONT FACE DEFINITIONS (index.htmlと統一) --- */
  @font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Medium.woff') format('woff'); font-weight: 500; font-style: normal; }
  @font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }

  /* --- THEME VARIABLES --- */
  :root { 
    --primary: #007DFF; 
    --bg-color: #121212; 
    --modal-text-main: #FFFFFF; 
    --modal-text-sub: #A0A0A0; 
    --danger: #FF3B30;
    --success: #04CF22;
    --card-bg: rgba(40, 40, 40, 0.5);
    --card-border: rgba(255, 255, 255, 0.1);
    --input-bg: rgba(255, 255, 255, 0.1);
    
    /* 言語ごとのフォント設定 */
    --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif;
  }
  
  :root:lang(ja) { --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif; }
  :root:lang(zh) { --font-stack: 'HarmonyOS Sans', 'HarmonyOS Sans SC', sans-serif; }
  :root:lang(zh-TW) { --font-stack: 'HarmonyOS Sans', 'HarmonyOS Sans TC', sans-serif; }
  :root:lang(ko) { --font-stack: 'HarmonyOS Sans', 'Noto Sans KR', sans-serif; }
  :root:lang(ru) { --font-stack: 'HarmonyOS Sans', sans-serif; }
  :root:lang(en) { --font-stack: 'HarmonyOS Sans', sans-serif; }

  [data-theme="light"] {
    --bg-color: #F1F3F5;
    --modal-text-main: #000000;
    --modal-text-sub: #666666;
    --card-bg: rgba(255, 255, 255, 0.6);
    --card-border: rgba(255, 255, 255, 0.6);
    --input-bg: rgba(128, 128, 128, 0.1);
  }

  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body { 
    font-family: var(--font-stack); 
    background-color: var(--bg-color); 
    color: var(--modal-text-main); 
    margin: 0; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    overflow: hidden;
    transition: background-color 0.5s ease;
  }

  /* 背景パーティクル */
  #particleCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; opacity: 0.4; pointer-events: none;
    filter: blur(60px);
  }

  /* 上部コントロール（言語・テーマ切り替え） */
  .top-controls {
    position: absolute; top: 24px; right: 24px; z-index: 100;
    display: flex; gap: 12px; align-items: center;
  }

  .ctrl-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; 
    background: var(--card-bg); border: 1px solid var(--card-border);
    height: 44px; border-radius: 50px; color: var(--modal-text-main); font-size: 13px; font-weight: 700;
    cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: var(--font-stack);
  }
  .ctrl-btn:hover { transform: scale(1.05); background: rgba(128,128,128,0.2); }
  .ctrl-btn.icon-only { width: 44px; padding: 0; }
  .ctrl-btn.lang-trigger { padding: 0 16px; }

  .lang-menu {
    position: absolute; top: 100%; right: 0; margin-top: 8px; width: 140px; background: var(--card-bg);
    border: 1px solid var(--card-border); border-radius: 16px; backdrop-filter: blur(20px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3); list-style: none; padding: 6px; display: none;
  }
  .lang-menu.open { display: block; animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  .lang-option {
    padding: 10px 12px; font-size: 13px; font-weight: 700; color: var(--modal-text-main); border-radius: 10px; cursor: pointer; transition: 0.2s;
    font-family: var(--font-stack);
  }
  .lang-option:hover { background: rgba(128,128,128,0.15); }

  /* メインレイアウト */
  .login-wrapper {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 420px; /* スマホ時の最大幅 */
    animation: slideUpFade 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  
  .login-card { 
    background: var(--card-bg); 
    border: 1px solid var(--card-border); 
    border-radius: 32px; 
    display: flex;
    flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
  }
  
  .login-content {
      padding: 50px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
  }

  /* PC向け 2カラムレイアウト (固定幅800px、隙間なく画像を敷き詰める) */
  .login-image-side { display: none; }

  @media (min-width: 769px) {
      .login-wrapper { 
          width: 800px; 
          max-width: none; 
      }
      .login-card { 
          flex-direction: row; 
          min-height: 500px; 
          border-radius: 24px; 
          align-items: stretch;
      }
      .login-wrapper:hover .login-card {
          transform: translateY(-5px);
          box-shadow: 0 40px 100px rgba(0,0,0,0.5);
      }
      [data-theme="light"] .login-wrapper:hover .login-card { box-shadow: 0 40px 100px rgba(0,0,0,0.15); }

      .login-content { 
          width: 50%; 
          padding: 60px 50px; 
      }
      .login-image-side {
          display: block; 
          width: 50%;
          position: relative; overflow: hidden;
          background: rgba(128,128,128,0.05);
          border-left: 1px solid rgba(128,128,128,0.1);
      }
      .login-image-side img {
          position: absolute;
          top: 0; left: 0; width: 100%; height: 100%;
          object-fit: cover; /* ★画像を枠にピッタリ合わせ、はみ出た分をトリミング */
      }
  }

  /* タイトル・テキスト */
  h1 { margin: 0 0 10px 0; font-size: 32px; font-weight: 800; font-family: var(--font-stack); }
  .desc { font-size: 13px; font-weight: 500; color: var(--modal-text-sub); margin: 0 0 30px 0; line-height: 1.6; }
  
  /* 入力フォーム (角丸) */
  .form-group { margin-bottom: 20px; text-align: left; }
  input {
    width: 100%; height: 56px; background: var(--input-bg); border: none;
    border-radius: 50px; color: var(--modal-text-main); padding: 0 24px; font-size: 16px; 
    outline: none; transition: 0.3s; font-family: var(--font-stack); font-weight: 700;
  }
  input::placeholder { color: var(--modal-text-sub); font-weight: 500; font-size: 14px; }
  input:focus { background: rgba(0, 125, 255, 0.1); color: var(--primary); }

  /* ボタン */
  button.btn-primary {
    height: 56px; border-radius: 50px; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.2s;
    border: none; display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 10px;
    background: var(--primary); color: white; font-family: var(--font-stack);
  }
  button.btn-primary:active { transform: scale(0.96); }
  
  /* メッセージ */
  .msg { margin-bottom: 16px; font-size: 13px; font-weight: 700; min-height: 18px; text-align: left; color: var(--danger); font-family: var(--font-stack); }

  /* スポットライト・ホバー効果 */
  .spotlight-hover { position: relative; overflow: hidden; }
  .spotlight-hover::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(150px circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.2), transparent 40%);
      z-index: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
  }
  [data-theme="light"] .spotlight-hover::before {
      background: radial-gradient(150px circle at var(--x, 50%) var(--y, 50%), rgba(0,0,0,0.1), transparent 40%);
  }
  .spotlight-hover:hover::before { opacity: 1; }
  .spotlight-hover > * { position: relative; z-index: 1; }

  /* アニメーション */
  @keyframes slideUpFade { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .loading-dots::after { content: ''; animation: dots-loop 1.5s infinite steps(1); display: inline-block; width: 1em; text-align: left; }
  @keyframes dots-loop { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } 100% { content: ''; } }
</style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="top-controls">
    <button class="ctrl-btn icon-only spotlight-hover" id="themeToggle" aria-label="Toggle Theme">
      <i data-lucide="moon" id="themeIcon"></i>
    </button>
    <div style="position: relative;">
      <button class="ctrl-btn lang-trigger spotlight-hover" id="langTrigger">
        <i data-lucide="globe" style="width: 16px; height: 16px;"></i>
        <span id="currentLangLabel">日本語</span>
        <i data-lucide="chevron-down" style="width: 14px; height: 14px; opacity: 0.5;"></i>
      </button>
      <ul class="lang-menu" id="langMenu">
        <li class="lang-option" data-value="ja">日本語</li>
        <li class="lang-option" data-value="en">English</li>
        <li class="lang-option" data-value="zh">简体中文</li>
        <li class="lang-option" data-value="zh-TW">繁體中文</li>
        <li class="lang-option" data-value="ko">한국어</li>
        <li class="lang-option" data-value="ru">Русский</li>
      </ul>
    </div>
  </div>

  <div class="login-wrapper">
    
    <div class="login-card" id="loginView">
      <div class="login-content">
        <h1 data-i18n="title_login">ログイン</h1>
        <p class="desc" data-i18n="desc_login">利用するにはアカウントが必要です。</p>
        
        <div id="authStatus" class="msg"></div>
        
        <div class="form-group">
          <input type="email" id="inputEmail" placeholder="ユーザー名" data-i18n-ph="ph_user">
        </div>
        <div class="form-group">
          <input type="password" id="inputPass" placeholder="パスワード" data-i18n-ph="ph_pass">
        </div>
        
        <button id="btnAuthAction" class="btn-primary spotlight-hover">
          <span data-i18n="btn_login">ログイン</span>
        </button>
        
        <div style="margin-top: 24px; font-size: 13px; font-weight: 700; color: var(--modal-text-sub); text-align: center; font-family: var(--font-stack);">
            <a href="support.html" style="color: var(--primary); text-decoration: none;" data-i18n="link_support">ログインできない場合はこちら</a>
        </div>
      </div>
      <div class="login-image-side">
        <img src="https://static.wixstatic.com/media/2f0694_532df990e3f24acbb7c4e1130529cef7~mv2.jpg" alt="Background">
      </div>
    </div>

    <div class="login-card" id="forcePasswordChangeView" style="display:none;">
      <div class="login-content">
        <h1 style="font-size: 24px;" data-i18n="title_force">パスワードの変更</h1>
        <p class="desc" data-i18n="desc_force">セキュリティのため、初期パスワードからの変更をお願いします。</p>
        
        <div id="newPassError" class="msg"></div>

        <div class="form-group">
          <input type="password" id="newPassInput" placeholder="新しいパスワード" data-i18n-ph="ph_new_pass">
        </div>
        <div class="form-group">
          <input type="password" id="newPassConfirm" placeholder="新しいパスワード(確認用)" data-i18n-ph="ph_conf_pass">
        </div>
        
        <button id="btnSubmitNewPass" class="btn-primary spotlight-hover">
            <span data-i18n="btn_change">変更してログイン</span>
        </button>
      </div>
      <div class="login-image-side">
        <img src="https://static.wixstatic.com/media/2f0694_532df990e3f24acbb7c4e1130529cef7~mv2.jpg" alt="Background">
      </div>
    </div>
    
  </div>

<script>
  lucide.createIcons();
  
  if (localStorage.getItem('user_session_token')) {
      window.location.replace('index.html');
  }

  // ===== Micro-Interactions (スポットライトホバー) =====
  const setupHoverEffects = () => {
      document.querySelectorAll('.spotlight-hover').forEach(el => {
          el.addEventListener('mousemove', (e) => {
              const rect = el.getBoundingClientRect();
              el.style.setProperty('--x', `${e.clientX - rect.left}px`);
              el.style.setProperty('--y', `${e.clientY - rect.top}px`);
          });
      });
  };
  setupHoverEffects();

  // ===== テーマ設定 =====
  const htmlEl = document.documentElement;
  const themeIcon = document.getElementById('themeIcon');
  let particleHue = 210;

  function applyTheme(theme) {
    htmlEl.setAttribute('data-theme', theme);
    if(themeIcon) themeIcon.setAttribute('data-lucide', theme === 'light' ? 'sun' : 'moon');
    particleHue = theme === 'light' ? 210 : 220;
    lucide.createIcons();
  }

  const savedTheme = localStorage.getItem('user_theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    localStorage.setItem('user_theme', next);
    applyTheme(next);
  });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('user_theme')) applyTheme(e.matches ? 'dark' : 'light');
  });

  // ===== 背景アニメーション (index.html準拠のパーティクル) =====
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  class Particle {
    constructor() { this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.size=Math.random()*150+50; this.speedX=Math.random()*0.2-0.1; this.speedY=Math.random()*0.2-0.1; this.opacity=Math.random()*0.3+0.1; }
    update() { this.x+=this.speedX; this.y+=this.speedY; if(this.x<0||this.x>canvas.width)this.speedX*=-1; if(this.y<0||this.y>canvas.height)this.speedY*=-1; }
    draw() { ctx.fillStyle=`hsla(${particleHue}, 100%, 50%, ${this.opacity*0.2})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
  }
  let p = []; for(let i=0;i<8;i++) p.push(new Particle());
  function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); p.forEach(i=>{i.update();i.draw();}); requestAnimationFrame(animate); }
  window.addEventListener('resize', () => { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }); animate();

  // ===== 翻訳データ =====
  const TRANSLATIONS = {

      err_match: "비밀번호가 일치하지 않습니다.", msg_success: "변경 완료! 로그인합니다...", lang_label: "한국어"
    },
    ru: {
      title_login: "Вход", ph_user: "Имя пользователя", ph_pass: "Пароль", btn_login: "Войти", link_support: "Забыли пароль?", desc_login: "Для использования требуется учетная запись.",
      title_force: "Смена пароля", desc_force: "В целях безопасности измените начальный пароль.",
      ph_new_pass: "Новый пароль", ph_conf_pass: "Подтвердите пароль", btn_change: "Обновить и войти",
      msg_logging_in: "Вход", msg_changing: "Обновление...",
      err_empty: "Введите имя пользователя и пароль.", err_invalid: "Неверное имя пользователя или пароль.",
      err_net: "Произошла ошибка сети.", err_input_all: "Заполните все поля.", err_len: "Пароль минимум 6 символов.",
      err_match: "Пароли не совпадают.", msg_success: "Успешно! Выполняется вход...", lang_label: "Русский"
    }
  };

  let CURRENT_LANG = localStorage.getItem('user_lang') || 'ja';
  
  function applyLanguage(lang) {
    CURRENT_LANG = lang;
    localStorage.setItem('user_lang', lang);
    const t = TRANSLATIONS[lang] || TRANSLATIONS.ja;
    
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t[el.getAttribute('data-i18n')]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t[el.getAttribute('data-i18n-ph')]; });
    document.getElementById('currentLangLabel').textContent = t.lang_label;
    document.documentElement.lang = lang;
  }

  // 言語セレクター
  const langTrigger = document.getElementById('langTrigger');
  const langMenu = document.getElementById('langMenu');
  langTrigger.addEventListener('click', (e) => { e.stopPropagation(); langMenu.classList.toggle('open'); });
  document.querySelectorAll('.lang-option').forEach(opt => {
    opt.addEventListener('click', () => { applyLanguage(opt.getAttribute('data-value')); langMenu.classList.remove('open'); });
  });
  document.addEventListener('click', (e) => { if (!langTrigger.contains(e.target)) langMenu.classList.remove('open'); });

  applyLanguage(CURRENT_LANG);

  // ===== 認証ロジック =====
  const API_URL = "api/proxy";
  let tempChangeData = null;

  document.getElementById('btnAuthAction').addEventListener('click', async () => {
      const email = document.getElementById('inputEmail').value.trim();
      const pass = document.getElementById('inputPass').value.trim();
      const statusEl = document.getElementById('authStatus');
      const btn = document.getElementById('btnAuthAction');
      const t = TRANSLATIONS[CURRENT_LANG];
      
      if (!email || !pass) { statusEl.textContent = t.err_empty; return; }
      
      btn.disabled = true;
      btn.innerHTML = `<span class="loading-dots">${t.msg_logging_in}</span>`;
      
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'user_login', email: email, password: pass })
        });
        const data = await res.json();
        
        if (data.success) {
          if (data.requirePasswordChange) {
              tempChangeData = { userId: data.userId, oldPassword: pass };
              document.getElementById('loginView').style.display = 'none';
              document.getElementById('forcePasswordChangeView').style.display = 'flex';
              return; 
          }
          localStorage.setItem('user_session_identity', JSON.stringify({ userId: data.userId, email: email }));
          localStorage.setItem('user_session_token', data.token);
          window.location.href = 'index.html';
        } else { 
          const msg = (data.message || "").toLowerCase();
          if (msg.includes('invalid') || msg.includes('not found') || msg.includes('incorrect') || msg.includes('無効')) {
              statusEl.textContent = t.err_invalid;
          } else {
              statusEl.textContent = t.err_invalid;
          }
        }
      } catch (e) { 
        statusEl.textContent = t.err_net; 
      } finally { 
        btn.disabled = false; 
        btn.innerHTML = `<span data-i18n="btn_login">${t.btn_login}</span>`;
      }
  });

  document.getElementById('btnSubmitNewPass').addEventListener('click', async () => {
    const newPass = document.getElementById('newPassInput').value.trim();
    const confirmPass = document.getElementById('newPassConfirm').value.trim();
    const errObj = document.getElementById('newPassError');
    const btn = document.getElementById('btnSubmitNewPass');
    const t = TRANSLATIONS[CURRENT_LANG];
    
    if(!newPass || !confirmPass) { errObj.textContent = t.err_input_all; return; }
    if(newPass.length < 6) { errObj.textContent = t.err_len; return; }
    if(newPass !== confirmPass) { errObj.textContent = t.err_match; return; }
    
    btn.innerHTML = `<span class="loading-dots">${t.msg_changing}</span>`;
    btn.disabled = true;
    
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                type: 'change_password', 
                userId: tempChangeData.userId, 
                oldPassword: tempChangeData.oldPassword, 
                newPassword: newPass 
            })
        });
        const data = await res.json();
        
        if (data.success) {
            errObj.style.color = "var(--success)";
            errObj.textContent = t.msg_success;
            setTimeout(() => {
                document.getElementById('inputPass').value = newPass;
                document.getElementById('forcePasswordChangeView').style.display = 'none';
                document.getElementById('loginView').style.display = 'flex';
                document.getElementById('btnAuthAction').click();
            }, 1000);
        } else {
            errObj.textContent = data.message;
            btn.innerHTML = `<span data-i18n="btn_change">${t.btn_change}</span>`;
            btn.disabled = false;
        }
    } catch(e) {
        errObj.textContent = t.err_net;
        btn.innerHTML = `<span data-i18n="btn_change">${t.btn_change}</span>`;
        btn.disabled = false;
    }
  });

  document.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') {
          if(document.getElementById('loginView').style.display !== 'none') document.getElementById('btnAuthAction').click();
          else if(document.getElementById('forcePasswordChangeView').style.display !== 'none') document.getElementById('btnSubmitNewPass').click();
      }
  });
</script>
</body>
</html>
