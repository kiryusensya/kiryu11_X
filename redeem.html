<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>kiryu10 // Secure Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
/* --- FONT FACE DEFINITIONS --- */
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Medium.woff') format('woff'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }

/* --- THEME VARIABLES --- */
:root {
  --primary: #FFFFFF;
  --bg-color: #050505; /* より深い黒へ */
  --card-bg: rgba(15, 15, 15, 0.4);
  --card-border: rgba(255, 255, 255, 0.1);
  --modal-text-main: #FFFFFF;
  --modal-text-sub: #A0A0A0;
  --dropdown-bg: rgba(15, 15, 15, 0.95);
  
  /* Neon Colors */
  --error-color: #FF2D55;
  --error-glow: rgba(255, 45, 85, 0.5);
  --success-color: #04CF22;
  --success-glow: rgba(4, 207, 34, 0.5);
  
  --spring-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif;
}

:root:lang(ja) { --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif; }
:root:lang(en) { --font-stack: 'HarmonyOS Sans', sans-serif; }
:root:lang(zh) { --font-stack: 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif; }
:root:lang(zh-TW) { --font-stack: 'HarmonyOS Sans TC', 'Microsoft JhengHei', sans-serif; }
:root:lang(ko) { --font-stack: 'HarmonyOS Sans', 'Noto Sans KR', sans-serif; }
:root:lang(ru) { --font-stack: 'HarmonyOS Sans', sans-serif; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0; padding: 0;
  background-color: var(--bg-color);
  color: var(--modal-text-main);
  font-family: var(--font-stack);
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Background Blurs */
.bg-blobs {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: 
    radial-gradient(circle at 15% 50%, rgba(255,255,255,0.03) 0%, transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(255,255,255,0.02) 0%, transparent 40%);
}

/* --- HEADER --- */
header {
  position: relative; z-index: 100;
  padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
}
.brand { 
  font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; 
  letter-spacing: 1px; color: #FFFFFF;
}
.header-actions { display: flex; gap: 15px; align-items: center; }

.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: 0.3s; color: var(--modal-text-main);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.05); }

/* --- DROPDOWNS --- */
.dropdown-menu {
  position: absolute; top: 75px; right: 40px; width: 300px;
  background: var(--dropdown-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--card-border); border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8); padding: 20px;
  z-index: 2000; opacity: 0; transform: translateY(-10px); pointer-events: none;
  transition: 0.3s var(--spring-ease);
}
.dropdown-menu.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
.lang-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.lang-list li { padding: 12px 15px; cursor: pointer; border-radius: 8px; font-weight: 700; font-size: 14px; transition: 0.2s; color: #fff;}
.lang-list li:hover { background: rgba(255,255,255,0.1); }

.account-info { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 15px; }
.mini-user-id { font-size: 16px; font-weight: 800; word-break: break-all; display: block; margin-bottom: 5px;}
.pts-display { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 5px; opacity: 0.8; }

.menu-btn {
  width: 100%; background: transparent; border: none; text-align: left;
  padding: 12px; font-size: 15px; font-weight: 700; color: var(--modal-text-main);
  cursor: pointer; border-radius: 8px; display: flex; justify-content: space-between;
  align-items: center; transition: 0.2s; font-family: var(--font-stack);
}
.menu-btn:hover { background: rgba(255,255,255,0.1); }
.menu-btn.logout { color: var(--error-color); margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); border-radius: 0 0 8px 8px; padding-top: 15px;}
.menu-btn.logout:hover { background: rgba(255, 45, 85, 0.1); }

/* --- MAIN REDEEM AREA --- */
main {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 10; padding: 20px; overflow-y: auto;
}

/* Base Card (Frosted Glass, No Neon) */
.redeem-card {
  background: var(--card-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--card-border); border-radius: 20px;
  padding: 50px; width: 100%; max-width: 550px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02); 
  position: relative; overflow: hidden;
  transition: max-width 0.4s var(--spring-ease), border-color 0.4s, box-shadow 0.4s;
}
.redeem-card.is-wide { max-width: 750px; }

/* Dynamic Glow States (Triggered via JS) */
.redeem-card.glow-error {
  border-color: rgba(255, 45, 85, 0.5);
  box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 30px rgba(255, 45, 85, 0.1), inset 0 0 20px rgba(255, 45, 85, 0.1);
}
.redeem-card.glow-success {
  border-color: rgba(4, 207, 34, 0.5);
  box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 30px rgba(4, 207, 34, 0.1), inset 0 0 20px rgba(4, 207, 34, 0.1);
}

/* Phase Containers */
.phase-container { display: none; opacity: 0; transition: opacity 0.3s ease; flex-direction: column; position: relative; z-index: 2; }
.phase-container.active { display: flex; opacity: 1; }

/* 1. Input Phase (Strict & Solid) */
.keyhole-icon { text-align: center; margin-bottom: 20px; opacity: 0.8; }
.phase-title { font-size: 24px; font-weight: 800; margin: 0 0 10px; text-align: center; letter-spacing: 2px; }
.phase-desc { font-size: 13px; color: var(--modal-text-sub); margin: 0 0 40px; text-align: center; font-weight: 500; }

.secure-input-group { margin-bottom: 30px; }
.secure-input {
  width: 100%; height: 70px; border-radius: 12px;
  background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
  text-align: center; font-size: 24px; font-weight: 800; letter-spacing: 4px;
  color: #fff; outline: none; transition: 0.3s;
  font-family: monospace, var(--font-stack); text-transform: uppercase;
}
.secure-input::placeholder { color: rgba(255,255,255,0.2); font-weight: 500; letter-spacing: 2px; }
.secure-input:focus { border-color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.8); }

/* Buttons */
.action-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 56px; border-radius: 12px; font-size: 16px; font-weight: 800;
  cursor: pointer; transition: 0.3s; font-family: var(--font-stack); text-decoration: none;
  flex: 1; /* バグ修正: 全てのボタンの幅を均等に */
}
.action-btn:active { transform: translateY(1px); }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-solid-white { background: #FFFFFF; color: #000000; border: none; }
.btn-solid-white:hover { background: #E0E0E0; transform: translateY(-2px); }

.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #FFFFFF; }
.btn-outline:hover { background: rgba(255,255,255,0.1); border-color: #FFFFFF; }

/* Neon Buttons (For Error/Success) */
.btn-neon-red { background: var(--error-color); color: #FFFFFF; border: none; box-shadow: 0 0 20px var(--error-glow); }
.btn-neon-red:hover { filter: brightness(1.2); box-shadow: 0 0 30px var(--error-glow); transform: translateY(-2px); }

/* Split Layout (For Preview, Success, Error) */
.split-layout { display: flex; gap: 40px; text-align: left; align-items: stretch; }
.split-left { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; }
.split-left img { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
.split-right { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }

.content-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.5); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.content-title { font-size: 24px; font-weight: 800; margin: 0 0 20px; line-height: 1.4; word-break: break-word; }

/* Info Boxes */
.info-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 25px; font-size: 14px; font-weight: 500; line-height: 1.6; white-space: pre-wrap; }
.info-box.error { background: rgba(255, 45, 85, 0.05); border-color: rgba(255, 45, 85, 0.3); color: #FFFFFF; }
.time-stamp { font-size: 12px; font-weight: 700; margin-top: 15px; letter-spacing: 1px; }

.action-row { display: flex; gap: 15px; width: 100%; margin-top: auto; }

/* 2. Error Phase (Matches Screenshot) */
.error-neon-title {
  font-size: 26px; font-weight: 800; margin-bottom: 25px;
  color: var(--error-color); text-shadow: 0 0 15px var(--error-glow);
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.error-denied-label { color: var(--error-color); font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

/* 3. Success Phase */
.success-neon-title {
  font-size: 26px; font-weight: 800; margin-bottom: 20px; text-align: left;
  color: var(--success-color); text-shadow: 0 0 15px var(--success-glow);
  display: flex; align-items: center; gap: 10px;
}
.success-info-box { background: rgba(4, 207, 34, 0.05); border: 1px solid rgba(4, 207, 34, 0.3); border-radius: 12px; padding: 20px; margin-bottom: 25px; font-size: 14px; }

/* Mobile Optimization */
@media (max-width: 768px) {
  header { padding: 15px 20px; }
  .brand { font-size: 18px; }
  main { padding: 15px; align-items: flex-start; }
  .redeem-card { padding: 30px 20px; border-radius: 16px; border: none; background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  
  .secure-input { height: 60px; font-size: 20px; letter-spacing: 2px; }
  .action-btn { height: 50px; font-size: 14px; }
  
  .split-layout { flex-direction: column; gap: 20px; }
  .split-left { width: 100%; }
  .split-left img { height: 180px; }
  .content-title { font-size: 20px; }
  
  /* スマホ時はボタンを縦並びに（バグ修正） */
  .action-row { flex-direction: column-reverse; gap: 10px; }
  .dropdown-menu { width: 260px; right: 20px; top: 65px; }
  .error-neon-title { font-size: 22px; }
}

/* Modals for Account/History */
.sys-modal {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 9999; display: flex; justify-content: center; align-items: center;
  opacity: 0; pointer-events: none; transition: 0.4s;
}
.sys-modal.active { opacity: 1; pointer-events: auto; }
.sys-modal-content {
  background: var(--card-bg); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--card-border); border-radius: 20px;
  padding: 40px; width: 90%; max-width: 500px; position: relative;
  transform: translateY(30px) scale(0.95); transition: 0.4s var(--spring-ease);
  box-shadow: var(--shadow-base); max-height: 85vh; display: flex; flex-direction: column;
}
.sys-modal.active .sys-modal-content { transform: translateY(0) scale(1); }
.close-modal { position: absolute; top: 20px; right: 20px; cursor: pointer; opacity: 0.5; transition: 0.2s; }
.close-modal:hover { opacity: 1; color: #fff; }

.form-group { margin-bottom: 15px; text-align: left; }
.form-input { 
  width: 100%; height: 50px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); 
  background: rgba(0,0,0,0.5); padding: 0 15px; color: #fff; font-family: inherit; font-size: 14px; outline: none; transition: 0.3s;
}
.form-input:focus { border-color: rgba(255,255,255,0.5); }

.history-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
.history-item { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; display: flex; gap: 15px; align-items: center; transition: 0.2s;}
.history-item:hover { border-color: rgba(255,255,255,0.2); }
.history-item img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
.history-info { flex: 1; min-width: 0; }
.history-title { font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px;}
.history-meta { font-size: 11px; font-weight: 700; opacity: 0.6; display: flex; justify-content: space-between;}

.loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.2); border-top: 3px solid currentColor; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-blobs"></div>

<header>
  <div class="brand"><i data-lucide="scan-line"></i> kiryu10</div>
  <div class="header-actions">
    <div style="position: relative;">
      <button class="icon-btn" id="langToggle" title="Language">
        <i data-lucide="globe"></i>
      </button>
      <div class="dropdown-menu" id="langMenu">
        <ul class="lang-list">
          <li data-val="ja">日本語</li>
          <li data-val="en">English</li>
          <li data-val="zh">简体中文</li>
          <li data-val="zh-TW">繁體中文</li>
          <li data-val="ko">한국어</li>
          <li data-val="ru">Русский</li>
        </ul>
      </div>
    </div>
    <div style="position: relative;">
      <button class="icon-btn" id="accountToggle" title="Account">
        <i data-lucide="fingerprint"></i>
      </button>
      <div class="dropdown-menu" id="accountMenu">
        <div class="account-info">
          <span style="font-size:11px; font-weight:700; opacity:0.5; margin-bottom:4px; display:block;" data-translate="label_logged_in">USER ID</span>
          <span class="mini-user-id" id="dispUserId">-</span>
          <span class="pts-display"><i data-lucide="zap" style="width:14px;height:14px;"></i> <span id="dispPoints">0</span> pt</span>
        </div>
        <button class="menu-btn" id="btnHistory"><span data-translate="btn_history">利用履歴</span> <i data-lucide="history" style="width:16px; opacity:0.5;"></i></button>
        <button class="menu-btn" id="btnPassword"><span data-translate="modal_acc_change_pass">パスワード変更</span> <i data-lucide="key-round" style="width:16px; opacity:0.5;"></i></button>
        <button class="menu-btn logout" id="btnLogout"><span data-translate="btn_logout">ログアウト</span> <i data-lucide="power" style="width:16px; opacity:0.5;"></i></button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="redeem-card" id="mainCard">
    
    <div class="phase-container active" id="phaseInput">
      <div class="keyhole-icon"><i data-lucide="key-round" style="width:40px;height:40px;color:#fff;"></i></div>
      <h1 class="phase-title" data-translate="modal_title">コード引き換え</h1>
      <p class="phase-desc" data-translate="modal_sub">プロダクトキーを入力してアクセス権限を証明してください。</p>
      
      <div class="secure-input-group">
        <input type="text" id="activationCode" class="secure-input" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
      </div>
      
      <button class="action-btn btn-solid-white" id="btnCheck">
        <i data-lucide="unlock" style="width:18px;height:18px;"></i> <span data-translate="modal_btn_auth">確認</span>
      </button>
    </div>

    <div class="phase-container" id="phasePreview">
      <h2 class="phase-title" style="text-align:left; font-size:22px; margin-bottom:20px;" data-translate="preview_title">引き換えの確認</h2>
      <div class="split-layout">
        <div class="split-left">
          <img id="prevImg" src="" alt="Preview">
        </div>
        <div class="split-right">
          <p class="content-label"><i data-lucide="info" style="width:12px; vertical-align:text-bottom;"></i> <span data-translate="preview_desc">続行すると以下のコンテンツを受け取ります:</span></p>
          <h3 class="content-title" id="prevTitle">Title</h3>
          <div class="info-box" id="prevWarning" style="display:none; padding:15px; border:none;"></div>
          <div class="action-row">
            <button class="action-btn btn-outline" onclick="resetToInput(false)" data-translate="btn_close">キャンセル</button>
            <button class="action-btn btn-solid-white" id="btnRedeem"><span data-translate="btn_continue">認証する</span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="phase-container" id="phaseSuccess">
      <h2 class="success-neon-title"><i data-lucide="check-circle" style="width:28px;height:28px;"></i> <span data-translate="success_title_final">認証成功!!</span></h2>
      <div class="split-layout">
        <div class="split-left">
          <img id="succImg" src="" alt="Success">
        </div>
        <div class="split-right">
          <p class="content-label" style="color:var(--success-color);"><span data-translate="success_desc">以下のコンテンツが有効になりました:</span></p>
          <h3 class="content-title" id="succTitle">Title</h3>
          <div class="success-info-box">
            <span id="succMsg"></span>
            <div class="time-stamp" id="succTime" style="color:var(--success-color);"></div>
          </div>
          <div class="action-row">
            <button class="action-btn btn-outline" onclick="resetToInput(true)" data-translate="btn_close">閉じる</button>
            <a href="#" class="action-btn btn-solid-white" id="btnDownload" target="_blank">
              <span data-translate="btn_download">ダウンロード</span> <i data-lucide="download" style="width:18px;"></i>
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="phase-container" id="phaseError">
      <h2 class="error-neon-title">
        ⚠ <span data-translate="error_title_prefix">エラー</span> <span id="errCode"></span>
      </h2>
      <div style="width:100%; text-align:left;">
        <p class="error-denied-label">⚠ ACCESS DENIED</p>
        <h3 class="content-title" id="errTitle">Error Title</h3>
        
        <div class="info-box error">
          <div id="errMsg" style="margin-bottom: 20px;"></div>
          <div class="time-stamp" id="errTime" style="color: var(--error-color); margin-top:0;"></div>
        </div>
        
        <div class="action-row" id="errorBtnRow"></div>
      </div>
    </div>

  </div>
</main>

<div class="sys-modal" id="modHistory">
  <div class="sys-modal-content">
    <i data-lucide="x" class="close-modal" onclick="closeModal('modHistory')"></i>
    <h2 style="margin:0 0 20px; font-size: 20px; font-weight:800; display:flex; align-items:center; gap:8px;">
      <i data-lucide="history"></i> <span data-translate="modal_history_title">利用履歴</span>
    </h2>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<div class="sys-modal" id="modPass">
  <div class="sys-modal-content" style="max-width: 400px;">
    <i data-lucide="x" class="close-modal" onclick="closeModal('modPass')"></i>
    <h2 style="margin:0 0 20px; font-size: 20px; font-weight:800; display:flex; align-items:center; gap:8px;">
      <i data-lucide="key-round"></i> <span data-translate="modal_acc_change_pass">パスワード変更</span>
    </h2>
    <div class="form-group">
      <input type="password" id="passOld" class="form-input" placeholder="現在のパスワード">
    </div>
    <div class="form-group">

// Utilities
const gId = id => document.getElementById(id);
const escapeHTML = str => String(str || "").replace(/[&<>"']/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m]));

function formatCodeInput(val) {
    let clean = (val||"").toUpperCase().replace(/[^A-Z0-9]/g, '');
    let sz = clean.length >= 25 ? 5 : 4; 
    let res = '';
    for(let i=0; i<clean.length; i++) {
        if(i > 0 && i % sz === 0) res += '-';
        res += clean[i];
    }
    return res;
}

function formatLocalTime(dateObj) {
    try {
        const formatter = new Intl.DateTimeFormat('en-US', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hour12: false
        });
        const parts = formatter.formatToParts(dateObj);
        const p = {}; parts.forEach(part => p[part.type] = part.value);
        let hr = p.hour === '24' ? '00' : p.hour;
        return `${p.year}/${p.month}/${p.day} ${hr}:${p.minute}`;
    } catch(e) { return dateObj.toLocaleString(); }
}

async function safeFetch(bodyObj) {
    const token = localStorage.getItem('user_session_token') || "";
    try {
        const res = await fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(bodyObj)
        });
        return await res.json();
    } catch(e) { return { success: false, message: 'Network error' }; }
}

// Initialization
document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    
    // Auth Check: Force Redirect if not logged in
    const sUser = localStorage.getItem('user_session_identity');
    if (!sUser) {
        window.location.href = 'Access.html' + window.location.search;
        return; // Stop execution
    } else {
        currentUser = JSON.parse(sUser);
        gId('dispUserId').textContent = currentUser.email || currentUser.userId;
        fetchUserHistory(); // Fetch points and history
    }

    // Language Setup
    let sLang = localStorage.getItem('user_lang') || 'ja';
    updateLanguage(sLang);

    // Event Listeners
    setupEvents();
    
    // Auto check URL parameter
    const urlCode = new URLSearchParams(window.location.search).get('code');
    if(urlCode) {
        setTimeout(() => {
            const el = gId('activationCode');
            el.value = formatCodeInput(urlCode);
            processCodeCheck(el.value);
        }, 500);
    }
});

function setupEvents() {
    // Dropdowns
    const toggleMenu = (triggerId, menuId) => {
        gId(triggerId).addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.dropdown-menu').forEach(m => {
                if(m.id !== menuId) m.classList.remove('open');
            });
            gId(menuId).classList.toggle('open');
        });
    };
    toggleMenu('langToggle', 'langMenu');
    toggleMenu('accountToggle', 'accountMenu');
    document.addEventListener('click', () => document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open')));

    // Lang select
    document.querySelectorAll('.lang-list li').forEach(li => {
        li.addEventListener('click', () => {
            const lang = li.getAttribute('data-val');
            localStorage.setItem('user_lang', lang);
            updateLanguage(lang);
            fetchUserHistory();
        });
    });

    // Account Actions
    gId('btnLogout').addEventListener('click', () => {
        localStorage.removeItem('user_session_identity');
        localStorage.removeItem('user_session_token');
        window.location.href = 'Access.html';
    });
    gId('btnHistory').addEventListener('click', () => {
        renderHistory();
        gId('modHistory').classList.add('active');
    });
    gId('btnPassword').addEventListener('click', () => {
        gId('passOld').value = ''; gId('passNew').value = ''; gId('passConf').value = '';
        gId('passMsg').textContent = '';
        gId('modPass').classList.add('active');
    });
    gId('btnSubmitPass').addEventListener('click', handlePasswordChange);

    // Input Code
    const inputCode = gId('activationCode');
    inputCode.addEventListener('input', e => e.target.value = formatCodeInput(e.target.value));
    inputCode.addEventListener('keydown', e => { if(e.key === 'Enter') processCodeCheck(inputCode.value); });
    gId('btnCheck').addEventListener('click', () => processCodeCheck(inputCode.value));
    gId('btnRedeem').addEventListener('click', () => processCodeRedeem());
}

function updateLanguage(lang) {
    CURRENT_LANG = lang;
    document.documentElement.lang = lang;
    const t = TRANSLATIONS[lang] || TRANSLATIONS.en;
    document.querySelectorAll('[data-translate]').forEach(el => {
        const k = el.getAttribute('data-translate');
        if (t[k]) el.innerHTML = t[k];
    });
}

// Phase Management
function showPhase(phaseId, isWide = false) {
    document.querySelectorAll('.phase-container').forEach(el => {
        el.style.opacity = '0';
        setTimeout(() => { el.classList.remove('active'); }, 200);
    });
    
    // Clear Glows
    const card = gId('mainCard');
    card.classList.remove('glow-error', 'glow-success');
    
    setTimeout(() => {
        const target = gId(phaseId);
        target.classList.add('active');
        void target.offsetWidth; 
        target.style.opacity = '1';
        
        if(isWide) card.classList.add('is-wide');
        else card.classList.remove('is-wide');
        
        // Add neon glow only for Error / Success
        if(phaseId === 'phaseError') card.classList.add('glow-error');
        if(phaseId === 'phaseSuccess') card.classList.add('glow-success');
    }, 200);
}

function resetToInput(clearCode = false) {
    if(clearCode) {
        gId('activationCode').value = '';
    }
    gId('activationCode').disabled = false;
    gId('btnCheck').disabled = false;
    gId('btnCheck').innerHTML = `<i data-lucide="unlock" style="width:18px;height:18px;"></i> <span data-translate="modal_btn_auth">${TRANSLATIONS[CURRENT_LANG].modal_btn_auth}</span>`;
    lucide.createIcons();
    showPhase('phaseInput', false);
    setTimeout(() => gId('activationCode').focus(), 400);
}

function renderErrorScreen(codeNum, title, message, isOwned) {
    const t = TRANSLATIONS[CURRENT_LANG];
    gId('errCode').textContent = codeNum;
    gId('errTitle').textContent = title;
    gId('errMsg').textContent = message || "Access Denied";
    gId('errTime').textContent = formatLocalTime(new Date());
    
    const btnRow = gId('errorBtnRow');
    // エラー時のボタン分岐 (使用済み・無効 vs 所有済み)
    if (isOwned) {
        btnRow.innerHTML = `
            <button class="action-btn btn-outline" onclick="resetToInput(true)">${t.btn_close}</button>
            <button class="action-btn btn-solid-white" onclick="window.location.href='index.html'">${t.btn_go_home}</button>
        `;
    } else {
        btnRow.innerHTML = `
            <button class="action-btn btn-outline" onclick="resetToInput(false)">${t.btn_close}</button>
            <button class="action-btn btn-neon-red" onclick="resetToInput(true)">${t.btn_retry}</button>
        `;
    }
    showPhase('phaseError', false); // Error phase is not wide
}

// API Interactions
async function processCodeCheck(code) {
    const safeCode = formatCodeInput(code);
    if (!safeCode) return;
    
    const t = TRANSLATIONS[CURRENT_LANG];
    const btn = gId('btnCheck');
    
    btn.disabled = true; gId('activationCode').disabled = true;
    btn.innerHTML = `<div class="loading-spinner"></div>`;

    const d = await safeFetch({ type: 'check', userId: currentUser.userId, code: safeCode, lang: CURRENT_LANG });
    
    if (d.success) {
        currentContentData = { code: safeCode, title: d.detailedTitle, desc: d.detailedDesc, img: d.imageUrl, btnLabel: d.buttonLabel, msg: d.message };
        gId('prevImg').src = currentContentData.img || "https://via.placeholder.com/300";
        gId('prevTitle').textContent = currentContentData.title;
        if (currentContentData.desc) {
            gId('prevWarning').innerHTML = escapeHTML(currentContentData.desc).replace(/\n/g, '<br>');
            gId('prevWarning').style.display = 'block';
        } else {
            gId('prevWarning').style.display = 'none';
        }
        showPhase('phasePreview', true);
    } else {
        // Direct to Error Phase instead of inline
        const msg = (d.message||"").toLowerCase();
        let errTitle = t.msg_error;
        let errCodeNum = "1000";
        let isOwned = false;
        
        if(msg.includes('used') || msg.includes('使用済')) { errTitle = t.error_used_msg; errCodeNum = "1013"; }
        else if(msg.includes('owned') || msg.includes('所有')) { errTitle = t.error_owned_msg; errCodeNum = "1011"; isOwned = true; }
        else if(msg.includes('invalid') || msg.includes('not found') || msg.includes('無効')) { errTitle = t.msg_invalid; errCodeNum = "1012"; }
        
        renderErrorScreen(errCodeNum, errTitle, d.message, isOwned);
    }
}

async function processCodeRedeem() {
    const t = TRANSLATIONS[CURRENT_LANG];
    const btn = gId('btnRedeem');
    btn.disabled = true;
    btn.innerHTML = `<div class="loading-spinner"></div>`;
    
    const code = currentContentData.code;
    const d = await safeFetch({ type: 'redeem', userId: currentUser.userId, code: code, lang: CURRENT_LANG });
    
    if (d.success) {
        // Success Update
        gId('succImg').src = currentContentData.img || "https://via.placeholder.com/300";
        gId('succTitle').textContent = currentContentData.title;
        gId('succMsg').textContent = t.success_msg_box;
        gId('succTime').textContent = formatLocalTime(new Date());
        
        if (d.actionUrl) {
            const dlBtn = gId('btnDownload');
            dlBtn.href = d.actionUrl;
            dlBtn.style.display = 'flex';
            dlBtn.innerHTML = `<span>${currentContentData.btnLabel || t.btn_download}</span> <i data-lucide="download" style="width:18px;"></i>`;
            lucide.createIcons();
        } else {
            gId('btnDownload').style.display = 'none';
        }
        fetchUserHistory(); // refresh data
        showPhase('phaseSuccess', true);
        
    } else {
        // Error Show
        const msg = (d.message||"").toLowerCase();
        let errTitle = t.msg_error;
        let errCodeNum = "1000";
        let isOwned = false;
        
        if(msg.includes('used') || msg.includes('使用済')) { errTitle = t.error_used_msg; errCodeNum = "1013"; }
        else if(msg.includes('owned') || msg.includes('所有')) { errTitle = t.error_owned_msg; errCodeNum = "1011"; isOwned = true; }
        else if(msg.includes('invalid') || msg.includes('not found') || msg.includes('無効')) { errTitle = t.msg_invalid; errCodeNum = "1012"; }
        
        renderErrorScreen(errCodeNum, errTitle, d.message, isOwned);
    }
    btn.disabled = false;
    btn.innerHTML = `<span data-translate="btn_continue">${t.btn_continue}</span>`;
}

// User Data Sync
async function fetchUserHistory() {
    const d = await safeFetch({ type: 'get_history', lang: CURRENT_LANG });
    if(d.success) {
        currentUser.history = d.history || [];
        currentUser.points = d.points || 0;
        gId('dispPoints').textContent = currentUser.points;
    }
}

// Modals
function closeModal(id) { gId(id).classList.remove('active'); }

function renderHistory() {
    const list = gId('historyList');
    list.innerHTML = '';
    const t = TRANSLATIONS[CURRENT_LANG];
    
    if(!currentUser.history || currentUser.history.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding: 40px 0; opacity: 0.5; font-weight:700;">${t.history_empty}</div>`;
        return;
    }
    
    currentUser.history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const img = (item.imageUrl && item.imageUrl.startsWith('http')) ? item.imageUrl : 'https://via.placeholder.com/100';
        const dateStr = formatLocalTime(new Date(item.authTime || item.date || Date.now()));
        const displayCode = item.code ? escapeHTML(formatCodeInput(item.code)) : (item.price ? `${item.price} pt` : 'STORE');
        
        div.innerHTML = `
            <img src="${escapeHTML(img)}">
            <div class="history-info">
                <div class="history-title">${escapeHTML(item.title || item.message)}</div>
                <div class="history-meta">
                    <span style="color: #fff;">${displayCode}</span>
                    <span>${dateStr}</span>
                </div>
            </div>
        `;
        list.appendChild(div);
    });
}

async function handlePasswordChange() {
    const oldP = gId('passOld').value;
    const newP = gId('passNew').value;
    const confP = gId('passConf').value;
    const msgEl = gId('passMsg');
    const btn = gId('btnSubmitPass');
    const t = TRANSLATIONS[CURRENT_LANG];

    if(!oldP || !newP || !confP) { msgEl.textContent = t.msg_acc_err_empty; return; }
    if(newP.length < 6) { msgEl.textContent = t.msg_acc_err_len; return; }
    if(newP !== confP) { msgEl.textContent = t.msg_acc_err_match; return; }

    btn.disabled = true; btn.innerHTML = `<div class="loading-spinner" style="width:16px;height:16px;"></div>`;
    const d = await safeFetch({ type: 'change_password', userId: currentUser.userId, oldPassword: oldP, newPassword: newP });
    
    if(d.success) {
        msgEl.style.color = "var(--success-color)";
        msgEl.textContent = t.msg_acc_success;
        setTimeout(() => { closeModal('modPass'); msgEl.style.color = "var(--error-color)"; }, 1500);
    } else {
        msgEl.style.color = "var(--error-color)";
        msgEl.textContent = d.message || "Error";
    }
    btn.disabled = false; btn.innerHTML = `<span data-translate="modal_acc_btn_change">${t.modal_acc_btn_change}</span>`;
}
</script>
