<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Redeem Center - kiryu11 Pro</title>
<link rel="icon" type="image/svg+xml" href="./kiryu11.svg">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
/* --- FONT FACE DEFINITIONS --- */
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Medium.woff') format('woff'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }

/* --- THEME VARIABLES --- */
:root {
  --primary: #007DFF;
  --bg-color: #F1F3F5;
  --card-bg: rgba(255, 255, 255, 0.7);
  --card-border: rgba(255, 255, 255, 0.6);
  --text-main: #000000;
  --text-sub: #666666;
  --sidebar-bg: #E0E0E0;
  --sidebar-text: #000000;
  --sidebar-width: 280px;
  --radius-xl: 32px;
  --radius-l: 16px;
  --shadow-soft: 0 30px 80px rgba(0,0,0,0.15);
  --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif;
  --trans-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
}

:root:lang(ja) { --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif; }
:root:lang(en) { --font-stack: 'HarmonyOS Sans', sans-serif; }
:root:lang(zh) { --font-stack: 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif; }
:root:lang(zh-TW) { --font-stack: 'HarmonyOS Sans TC', 'Microsoft JhengHei', sans-serif; }
:root:lang(ko) { --font-stack: 'HarmonyOS Sans', 'Noto Sans KR', sans-serif; }
:root:lang(ru) { --font-stack: 'HarmonyOS Sans', sans-serif; }

[data-theme="dark"] {
  --bg-color: #121212;
  --card-bg: rgba(40, 40, 40, 0.7);
  --card-border: rgba(255, 255, 255, 0.1);
  --text-main: #FFFFFF;
  --text-sub: #A0A0A0;
  --sidebar-bg: #000000;
  --sidebar-text: #FFFFFF;
  --shadow-soft: 0 30px 80px rgba(0,0,0,0.5);
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-stack); height: 100vh; height: 100dvh; overflow: hidden; display: flex; transition: background-color 0.5s ease; }
button, input { font-family: var(--font-stack); }

/* Particle Background */
#particleCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.4; pointer-events: none; filter: blur(80px); }

/* Layout */
.wrapper { display: flex; width: 100%; height: 100%; z-index: 5; position: relative; }

/* Sidebar */
.sidebar { width: var(--sidebar-width); background-color: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid rgba(128,128,128,0.1); z-index: 100; transition: transform 0.3s ease; }
.brand-area { padding: 30px 24px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 20px; color: var(--sidebar-text); }
.brand-area i { color: #FFA500; }
.menu-section { flex: 1; padding: 10px 24px; display: flex; flex-direction: column; gap: 8px; }
.menu-item { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 16px; color: var(--sidebar-text); text-decoration: none; font-weight: 700; transition: background 0.2s; cursor: pointer; }
.menu-item:hover, .menu-item.active { background: rgba(128,128,128,0.15); }
[data-theme="dark"] .menu-item:hover, [data-theme="dark"] .menu-item.active { background: rgba(255,255,255,0.1); }

.bottom-controls { padding: 20px 24px 30px; border-top: 1px solid rgba(128,128,128,0.1); }
.theme-toggle, .lang-trigger { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 20px; border-radius: 50px; background: transparent; border: 1px solid transparent; color: var(--sidebar-text); font-weight: 700; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
.theme-toggle:hover, .lang-trigger:hover { background: rgba(128,128,128,0.15); }
[data-theme="dark"] .theme-toggle, [data-theme="dark"] .lang-trigger { border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
[data-theme="dark"] .theme-toggle:hover, [data-theme="dark"] .lang-trigger:hover { background: rgba(255,255,255,0.15); }

/* Language Dropdown */
.lang-dropdown { position: relative; }
.lang-list { position: absolute; bottom: 100%; left: 0; width: 100%; background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid rgba(128,128,128,0.2); border-radius: 16px; padding: 8px; list-style: none; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 200; margin: 0 0 10px 0; }
.lang-list.open { display: block; animation: popIn 0.2s ease forwards; }
@keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
.lang-list li { padding: 12px 16px; cursor: pointer; border-radius: 8px; font-weight: 700; color: var(--text-main); transition: 0.2s; }
.lang-list li:hover { background: rgba(128,128,128,0.15); }

/* Main Area */
.main-content { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 24px; overflow-y: auto; }

/* In-Page Auth Container (Replaces Modal) */
.auth-container { background: var(--card-bg); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-radius: var(--radius-xl); box-shadow: var(--shadow-soft); width: 100%; max-width: 900px; padding: 40px; transition: max-width 0.5s ease, opacity 0.4s ease; display: flex; flex-direction: column; overflow: hidden; }
.auth-container.is-narrow { max-width: 470px; }

/* Phases */
.phase { display: none; opacity: 0; flex-direction: column; animation: phaseIn 0.5s var(--trans-ease) forwards; }
.phase.active { display: flex; }
@keyframes phaseIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* Phase 1: Input */
.phase-input-center { text-align: center; display: flex; flex-direction: column; align-items: center; width: 100%; }
.auth-title { font-size: 26px; font-weight: 800; color: var(--text-main); margin: 0 0 12px 0; }
.auth-sub { font-size: 14px; font-weight: 500; color: var(--text-sub); margin: 0 0 30px 0; line-height: 1.6; }
.code-field { width: 100%; height: 60px; border-radius: 50px; border: none; background: rgba(128, 128, 128, 0.1); text-align: center; outline: none; transition: 0.3s; color: var(--text-main); font-size: 20px; font-weight: 800; letter-spacing: 1px; padding: 0 20px; }
[data-theme="dark"] .code-field { background: rgba(255,255,255,0.1); }
.code-field:focus { background: rgba(0, 125, 255, 0.1); border: 2px solid var(--primary); }

/* Buttons */
.btn-primary { width: 100%; height: 60px; margin-top: 20px; border: none; background: var(--text-main); color: var(--bg-color); border-radius: 50px; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
.btn-primary:active { transform: scale(0.96); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

/* Phase 2, 3, 4: Wide Layouts */
.auth-layout-flex { display: flex; gap: 30px; align-items: stretch; text-align: left; }
.auth-left-col { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; }
.auth-left-col img { width: 100%; flex: 1; min-height: 220px; border-radius: 20px; object-fit: cover; background: rgba(128,128,128,0.2); }
.auth-right-col { flex: 1; display: flex; flex-direction: column; min-width: 0; justify-content: center; }

.label-text { font-size: 14px; font-weight: 700; color: var(--text-main); margin: 0 0 6px 0; }
.item-title { font-size: 24px; font-weight: 800; color: var(--text-main); margin: 0 0 20px 0; line-height: 1.3; }
.grey-box { background: rgba(128,128,128,0.1); border-radius: 16px; padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center; margin-bottom: 24px; }
[data-theme="dark"] .grey-box { background: rgba(255,255,255,0.08); }
.box-text { font-size: 14px; font-weight: 700; line-height: 1.6; color: var(--text-main); margin: 0; white-space: pre-wrap; }
.box-time { font-size: 16px; font-weight: 800; color: var(--text-main); margin: 20px 0 0 0; }

/* ACTION BUTTONS: 3:7 Ratio for Preview, 100% for Success/Error */
.btn-row-3-7 { display: flex; gap: 12px; margin-top: auto; height: 56px; width: 100%; }
.btn-row-full { display: flex; gap: 12px; margin-top: auto; height: 56px; width: 100%; }

.btn-outline { height: 100%; border-radius: 50px; border: 2px solid var(--text-main); background: transparent; color: var(--text-main); font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; flex: 3; } /* flex: 3 適用 */
.btn-outline:hover { background: rgba(128,128,128,0.1); }
[data-theme="dark"] .btn-outline { border-color: rgba(255,255,255,0.6); color: #fff; }
[data-theme="dark"] .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

.btn-solid { height: 100%; border-radius: 50px; border: none; background: var(--text-main); color: var(--bg-color); font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; flex: 7; } /* flex: 7 適用 */
.btn-solid:hover:not(:disabled) { opacity: 0.8; }
[data-theme="dark"] .btn-solid { background: #fff; color: #000; }

.btn-row-full .btn-outline { flex: none; width: 100%; } /* Success/Error時は100%幅 */

/* Error specifics */
.error-title { color: #FF3B30; display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 800; margin: 0 0 24px 0; }
[data-theme="dark"] .error-title { color: #FF453A; }
.error-main-msg { font-size: 20px; font-weight: 800; color: var(--text-main); margin: 0 0 20px 0; }

/* Mobile Optimizations */
.mobile-menu-trigger { display: none; background: transparent; border: none; color: var(--text-main); padding: 8px; cursor: pointer; }

@media (max-width: 768px) {
  .sidebar { position: fixed; left: -100%; top: 0; height: 100%; z-index: 1000; transition: left 0.3s ease; width: 85%; max-width: 320px; box-shadow: var(--shadow-soft); }
  .sidebar.open { left: 0; }
  .mobile-menu-trigger { display: block; position: absolute; top: 20px; left: 20px; z-index: 100; }
  
  .main-content { padding: 80px 20px 20px; }
  .auth-container { padding: 30px 20px; border-radius: 24px; }
  
  .auth-layout-flex { flex-direction: column; gap: 20px; }
  .auth-left-col { width: 100%; }
  .auth-left-col img { height: 200px; min-height: auto; border-radius: 16px; }
  
  .auth-title { font-size: 22px; }
  .item-title { font-size: 20px; }
  .grey-box { padding: 16px; }
}

/* Spinner */
.spinner { width: 24px; height: 24px; border: 3px solid rgba(128,128,128,0.2); border-top-color: currentColor; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<button class="mobile-menu-trigger" id="mobileMenuBtn">
  <i data-lucide="menu" width="28" height="28"></i>
</button>

<div class="wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="brand-area">
      <i data-lucide="globe-lock"></i>
      <span data-translate="header_brand">kiryu11 Pro</span>
    </div>
    
    <div class="menu-section">
      <div class="menu-item active">
        <i data-lucide="key-round"></i>
        <span data-translate="menu_redeem">コード認証</span>
      </div>
    </div>

    <div class="bottom-controls">
      <button class="theme-toggle" id="themeToggle">
        <span style="display:flex;align-items:center;gap:8px;"><i data-lucide="moon" id="themeIcon"></i> Theme</span>
      </button>

      <div class="lang-dropdown">
        <button class="lang-trigger" id="langTrigger">
          <span style="display:flex;align-items:center;gap:8px;"><i data-lucide="globe"></i> <span id="currentLangLabel">日本語</span></span>
          <i data-lucide="chevron-up" style="opacity:0.5;"></i>
        </button>
        <ul class="lang-list" id="langMenu">
          <li data-value="ja">日本語</li>
          <li data-value="en">English</li>
          <li data-value="zh">简体中文</li>
          <li data-value="zh-TW">繁體中文</li>
          <li data-value="ko">한국어</li>
          <li data-value="ru">Русский</li>
        </ul>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="auth-container is-narrow" id="authContainer">
      
      <div id="phase-input" class="phase active">
        <div class="phase-input-center">
          <h2 class="auth-title" data-translate="modal_title">コード認証</h2>
          <p class="auth-sub" data-translate="modal_sub">アクティベーションコードを入力して認証を行ってください。</p>
          <input type="text" id="activationCode" class="code-field" placeholder="AAAA-BBBB-CCCC" autocomplete="off">
          <button id="btnConfirm" class="btn-primary"><span data-translate="modal_btn_auth">確認</span></button>
        </div>
      </div>

      <div id="phase-preview" class="phase">
        <h2 class="auth-title" data-translate="preview_title">引き換えの確認</h2>
        <div class="auth-layout-flex">
          <div class="auth-left-col">
            <img id="previewImage" src="" alt="Thumbnail">
          </div>
          <div class="auth-right-col">
            <p class="label-text" data-translate="preview_desc">続行すると以下のコンテンツが引き換えられます:</p>
            <h3 id="previewTitle" class="item-title"></h3>
            <div class="grey-box" id="previewWarningBox" style="display:none;">
              <p class="box-text" id="previewWarningText" style="opacity:0.8;"></p>
            </div>
            
            <div class="btn-row-3-7">
              <button class="btn-outline" id="btnPreviewClose" data-translate="btn_close">閉じる</button>
              <button class="btn-solid" id="btnPreviewRedeem" data-translate="btn_continue">引き換える</button>
            </div>
          </div>
        </div>
      </div>

      <div id="phase-success" class="phase">
        <h2 class="auth-title" data-translate="success_title_final">引き換え成功!!</h2>
        <div class="auth-layout-flex">
          <div class="auth-left-col">
            <img id="successImage" src="" alt="Thumbnail">
          </div>
          <div class="auth-right-col">
            <p class="label-text" data-translate="success_desc">以下のコンテンツを引き換えました:</p>
            <h3 id="successBundleName" class="item-title"></h3>
            <div class="grey-box">
              <p class="box-text" id="successMessageText"></p>
              <p class="box-time" id="successTime"></p>
            </div>
            
            <div class="btn-row-full">
              <button class="btn-outline" id="btnSuccessClose" data-translate="btn_close">閉じる</button>
            </div>
          </div>
        </div>
      </div>

      <div id="phase-error" class="phase">
        <h2 class="error-title">
          <i data-lucide="alert-triangle"></i>
          <span data-translate="error_title_prefix">エラー</span> 
          <a href="#" id="errorCodeText" style="color:inherit; text-decoration:underline; font-size:16px;"></a>
        </h2>
        <div class="auth-layout-flex" style="flex-direction: column;">
          <h3 id="errorMessage" class="error-main-msg"></h3>
          <div class="grey-box" id="errorInfoBox">
            <p class="box-text" id="errorSubMessage"></p>
            <p class="box-time" id="errorTime"></p>
          </div>
          
          <div class="btn-row-full">
            <button class="btn-outline" id="btnErrorClose" data-translate="btn_close">閉じる</button>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

    preview_title: "Подтвердить", preview_desc: "Вы получите следующее содержимое:", btn_close: "Закрыть", btn_continue: "Погасить",
    success_title_final: "Успешно!!", success_desc: "Вы получили следующий контент:", success_msg_box: "Успешно обработано.\n*Скачивайте из библиотеки или истории покупок.",
    error_title_prefix: "Ошибка", error_used_msg: "Этот код уже активирован.", msg_invalid: "Неверный код.", msg_error: "Произошла ошибка.", error_owned_msg: "Оно у вас уже есть."
  }
};

const gId = id => document.getElementById(id);
const escapeHTML = str => String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

function formatCodeInput(val) {
    if (!val) return "";
    let clean = val.toUpperCase().replace(/[^A-Z0-9]/g, '');
    let sz = clean.length >= 25 ? 5 : 4; 
    let res = '';
    for(let i=0; i<clean.length; i++) { if(i > 0 && i % sz === 0) res += '-'; res += clean[i]; }
    return res;
}

function getFormattedTime() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function generateErrorCode() {
    return 'ERR.' + Math.floor(Math.random() * 9000 + 1000);
}

// 疑似Fetch (UI動作確認用。実環境では元の safeFetch に戻してください)
async function safeFetch(bodyObj) {
    const token = localStorage.getItem('user_session_token') || "";
    try {
        const response = await fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(bodyObj)
        });
        return await response.json();
    } catch(e) {
        // デモ用のモック動作（通信できない環境でもUIの動きを確認できるように）
        return new Promise(resolve => setTimeout(() => {
            if(bodyObj.type === 'check') {
                if(bodyObj.code === 'ERROR') resolve({ success: false, message: "Invalid code" });
                else resolve({ success: true, bundleLabel: "Premium Pack", message: "Unlocked exclusive items.", detailedTitle: "Special Edition Game", imageUrl: "https://via.placeholder.com/380x220?text=Preview+Image" });
            } else {
                resolve({ success: true, message: "Success" });
            }
        }, 800));
    }
}

// --- UI / Phase Control ---
function switchPhase(phaseId) {
    document.querySelectorAll('.phase').forEach(el => { el.classList.remove('active'); });
    gId(phaseId).classList.add('active');
    
    const container = gId('authContainer');
    if(phaseId === 'phase-input') {
        container.classList.add('is-narrow');
        gId('activationCode').value = '';
        gId('activationCode').disabled = false;
        gId('btnConfirm').disabled = false;
        gId('btnConfirm').innerHTML = `<span>${T[CURRENT_LANG].modal_btn_auth}</span>`;
    } else {
        container.classList.remove('is-narrow');
    }
    try { lucide.createIcons(); } catch(e){}
}

function updateLanguage(lang) {
    CURRENT_LANG = lang;
    document.documentElement.lang = lang;
    const t = T[lang];
    if(!t) return;
    
    document.querySelectorAll('[data-translate]').forEach(el => {
        const key = el.getAttribute('data-translate');
        if (t[key]) el.innerHTML = t[key];
    });
    
    const langMap = { ja: '日本語', en: 'English', zh: '简体中文', 'zh-TW': '繁體中文', ko: '한국어', ru: 'Русский' };
    gId('currentLangLabel').textContent = langMap[lang];
}

// --- Auth Logic ---
async function performAuth(code, mode = 'check') {
    const safeCode = formatCodeInput(code);
    if(!safeCode) return;
    
    const t = T[CURRENT_LANG];
    const spinnerHtml = `<div class="spinner"></div>`;
    
    if (mode === 'check') {
        gId('activationCode').disabled = true;
        gId('btnConfirm').disabled = true;
        gId('btnConfirm').innerHTML = spinnerHtml;
    } else {
        gId('btnPreviewRedeem').disabled = true;
        gId('btnPreviewRedeem').innerHTML = spinnerHtml;
        currentAuthTime = getFormattedTime();
    }

    try {
        const d = await safeFetch({ type: mode, code: safeCode, lang: CURRENT_LANG, app_tier: 'enterprise' });

        if (mode === 'check') {
            if (d.success) {
                currentContentData = { title: d.detailedTitle || d.bundleLabel, desc: d.detailedDesc || "", img: d.imageUrl };
                gId('previewImage').src = currentContentData.img;
                gId('previewTitle').textContent = currentContentData.title;
                if(d.detailedDesc) { gId('previewWarningText').innerHTML = escapeHTML(d.detailedDesc); gId('previewWarningBox').style.display='flex'; }
                else { gId('previewWarningBox').style.display='none'; }
                
                gId('btnPreviewRedeem').disabled = false;
                gId('btnPreviewRedeem').innerHTML = `<span>${t.btn_continue}</span>`;
                
                switchPhase('phase-preview');
            } else { throw new Error(d.message); }
        } else {
            if (d.success) {
                gId('successImage').src = currentContentData.img;
                gId('successBundleName').textContent = currentContentData.title;
                gId('successMessageText').innerHTML = t.success_msg_box.replace(/\n/g, '<br>');
                gId('successTime').textContent = currentAuthTime;
                
                switchPhase('phase-success');
            } else { throw new Error(d.message); }
        }
    } catch(e) {
        let msg = e.message.toLowerCase();
        let errorMain = t.msg_error;
        let specificCode = generateErrorCode();
        
        if (msg.includes("used")) { errorMain = t.error_used_msg; specificCode = "1013"; }
        else if (msg.includes("invalid") || msg.includes("not found")) { errorMain = t.msg_invalid; specificCode = "1012"; }
        else if (msg.includes("owned")) { errorMain = t.error_owned_msg; specificCode = "1011"; }

        gId('errorCodeText').textContent = specificCode;
        gId('errorCodeText').href = `error.html?code=${specificCode}`;
        gId('errorMessage').textContent = errorMain;
        gId('errorSubMessage').textContent = e.message;
        gId('errorTime').textContent = getFormattedTime();
        
        if (mode === 'check') { gId('activationCode').disabled = false; gId('btnConfirm').disabled = false; }
        else { gId('btnPreviewRedeem').disabled = false; }
        
        switchPhase('phase-error');
    }
}

// --- Initialization ---
document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    
    // Theme setup
    const toggleThemeBtn = gId('themeToggle');
    const applyTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
        gId('themeIcon').setAttribute('data-lucide', theme === 'light' ? 'sun' : 'moon');
        lucide.createIcons();
    };
    applyTheme(localStorage.getItem('user_theme') || 'dark');
    toggleThemeBtn.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        localStorage.setItem('user_theme', next);
        applyTheme(next);
    });

    // Language Dropdown
    const langTrigger = gId('langTrigger');
    const langMenu = gId('langMenu');
    langTrigger.addEventListener('click', (e) => { e.stopPropagation(); langMenu.classList.toggle('open'); });
    document.querySelectorAll('#langMenu li').forEach(li => {
        li.addEventListener('click', () => {
            const val = li.getAttribute('data-value');
            localStorage.setItem('user_lang', val);
            updateLanguage(val);
            langMenu.classList.remove('open');
        });
    });
    document.addEventListener('click', () => langMenu.classList.remove('open'));
    updateLanguage(localStorage.getItem('user_lang') || 'ja');

    // Mobile Sidebar
    const mobileBtn = gId('mobileMenuBtn');
    const sidebar = gId('sidebar');
    mobileBtn.addEventListener('click', (e) => { e.stopPropagation(); sidebar.classList.toggle('open'); });
    document.addEventListener('click', (e) => { if(!sidebar.contains(e.target) && !mobileBtn.contains(e.target)) sidebar.classList.remove('open'); });

    // Input events
    const codeInput = gId('activationCode');
    const btnConfirm = gId('btnConfirm');
    codeInput.addEventListener('input', () => codeInput.value = formatCodeInput(codeInput.value));
    codeInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') btnConfirm.click(); });
    btnConfirm.addEventListener('click', () => performAuth(codeInput.value, 'check'));

    // Buttons
    gId('btnPreviewRedeem').addEventListener('click', () => performAuth(codeInput.value, 'redeem'));
    
    // All Close buttons return to input phase
    ['btnPreviewClose', 'btnSuccessClose', 'btnErrorClose'].forEach(id => {
        gId(id).addEventListener('click', () => switchPhase('phase-input'));
    });

    // Particles setup
    const canvas = gId('particleCanvas'); const ctx = canvas.getContext('2d');
    let p = [];
    const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
    resize(); window.addEventListener('resize', resize);
    for(let i=0; i<8; i++) p.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*150+50, sx: Math.random()*0.2-0.1, sy: Math.random()*0.2-0.1, op: Math.random()*0.3+0.1 });
    const animate = () => {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        p.forEach(i => {
            i.x+=i.sx; i.y+=i.sy; if(i.x<0||i.x>canvas.width)i.sx*=-1; if(i.y<0||i.y>canvas.height)i.sy*=-1;
            ctx.fillStyle = `hsla(${isLight?210:220}, 100%, 50%, ${i.op*0.2})`;
            ctx.beginPath(); ctx.arc(i.x,i.y,i.s,0,Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(animate);
    };
    animate();
});
</script>
