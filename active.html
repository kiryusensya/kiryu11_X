<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Redeem</title>

<!-- フォント（変更なし） -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

<style>
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Regular.woff'); }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Regular.woff'); }
@font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Regular.woff'); }

/* --- 基本 --- */
body{
  margin:0;
  font-family:'HarmonyOS Sans','Noto Sans JP',sans-serif;
  background:#090909;
  color:#fff;
  overflow:hidden;
}

/* --- 背景（近未来粒子）--- */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

/* --- 中央UI --- */
.main{
  position:relative;
  z-index:10;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.panel{
  width:min(500px,90%);
  padding:30px;
  border-radius:28px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 0 80px rgba(0,125,255,0.2);
}

.title{
  font-size:28px;
  font-weight:900;
}

/* --- 入力 --- */
.input{
  margin-top:20px;
  display:flex;
  gap:12px;
}
.input input{
  flex:1;
  height:50px;
  border-radius:30px;
  border:none;
  text-align:center;
  background:rgba(255,255,255,0.1);
  color:#fff;
  font-weight:900;
}

/* --- ボタン --- */
.btn{
  background:#007DFF;
  border:none;
  border-radius:30px;
  padding:0 20px;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

/* --- ステータス --- */
.status{
  margin-top:15px;
  font-size:12px;
  opacity:.7;
}

/* --- 時計 --- */
.clock{
  position:absolute;
  top:20px;
  right:20px;
  font-size:12px;
  font-weight:900;
}

/* --- モーダル --- */
.modal{
  position:fixed;
  inset:0;
  display:none;
  background:rgba(0,0,0,0.6);
  align-items:center;
  justify-content:center;
}
.modal-box{
  width:min(500px,90%);
  background:#111;
  border-radius:20px;
  padding:20px;
}

.k{font-size:11px;opacity:.6;}
.v{font-size:14px;font-weight:900;}

/* --- アニメーション --- */
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-3px)}
  100%{transform:translateX(0)}
}
.shake{animation:shake .3s}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="clock" id="clock"></div>

<div class="main">
  <div class="panel">
    <div class="title" id="title">コード認証</div>

    <div class="input">
      <input id="code" placeholder="XXXX-XXXX">
      <button class="btn" onclick="check()">確認</button>
    </div>

    <div class="status" id="status"></div>
  </div>
</div>

<!-- 成功モーダル -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h2 id="mTitle"></h2>

    <div><div class="k">TITLE</div><div id="vTitle" class="v"></div></div>
    <div><div class="k">BUNDLE</div><div id="vBundle" class="v"></div></div>
    <div><div class="k">MESSAGE</div><div id="vMessage" class="v"></div></div>
    <div><div class="k">DETAIL</div><div id="vDetail" class="v"></div></div>

    <div style="margin-top:10px;font-size:12px;opacity:.6" id="mtime"></div>

    <button class="btn" style="margin-top:15px;width:100%" onclick="closeModal()">OK</button>
  </div>
</div>

<script>

/* ===== 多言語 ===== */
const T={
 ja:{title:"コード認証", success:"認証成功"},
 en:{title:"Code Verify", success:"Success"},
 zh:{title:"代码验证", success:"成功"},
 "zh-TW":{title:"代碼驗證", success:"成功"},
 ko:{title:"코드 인증", success:"성공"},
 ru:{title:"Проверка кода", success:"Успех"}
};

let LANG="ja";

/* ===== 時計 ===== */
function updateClock(){
  document.getElementById("clock").innerText=new Date().toLocaleString();
}
setInterval(updateClock,1000);updateClock();

/* ===== コード整形 ===== */
function fmt(v){
  v=v.toUpperCase().replace(/[^A-Z0-9]/g,"");
  return v.match(/.{1,4}/g)?.join("-")||v;
}

/* ===== 認証 ===== */
async function check(){
 const el=document.getElementById("code");
 const val=fmt(el.value);
 el.value=val;

 document.getElementById("status").innerText="...";

 const res=await fetch("/api/proxy",{method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({type:"check",code:val})
 }).then(r=>r.json()).catch(()=>({success:false}));

 /* ▼ 無効 / 使用済 は表示だけ（モーダルなし） */
 if(!res.success || res.status=="invalid"){
   document.getElementById("status").innerText="無効";
   el.classList.add("shake");
   return;
 }
 if(res.status=="used"){
   document.getElementById("status").innerText="使用済";
   el.classList.add("shake");
   return;
 }

 /* ▼ 成功 → redeem */
 const r2=await fetch("/api/proxy",{method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({type:"redeem",code:val})
 }).then(r=>r.json());

 if(r2.success){
   show(r2);
 }else{
   document.getElementById("status").innerText="ERROR";
 }
}

/* ===== 成功モーダル ===== */
function show(d){
  document.getElementById("modal").style.display="flex";

  document.getElementById("mTitle").innerText=T[LANG].success;

  document.getElementById("vTitle").innerText=d.title||"-";
  document.getElementById("vBundle").innerText=d.bundle||"-";
  document.getElementById("vMessage").innerText=d.message||"-";
  document.getElementById("vDetail").innerText=d.detail||"-";

  document.getElementById("mtime").innerText=new Date().toLocaleString();
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* ===== 粒子 ===== */
const c=document.getElementById("bg");
const ctx=c.getContext("2d");
function r(){
 c.width=innerWidth;
 c.height=innerHeight;
}
r();addEventListener("resize",r);

let p=[...Array(30)].map(()=>({
 x:Math.random()*c.width,
 y:Math.random()*c.height,
 vx:Math.random()-0.5,
 vy:Math.random()-0.5
}));

function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 ctx.fillStyle="#007dff33";
 p.forEach(a=>{
  a.x+=a.vx;
  a.y+=a.vy;
  ctx.beginPath();
  ctx.arc(a.x,a.y,2,0,7);
  ctx.fill();
 });
 requestAnimationFrame(draw);
}
draw();

</script>
</body>
</html>
