<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>kiryu11 Pro - Activation</title>
<link rel="icon" type="image/svg+xml" href="./kiryu11.svg">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
/* --- FONT FACE DEFINITIONS (STRICTLY PRESERVED) --- */
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Medium.woff') format('woff'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }

/* --- THEME VARIABLES --- */
:root {
  --primary: #007DFF;
  --bright-green: #04CF22;
  --bg-color: #F1F3F5;
  --card-bg: rgba(255, 255, 255, 0.75);
  --card-border: rgba(255, 255, 255, 0.6);
  --modal-text-main: #000000;
  --modal-text-sub: #666666;
  --btn-close-border: #000000;
  --btn-close-text: #000000;
  --radius-xl: 32px;
  --radius-l: 16px;
  --spring-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
  --shadow-soft: 0 20px 60px rgba(0,0,0,0.1);
  
  --top-nav-height: 80px;
  --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif;
  --glow-color: rgba(0, 125, 255, 0.4);
}

:root:lang(ja) { --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif; }
:root:lang(en) { --font-stack: 'HarmonyOS Sans', sans-serif; }
:root:lang(zh) { --font-stack: 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif; }
:root:lang(zh-TW) { --font-stack: 'HarmonyOS Sans TC', 'Microsoft JhengHei', sans-serif; }
:root:lang(ko) { --font-stack: 'HarmonyOS Sans', 'Noto Sans KR', sans-serif; }
:root:lang(ru) { --font-stack: 'HarmonyOS Sans', sans-serif; }

[data-theme="dark"] {
  --bg-color: #0d0d0d;
  --card-bg: rgba(25, 25, 25, 0.65);
  --card-border: rgba(255, 255, 255, 0.08);
  --modal-text-main: #FFFFFF;
  --modal-text-sub: #A0A0A0;
  --shadow-soft: 0 30px 80px rgba(0,0,0,0.6);
  --glow-color: rgba(0, 125, 255, 0.3);
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.2); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(128, 128, 128, 0.4); }
[data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0; padding: 0;
  background-color: var(--bg-color);
  color: var(--modal-text-main);
  font-family: var(--font-stack);
  height: 100vh; height: 100dvh;
  overflow: hidden; 
  display: flex; flex-direction: column;
  transition: background-color 0.5s ease;
}

button, input, textarea { font-family: var(--font-stack); }

#particleCanvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 0; opacity: 0.5; pointer-events: none; filter: blur(60px);
}

/* --- MODERN TOP NAVBAR --- */
.top-navbar {
    height: var(--top-nav-height);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    z-index: 100;
    position: relative;
    background: transparent;
}

.nav-brand {
    font-family: var(--font-stack);
    font-weight: 800;
    font-size: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--modal-text-main);
    text-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

/* Digital Clock */
.cyber-clock {
    font-family: var(--font-stack);
    font-weight: 800;
    font-size: 16px;
    color: var(--modal-text-main);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 50px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
.cyber-clock i { opacity: 0.7; }

/* Language Trigger (Top Nav) */
.lang-trigger-navbar {
    height: 44px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; cursor: pointer; font-size: 14px; font-weight: 700;
    color: var(--modal-text-main); border-radius: 50px; background: var(--card-bg);
    transition: all 0.2s ease; font-family: var(--font-stack);
    border: 1px solid var(--card-border); backdrop-filter: blur(20px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
.lang-trigger-navbar:hover { background: rgba(128, 128, 128, 0.1); }
.lang-list { position: absolute; top: 70px; right: 60px; width: 200px; background: var(--card-bg); backdrop-filter: blur(30px); padding: 8px; border-radius: 16px; list-style: none; display: none; box-shadow: 0 20px 50px rgba(0,0,0,0.2); z-index: 200; border: 1px solid var(--card-border); }
.lang-list.open { display: block; animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.lang-list li { padding: 12px 16px; cursor: pointer; border-radius: 10px; color: var(--modal-text-main); font-size: 14px; font-family: var(--font-stack); font-weight: 500; transition: background 0.2s; }
.lang-list li:hover { background: rgba(128,128,128,0.1); }

.theme-pill {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--card-bg); border: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.3s var(--spring-ease); color: var(--modal-text-main);
    backdrop-filter: blur(20px); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
.theme-pill:hover { transform: scale(1.1); }

/* --- MAIN AUTH WRAPPER --- */
.auth-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 10;
    padding: 20px;
    overflow-y: auto;
}

/* AUTH CARD (Dynamic sizing based on phase) */
.auth-card {
    background: var(--card-bg);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-soft), 0 0 0 1px inset rgba(255,255,255,0.1);
    width: 100%;
    max-width: 500px;
    padding: 50px 40px;
    position: relative;
    overflow: hidden;
    transition: max-width 0.6s var(--spring-ease), padding 0.6s var(--spring-ease), transform 0.4s var(--spring-ease), box-shadow 0.4s;
}
.auth-card:hover {
    box-shadow: var(--shadow-soft), 0 0 30px var(--glow-color);
}
.auth-card.is-wide { max-width: 900px; padding: 40px; }

/* Phases Logic */
.auth-phase {
    display: none; opacity: 0;
    transform: translateY(20px) scale(0.98);
    transition: opacity 0.4s ease, transform 0.5s var(--spring-ease);
}
.auth-phase.active {
    display: flex; flex-direction: column; opacity: 1;
    transform: translateY(0) scale(1);
}

/* Phase: Input */
#phase-input { text-align: center; align-items: center; width: 100%; }
.auth-title { font-size: 32px; font-weight: 800; color: var(--modal-text-main); margin: 0 0 12px 0; letter-spacing: -0.5px; }
.auth-sub { font-size: 14px; color: var(--modal-text-sub); margin: 0 0 32px 0; line-height: 1.6; }

.code-field {
    width: 100%; height: 64px; border: 2px solid rgba(128,128,128,0.2);
    background: rgba(128, 128, 128, 0.05); border-radius: 20px;
    text-align: center; outline: none; transition: all 0.3s;
    color: var(--modal-text-main); font-family: var(--font-stack);
    font-size: 20px; font-weight: 800; letter-spacing: 2px;
}
.code-field:focus {
    border-color: var(--primary); background: rgba(0, 125, 255, 0.05);
    box-shadow: 0 0 20px rgba(0,125,255,0.2); transform: translateY(-2px);
}

.btn-primary {
    width: 100%; height: 60px; margin-top: 24px; border: none;
    background: var(--primary); color: white; border-radius: 50px;
    font-size: 18px; font-weight: 800; cursor: pointer;
    transition: all 0.2s; font-family: var(--font-stack);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
}
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,125,255,0.3); }
.btn-primary:active:not(:disabled) { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.8; cursor: not-allowed; }

/* Futuristic Spinner */
.cyber-spinner {
    width: 32px; height: 32px;
    position: relative;
    display: inline-block;
}
.cyber-spinner::before, .cyber-spinner::after {
    content: ""; position: absolute; inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
}
.cyber-spinner::before {
    border-top-color: #fff; border-right-color: #fff;
    animation: cyberSpin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
}
.cyber-spinner::after {
    border-bottom-color: rgba(255,255,255,0.4); border-left-color: rgba(255,255,255,0.4);
    animation: cyberSpin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite reverse;
}
@keyframes cyberSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Phase: Result (Preview/Success/Error Layout) */
.result-layout { display: flex; flex-direction: row; gap: 40px; align-items: stretch; width: 100%; text-align: left; }
.result-left { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; }
.result-left img { width: 100%; height: 240px; border-radius: 20px; object-fit: cover; background: rgba(128,128,128,0.1); border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
.result-right { flex: 1; display: flex; flex-direction: column; min-width: 0; justify-content: center; }

.result-title-top { font-size: 32px; font-weight: 800; color: var(--modal-text-main); margin: 0 0 8px 0; letter-spacing: -0.5px; }
.result-label { font-size: 15px; font-weight: 700; color: var(--modal-text-sub); margin: 0 0 20px 0; }
.result-main-title { font-size: 24px; font-weight: 800; color: var(--modal-text-main); margin: 0 0 24px 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.info-box { background: rgba(128,128,128,0.08); border: 1px solid rgba(128,128,128,0.1); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
.info-box-text { font-size: 14px; font-weight: 500; line-height: 1.6; color: var(--modal-text-main); margin: 0; }
.info-box-time { font-size: 16px; font-weight: 800; color: var(--modal-text-main); margin: 12px 0 0 0; opacity: 0.8; font-family: monospace; }

.btn-row { display: flex; gap: 16px; margin-top: auto; }
.btn-outline { height: 56px; border-radius: 50px; border: 2px solid var(--modal-text-main); background: transparent; color: var(--modal-text-main); font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; flex: 1; }
.btn-outline:hover { background: rgba(128,128,128,0.1); }
.btn-solid { height: 56px; border-radius: 50px; border: none; background: var(--modal-text-main); color: var(--bg-color); font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; flex: 2; text-decoration: none; }
.btn-solid:hover { opacity: 0.8; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
[data-theme="dark"] .btn-solid:hover { box-shadow: 0 10px 20px rgba(255,255,255,0.15); }

/* Error specific styling */
.is-error .result-title-top { color: #FF3B30; display: flex; align-items: center; gap: 12px; }
[data-theme="dark"] .is-error .result-title-top { color: #FF453A; }

/* Language Init Overlay */
.intro-container { text-align: center; width: 100%; max-width: 900px; padding: 40px 24px; position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
.intro-header { margin-bottom: 50px; opacity: 0; animation: fadeInUp 0.8s ease forwards; }
.intro-brand { font-family: 'HarmonyOS Sans', sans-serif; font-size: 16px; opacity: 0.5; font-weight: 800; margin-bottom: 16px; display: block; letter-spacing: 2px; text-transform: uppercase; }
.intro-title { font-size: 42px; font-weight: 800; margin: 0; letter-spacing: -1px; }
.lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; }
.lang-card { position: relative; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; height: 120px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.4s var(--spring-ease); backdrop-filter: blur(25px); box-shadow: var(--shadow-soft); opacity: 0; animation: fadeInUp 0.6s var(--spring-ease) forwards; overflow: hidden; }
.lang-card:hover { transform: translateY(-5px) scale(1.02); background: rgba(255, 255, 255, 0.9); border-color: var(--primary); box-shadow: 0 20px 50px rgba(0, 125, 255, 0.15); }
[data-theme="dark"] .lang-card:hover { background: rgba(30, 30, 30, 0.9); }
.lang-name { font-size: 20px; font-weight: 800; transition: 0.3s; }
.lang-card:hover .lang-name { transform: scale(1.1); color: var(--primary); }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes popIn { 0% { opacity: 0; transform: scale(0.95) translateY(-10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

/* Mobile Adaptations */
@media (max-width: 768px) {
    .top-navbar { padding: 0 20px; height: 70px; }
    .nav-brand { font-size: 20px; }
    .cyber-clock { display: none; /* Hide clock on mobile to save space, or make it smaller */ }
    
    .auth-wrapper { padding: 16px; align-items: flex-start; padding-top: 40px; }
    .auth-card { padding: 32px 24px; border-radius: 24px; }
    
    .result-layout { flex-direction: column; gap: 24px; }
    .result-left { width: 100%; }
    .result-left img { height: 200px; }
    .result-title-top { font-size: 24px; }
    .result-main-title { font-size: 20px; margin-bottom: 16px; }
    .btn-row { flex-direction: column-reverse; gap: 12px; }
    .btn-outline, .btn-solid { width: 100%; }
    
    .lang-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div id="langSelectionOverlay" style="position: fixed; inset: 0; background: var(--bg-color); z-index: 10000; display: flex; align-items: center; justify-content: center;">
  <div class="intro-container">
    <div class="intro-header"><span class="intro-brand">kiryu11 Pro</span><h2 class="intro-title">Select Region</h2></div>
    <div class="lang-grid">
      <div class="lang-card" style="animation-delay: 0.1s" onclick="setInitialLanguage('ja')"><div class="lang-name font-jp">日本語</div></div>
      <div class="lang-card" style="animation-delay: 0.2s" onclick="setInitialLanguage('en')"><div class="lang-name font-en">English</div></div>
      <div class="lang-card" style="animation-delay: 0.3s" onclick="setInitialLanguage('zh')"><div class="lang-name font-cn-s">简体中文</div></div>
      <div class="lang-card" style="animation-delay: 0.4s" onclick="setInitialLanguage('zh-TW')"><div class="lang-name font-cn-t">繁體中文</div></div>
      <div class="lang-card" style="animation-delay: 0.5s" onclick="setInitialLanguage('ko')"><div class="lang-name font-kr">한국어</div></div>
      <div class="lang-card" style="animation-delay: 0.6s" onclick="setInitialLanguage('ru')"><div class="lang-name font-ru">Русский</div></div>
    </div>
  </div>
</div>

<nav class="top-navbar" id="topNav" style="opacity: 0; transition: opacity 0.5s ease;">
    <div class="nav-brand">
        <i data-lucide="shield-check"></i>
        <span>AuthCenter</span>
    </div>
    <div class="nav-right">
        <div id="topClock" class="cyber-clock">
            <i data-lucide="clock"></i>
            <span id="clockDisplay">00:00:00</span>
        </div>
        <div style="position:relative;">
             <button class="lang-trigger-navbar" id="langTrigger">
                 <span style="display:flex;align-items:center;gap:8px;"><i data-lucide="globe" style="width:16px;"></i> <span id="currentLangLabel">日本語</span></span>
                 <i data-lucide="chevron-down" style="width:14px; opacity:0.5; margin-left:6px;"></i>
             </button>
             <ul class="lang-list" id="langMenu">
                <li class="lang-option" data-value="ja">日本語</li>
                <li class="lang-option" data-value="en">English</li>
                <li class="lang-option" data-value="zh">简体中文</li>
                <li class="lang-option" data-value="zh-TW">繁體中文</li>
                <li class="lang-option" data-value="ko">한국어</li>
                <li class="lang-option" data-value="ru">Русский</li>
             </ul>
        </div>
        <div class="theme-pill" id="themeToggle">
            <i data-lucide="moon" id="themeIcon"></i>
        </div>
    </div>
</nav>

<main class="auth-wrapper" id="mainWrapper" style="opacity: 0; transition: opacity 0.5s ease;">
    <div class="auth-card" id="authCard">
        
        <div id="phase-input" class="auth-phase active">
            <h1 class="auth-title" data-translate="hero_title">個人認証センター</h1>
            <p class="auth-sub" data-translate="modal_sub">アクティベーションコードを入力してコンテンツを解除してください。</p>
            
            <input type="text" id="activationCode" class="code-field" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
            
            <button id="btnConfirm" class="btn-primary">
                <span data-translate="modal_btn_auth">確認</span>
            </button>
        </div>

        <div id="phase-preview" class="auth-phase result-layout">
            <div class="result-left">
                <img id="previewImage" src="" alt="Content Thumbnail">
            </div>
            <div class="result-right">
                <h2 class="result-title-top" data-translate="preview_title">引き換えの確認</h2>
                <p class="result-label" data-translate="preview_desc">続行すると、以下のコンテンツが引き換えられます:</p>
                <h3 class="result-main-title" id="previewTitle"></h3>
                
                <div class="info-box" id="previewWarningBox" style="display:none;">
                    <p class="info-box-text" id="previewWarningText" style="opacity: 0.8;"></p>
                </div>
                
                <div class="btn-row">
                    <button class="btn-outline" id="btnPreviewCancel" data-translate="btn_close">キャンセル</button>
                    <button class="btn-solid" id="btnPreviewConfirm" data-translate="btn_continue">引き換える</button>
                </div>
            </div>
        </div>

        <div id="phase-success" class="auth-phase result-layout">
            <div class="result-left">
                <img id="successImage" src="" alt="Success Thumbnail">
            </div>
            <div class="result-right">
                <h2 class="result-title-top" style="color: var(--rgl-green); display: flex; align-items: center; gap: 12px;">
                    <i data-lucide="check-circle" style="width:32px; height:32px;"></i>
                    <span data-translate="success_title_final">認証成功!!</span>
                </h2>
                <p class="result-label" data-translate="success_desc">以下のコンテンツを引き換えました:</p>
                <h3 class="result-main-title" id="successTitle"></h3>
                
                <div class="info-box">
                    <p class="info-box-text" id="successMessageText" data-translate="success_msg_box">正常に処理されました。</p>
                    <p class="info-box-time" id="successTime"></p>
                </div>
                
                <div class="btn-row">
                    <button class="btn-outline" id="btnSuccessClose" data-translate="btn_close">閉じる</button>
                    <a class="btn-solid" id="btnSuccessDownload" target="_blank">
                        <span data-translate="btn_download">ダウンロード</span>
                        <i data-lucide="download" style="width:20px;"></i>
                    </a>
                </div>
            </div>
        </div>

        <div id="phase-error" class="auth-phase result-layout is-error">
            <div class="result-right" style="width: 100%;">
                <h2 class="result-title-top">
                    <i data-lucide="alert-triangle" style="width:32px; height:32px;"></i>
                    <span data-translate="error_title_prefix">エラー</span>
                </h2>
                <h3 class="result-main-title" id="errorMessage" style="margin-top: 10px;">エラーが発生しました。</h3>
                
                <div class="info-box" id="errorInfoBox">
                    <p class="info-box-text" id="errorSubMessage"></p>
                    <p class="info-box-time" style="display:flex; justify-content:space-between; align-items:center;">
                        <span id="errorCodeText" style="color: #FF3B30;"></span>
                        <span id="errorTime" style="opacity:0.5; font-size: 14px;"></span>
                    </p>
                </div>

// --- DOM Elements ---
const els = {
    card: document.getElementById('authCard'),
    phases: {
        input: document.getElementById('phase-input'),
        preview: document.getElementById('phase-preview'),
        success: document.getElementById('phase-success'),

    },

        btn: document.getElementById('btnConfirm')
    },

// --- Utilities ---
const escapeHTML = (str) => String(str || "").replace(/[&<>"']/g, (m) => ({'&': '&amp;','<': '&lt;','>': '&gt;','"': '&quot;',"'": '&#39;'}[m]));

const formatCodeInput = (val) => {
    if (!val) return "";
    let clean = val.toUpperCase().replace(/[^A-Z0-9]/g, '');
    let sz = clean.length >= 25 ? 5 : 4; 
    let res = '';
    for(let i=0; i<clean.length; i++) {
        if(i > 0 && i % sz === 0) res += '-';
        res += clean[i];
    }
    return res;
};

function formatLocalTime(dateObj, lang) {
    try {
        const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Tokyo',
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
        const parts = formatter.formatToParts(dateObj);
        const p = {};
        parts.forEach(part => { p[part.type] = part.value; });
        let hr = p.hour === '24' ? '00' : p.hour;
        const gmt = `JST`;

        switch(lang) {
            case 'ja': case 'zh': case 'zh-TW': return `${p.year}/${p.month}/${p.day} ${hr}:${p.minute}:${p.second} ${gmt}`;
            case 'ko': return `${p.year}.${p.month}.${p.day} ${hr}:${p.minute}:${p.second} ${gmt}`;
            case 'ru': return `${p.day}.${p.month}.${p.year} ${hr}:${p.minute}:${p.second} ${gmt}`;
            case 'en': default: return `${p.year}-${p.month}-${p.day} ${hr}:${p.minute}:${p.second} ${gmt}`;
        }
    } catch (e) {
        return dateObj.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' });
    }
}

function generateErrorCode() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let code = '';
    for(let i=0; i<12; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return 'ERR-' + code;
}

// --- Clock Logic ---
function updateClock() {
    const now = new Date();
    try {
        const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
        els.clock.textContent = formatter.format(now) + " JST";
    } catch(e) {
        els.clock.textContent = now.toLocaleTimeString('en-US', { hour12: false });
    }
}
setInterval(updateClock, 1000);
updateClock();

// --- Phase Management ---
function switchPhase(phaseName) {
    // Hide all
    Object.values(els.phases).forEach(el => {
        el.classList.remove('active');
        setTimeout(() => { if(!el.classList.contains('active')) el.style.display = 'none'; }, 400);
    });

    const target = els.phases[phaseName];
    if(target) {
        target.style.display = (phaseName === 'input') ? 'flex' : 'flex';
        // Adjust card width
        if(phaseName === 'input') {
            els.card.classList.remove('is-wide');
        } else {
            els.card.classList.add('is-wide');
        }
        
        setTimeout(() => target.classList.add('active'), 50);
    }
}

function resetToInput() {
    els.input.code.value = "";
    els.input.code.disabled = false;
    els.input.btn.disabled = false;
    els.input.btn.innerHTML = `<span data-translate="modal_btn_auth">${TRANSLATIONS[CURRENT_LANG].modal_btn_auth}</span>`;
    switchPhase('input');
}

// --- Fetch Logic ---
async function safeFetch(bodyObj) {
  const token = localStorage.getItem('user_session_token') || "";
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  
  try {
      const response = await fetch(GAS_API_URL, {
          method: 'POST', headers: headers, body: JSON.stringify(bodyObj)
      });
      return await response.json();
  } catch(e) {
      return { success: false, message: 'Network error' };
  }
}

async function performAuth(mode = 'check') {
  const codeVal = els.input.code.value;
  const safeCode = formatCodeInput(codeVal);
  const t = TRANSLATIONS[CURRENT_LANG];
  const reqId = ++currentAuthRequestId;

  if (mode === 'check') {
    if(!safeCode) return;
    els.input.code.disabled = true;
    els.input.btn.disabled = true;
    els.input.btn.innerHTML = `<div class="cyber-spinner"></div>`;
  } else {
    els.preview.btnConfirm.disabled = true;
    els.preview.btnConfirm.innerHTML = `<div class="cyber-spinner" style="width:24px; height:24px;"></div>`;
  }

  try {
    // Mimicking API call structure
    const payload = {
        type: mode === 'check' ? 'check' : 'redeem',
        code: safeCode, 
        lang: CURRENT_LANG,
        app_tier: 'enterprise_standalone',
        _t: Date.now()
    };
    
    const d = await safeFetch(payload);
    if (reqId !== currentAuthRequestId) return;
    currentAuthTime = formatLocalTime(new Date(), CURRENT_LANG);

    if (mode === 'check') {
        if (d.success) {
            currentContentData = d;
            
            // Populate Preview
            els.preview.img.src = escapeHTML(d.imageUrl || "https://via.placeholder.com/400x300");
            els.preview.title.textContent = d.detailedTitle || d.bundleLabel || d.message;
            if(d.detailedDesc) {
                els.preview.warningText.innerHTML = escapeHTML(d.detailedDesc).replace(/\n/g, '<br>');
                els.preview.warningBox.style.display = 'block';
            } else {
                els.preview.warningBox.style.display = 'none';
            }
            
            els.preview.btnConfirm.disabled = false;
            els.preview.btnConfirm.innerHTML = t.btn_continue;
            
            switchPhase('preview');
        } else {
            throw new Error(d.message);
        }
    } else if (mode === 'redeem') {
        if(d.success) {
            // Populate Success
            els.success.img.src = escapeHTML(d.imageUrl || currentContentData.imageUrl);
            els.success.title.textContent = d.bundleLabel || d.message || currentContentData.detailedTitle;
            els.success.time.textContent = currentAuthTime;
            
            const targetUrl = d.actionUrl || d.url;
            if(targetUrl) {
                els.success.btnDownload.style.display = 'flex';
                els.success.btnDownload.href = targetUrl;
            } else {
                els.success.btnDownload.style.display = 'none';
            }
            
            switchPhase('success');
        } else {
            throw new Error(d.message);
        }
    }

  } catch(e) {
    if (reqId !== currentAuthRequestId) return;
    
    let serverMessage = e.message || "";
    let specificErrorCode = generateErrorCode();
    let errorMainText = t.msg_error;
    
    const lowMsg = serverMessage.toLowerCase();
    if (lowMsg.includes("invalid") || lowMsg.includes("not found")) {
        specificErrorCode = "1012"; errorMainText = t.msg_invalid;
    } else if (lowMsg.includes("already owned") || lowMsg.includes("owned")) {
        specificErrorCode = "1011"; errorMainText = t.error_owned_msg;
    } else if (lowMsg.includes("used")) {
        specificErrorCode = "1013"; errorMainText = t.error_used_msg;
    }

    els.error.title.textContent = errorMainText;
    els.error.sub.textContent = serverMessage;
    els.error.code.textContent = specificErrorCode;
    els.error.time.textContent = currentAuthTime;
    
    switchPhase('error');
  }
}

// --- Event Listeners ---
els.input.code.addEventListener('input', (e) => {
    els.input.code.value = formatCodeInput(els.input.code.value);
});
els.input.code.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') performAuth('check');
});
els.input.btn.addEventListener('click', () => performAuth('check'));

els.preview.btnCancel.addEventListener('click', resetToInput);
els.preview.btnConfirm.addEventListener('click', () => performAuth('redeem'));

els.success.btnClose.addEventListener('click', resetToInput);
els.error.btnClose.addEventListener('click', resetToInput);

// --- Initialization ---
function setInitialLanguage(lang, init = false) {
    CURRENT_LANG = lang;
    localStorage.setItem('user_lang', lang);
    
    // Update translations
    const t = TRANSLATIONS[lang];
    if(t) {
        document.querySelectorAll('[data-translate]').forEach(el => {
            const key = el.getAttribute('data-translate');
            if(t[key]) el.innerHTML = t[key];
        });
        els.input.code.placeholder = t.modal_placeholder;
        
        const langMap = { ja: '日本語', en: 'English', zh: '简体中文', 'zh-TW': '繁體中文', ko: '한국어', ru: 'Русский' };
        document.getElementById('currentLangLabel').textContent = langMap[lang];
    }
    
    if(init) {
        document.getElementById('langSelectionOverlay').style.display = 'none';
        document.getElementById('topNav').style.opacity = '1';
        document.getElementById('mainWrapper').style.opacity = '1';
    } else {
        document.getElementById('langSelectionOverlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('langSelectionOverlay').style.display = 'none';
            document.getElementById('topNav').style.opacity = '1';
            document.getElementById('mainWrapper').style.opacity = '1';
        }, 400);
    }
    
    try { if(typeof lucide !== 'undefined') lucide.createIcons(); } catch(e){}
}

document.addEventListener('DOMContentLoaded', () => {
    try { if(typeof lucide !== 'undefined') lucide.createIcons(); } catch(e){}
    
    let sLang = localStorage.getItem('user_lang');
    if(sLang) {
        setInitialLanguage(sLang, true);
    } else {
        document.getElementById('langSelectionOverlay').style.display = 'flex';
    }

    // Theme logic
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    let particleHue = 210;
    
    function applyTheme(theme) {
        htmlEl.setAttribute('data-theme', theme);
        particleHue = theme === 'light' ? 210 : 220; 
        themeBtn.innerHTML = theme === 'light' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
        try { lucide.createIcons(); } catch(e){}
    }
    
    const savedTheme = localStorage.getItem('user_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);
    
    themeBtn.addEventListener('click', () => {
        const next = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        applyTheme(next);
        localStorage.setItem('user_theme', next);
    });

    // Language Dropdown
    const langTrigger = document.getElementById('langTrigger');
    const langMenu = document.getElementById('langMenu');
    langTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        langMenu.classList.toggle('open');
    });
    document.querySelectorAll('.lang-option').forEach(opt => {
        opt.addEventListener('click', () => {
            setInitialLanguage(opt.getAttribute('data-value'), true);
            langMenu.classList.remove('open');
        });
    });
    document.addEventListener('click', () => langMenu.classList.remove('open'));

    // Particles
    const canvas = document.getElementById('particleCanvas'); 
    const ctx = canvas.getContext('2d'); 
    canvas.width = innerWidth; canvas.height = innerHeight;
    class Particle {
        constructor() { this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.size=Math.random()*150+50; this.speedX=Math.random()*0.2-0.1; this.speedY=Math.random()*0.2-0.1; this.opacity=Math.random()*0.3+0.1; }
        update() { this.x+=this.speedX; this.y+=this.speedY; if(this.x<0||this.x>canvas.width)this.speedX*=-1; if(this.y<0||this.y>canvas.height)this.speedY*=-1; }
        draw() { ctx.fillStyle=`hsla(${particleHue}, 100%, 50%, ${this.opacity*0.2})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
    }
    let p = []; for(let i=0;i<8;i++) p.push(new Particle());
    function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); p.forEach(i=>{i.update();i.draw();}); requestAnimationFrame(animate); }
    window.addEventListener('resize', () => { canvas.width=innerWidth; canvas.height=innerHeight; }); animate();
});
