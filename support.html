<style>
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Medium.woff') format('woff'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Medium.woff') format('woff'); font-weight: 400; font-style: normal; }
:root {
  --primary: #007DFF;
  --bg-color: #F1F3F5;
  --card-bg: rgba(255, 255, 255, 0.8);
  --modal-text-main: #000000;
  --modal-text-sub: #666666;
  --btn-close-border: #000000;
  --nav-text: #000;
  --sidebar-bg: #E0E0E0;
  --sidebar-text: #000;
  --sidebar-width: 340px;
  --sidebar-item-hover: rgba(0,0,0,0.05);
  --spring-ease: cubic-bezier(0.33, 1, 0.68, 1);
  --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif;
}

:root:lang(ja) { --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif; }
:root:lang(en) { --font-stack: 'HarmonyOS Sans', sans-serif; }
:root:lang(zh) { --font-stack: 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif; }
:root:lang(zh-TW) { --font-stack: 'HarmonyOS Sans TC', 'Microsoft JhengHei', sans-serif; }
:root:lang(ko) { --font-stack: 'HarmonyOS Sans', 'Noto Sans KR', sans-serif; }
:root:lang(ru) { --font-stack: 'HarmonyOS Sans', sans-serif; }

[data-theme="dark"] {
  --bg-color: #121212;
  --card-bg: #1C1C1E;
  --modal-text-main: #FFFFFF;
  --modal-text-sub: #A0A0A0;
  --btn-close-border: #FFFFFF;
  --nav-text: #fff;
  --sidebar-bg: #000000;
  --sidebar-text: #fff;
  --sidebar-item-hover: rgba(255,255,255,0.1);
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.2); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(128, 128, 128, 0.4); }
[data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0; padding: 0;
  background-color: var(--bg-color);
  color: var(--modal-text-main);
  font-family: var(--font-stack);
  height: 100vh;
  height: 100dvh;
  overflow: hidden; 
  display: flex; 
  transition: background-color 0.5s ease;
}

button, input, textarea, a { font-family: var(--font-stack); }

#particleCanvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 0; opacity: 0.4; pointer-events: none;
  filter: blur(80px);
}
.rgl-wrapper {
  display: flex;
  width: 100%;
  height: 100%;
  z-index: 5;
  position: relative;
}
.rgl-sidebar {
  width: var(--sidebar-width);
  background-color: var(--sidebar-bg);
  display: flex;
  flex-direction: column; 
  padding: 0; 
  flex-shrink: 0;
  border-right: 1px solid rgba(128,128,128,0.1);
  color: var(--sidebar-text);
  z-index: 100;
  overflow: hidden; 
}

.rgl-brand-area {
  padding: 30px 24px 20px 24px;
  flex-shrink: 0;
}
.rgl-brand {
  font-family: var(--font-stack);
  font-weight: 800;
  font-size: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--sidebar-text);
  white-space: nowrap;
}
.rgl-brand svg { color: #e6002f; }

.capsule-menu {
    display: flex;
    background: rgba(128, 128, 128, 0.1);
    border-radius: 50px;
    padding: 6px !important;
    margin: 0 24px 20px 24px;
    gap: 4px;
    border: none !important;
}
.capsule-menu .rgl-tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 800;
    color: var(--sidebar-text);
    opacity: 0.6;
    transition: all 0.3s ease;
    text-decoration: none;
}
.capsule-menu .rgl-tab.active {
    opacity: 1;
    background: var(--card-bg);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
[data-theme="dark"] .capsule-menu .rgl-tab.active {
    background: rgba(255,255,255,0.15);
}

.rgl-scroll-content {
  flex: 1;
  overflow-y: auto;
  padding: 10px 24px;
}

/* Sidebar Bottom Controls */
.rgl-bottom-controls {
  margin-top: auto;
  padding: 20px 24px 30px 24px;
  flex-shrink: 0;
  border-top: 1px solid rgba(128,128,128,0.1);
}

.lang-trigger-sidebar {
    width: 100%;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px !important;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    color: var(--sidebar-text);
    border-radius: 50px !important;
    background: transparent;
    transition: all 0.2s ease;
    font-family: var(--font-stack);
    border: 1px solid transparent;
}
.lang-trigger-sidebar:hover { background: rgba(128, 128, 128, 0.15); }
[data-theme="dark"] .lang-trigger-sidebar { border: 1px solid rgba(255, 255, 255, 0.6) !important; background: rgba(255, 255, 255, 0.05); }
[data-theme="dark"] .lang-trigger-sidebar:hover { border-color: #fff !important; background: rgba(255, 255, 255, 0.15); }
.lang-list { position: absolute; bottom: 80px; left: 24px; width: 200px; background: var(--card-bg); backdrop-filter: blur(20px); padding: 5px; border-radius: 12px; list-style: none; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 200; border: 1px solid rgba(128,128,128,0.1); margin: 0; }
.lang-list.open { display: block; animation: popIn 0.3s; }
.lang-list li { padding: 10px 15px; cursor: pointer; border-radius: 8px; color: var(--modal-text-main); font-size: 13px; font-family: var(--font-stack); }
.lang-list li:hover { background: rgba(128,128,128,0.1); }
[data-theme="dark"] .lang-list li { color: #fff; }

/* MAIN CONTENT AREA */
.rgl-main {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background-color: var(--bg-color);
}

.rgl-header {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: 24px 40px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.theme-pill {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--card-bg); border: 1px solid rgba(128,128,128,0.2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: transform 0.3s; backdrop-filter: blur(10px); 
  color: #e6002f(--modal-text-main);
}
.theme-pill:hover { transform: scale(1.1); }
[data-theme="dark"] .theme-pill { 
  color: #fff; 
}

/* SUPPORT CONTENT */
.support-content {
    padding: 40px 60px 80px 60px;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.page-title-area {
    text-align: center;
    margin-bottom: 40px;
    margin-top: auto;
    animation: fadeInUp 0.6s ease forwards;
    flex-shrink: 0;
}
.page-title {
    font-size: 36px;
    font-weight: 800; margin: 0 0 8px 0;
    text-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
.page-sub { opacity: 0.6; font-size: 14px; font-weight: 500; }

.bento-grid {
    display: grid;
    width: 100%;
    max-width: 1000px; 
    margin: 0 auto auto auto;
    grid-template-columns: 1fr 1fr; 
    gap: 30px;
}

.bento-card {
    background: var(--card-bg);
    border: 1px solid rgba(128,128,128,0.1);
    border-radius: 24px;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s var(--spring-ease);
    backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: var(--modal-text-main);
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    min-height: 300px;
}
.bento-card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    border-color: rgba(128,128,128,0.3);
    z-index: 10;
}
[data-theme="dark"] .bento-card:hover { border-color: #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

.card-large-left { background: linear-gradient(135deg, rgba(0,125,255,0.05) 0%, var(--card-bg) 100%); }
.card-large-right { background: linear-gradient(135deg, rgba(255,165,0,0.05) 0%, var(--card-bg) 100%); }

.bento-card .card-icon { color: var(--modal-text-main); margin-bottom: 24px; transition: transform 0.3s; }
.bento-card:hover .card-icon { transform: scale(1.1) rotate(3deg); }
.bento-card .card-title { font-size: 28px; font-weight: 800; text-align: center; }
.bento-card .card-desc { font-size: 15px; margin-top: 12px; opacity: 0.6; font-weight: 500; text-align: center; }
.mobile-menu-trigger { display: none; }
.mobile-nav-overlay { display: none; }

@media (max-width: 768px) {
    .mobile-menu-trigger { display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--sidebar-text); cursor: pointer; padding: 8px; margin-right: 4px; }
    .rgl-brand { order: 2; }
    .mobile-menu-trigger { order: 1; }
    
    .mobile-nav-overlay { display: flex; flex-direction: column; position: fixed; inset: 0; background: var(--bg-color); z-index: 10001; padding: 40px; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); visibility: hidden; }
    .mobile-nav-overlay.active { transform: translateX(0); visibility: visible; }
    .mobile-menu-close { align-self: flex-end; background: transparent; border: 1px solid var(--btn-close-border); color: var(--modal-text-main); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 40px; }
    .mobile-nav-content { display: flex; flex-direction: column; gap: 40px; flex: 1; }
    .mobile-nav-item { font-family: var(--font-stack); font-size: 32px; font-weight: 800; color: var(--modal-text-main); text-decoration: none; text-align: left; opacity: 0; transform: translateX(-20px); transition: opacity 0.3s ease, transform 0.3s ease; }
    .mobile-nav-overlay.active .mobile-nav-item { opacity: 1; transform: translateX(0); }
    .mobile-nav-overlay.active .mobile-nav-item:nth-child(1) { transition-delay: 0.1s; }
    .mobile-nav-overlay.active .mobile-nav-item:nth-child(2) { transition-delay: 0.2s; }
    .mobile-menu-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(128,128,128,0.1); position: relative; }
    
    .rgl-wrapper { flex-direction: column; }
    .rgl-sidebar { width: 100%; height: auto; padding: 0; border-right: none; border-bottom: 1px solid rgba(128,128,128,0.1); overflow: visible; position: relative; z-index: 100; background-color: var(--sidebar-bg); }
    .rgl-brand-area { padding: 16px 12px; display: flex; align-items: center; justify-content: flex-start; gap: 8px; width: 100%; padding-right: 120px; }
    
    .rgl-scroll-content, .rgl-bottom-controls, .capsule-menu { display: none !important; } 
    .rgl-main { position: static !important; }

    .rgl-header { 
        position: absolute !important; 
        top: 0; right: 0; width: auto; height: 70px; 
        background: transparent !important; padding: 0 16px; 
        z-index: 200; display: flex !important; 
        align-items: center; justify-content: flex-end; 
        pointer-events: none; 
    }
    .rgl-header > * { pointer-events: auto; }
    
    .support-content { padding: 30px 20px; display: block; }
    .bento-grid { grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
    .bento-card { min-height: 200px; padding: 30px 20px; }
}

@keyframes popIn { 0% { opacity: 0; transform: scale(0.95) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

/* Spotlight effect */
.spotlight-hover { position: relative; overflow: hidden; }
.spotlight-hover::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(150px circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.15), transparent 40%);
    z-index: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
}
[data-theme="light"] .spotlight-hover::before {
    background: radial-gradient(150px circle at var(--x, 50%) var(--y, 50%), rgba(0,0,0,0.08), transparent 40%);
}
.spotlight-hover:hover::before { opacity: 1; }
.spotlight-hover > * { position: relative; z-index: 1; }
</style>

            card_web_title: "Поиск кода ошибки", desc_web_short: "Детали поиска",
            card_contact_title: "Связаться", desc_contact_short: "Поддержка по почте",
            btn_inquiry: "Перейти к поиску",
            desc_web: "Проверьте детали ошибки на специальной странице."
        }
    };

    function setLanguage(lang) {
        const t = TRANSLATIONS[lang] || TRANSLATIONS.ja;
        document.documentElement.lang = lang;
        
        document.querySelectorAll('[data-translate]').forEach(el => {
            const key = el.getAttribute('data-translate');
            if(t[key]) el.textContent = t[key];
        });
        
        const langMap = { ja: '日本語', en: 'English', zh: '简体中文', 'zh-TW': '繁體中文', ko: '한국어', ru: 'Русский' };
        const lbl = document.getElementById('currentLangLabel');
        const mlbl = document.getElementById('mobileCurrentLangLabel');
        if(lbl) lbl.textContent = langMap[lang] || 'Language';
        if(mlbl) mlbl.textContent = langMap[lang] || 'Language';
        
        return t;
    }

    document.addEventListener('DOMContentLoaded', () => {
        try { if(typeof lucide !== 'undefined') lucide.createIcons(); } catch(e){}
        setupHoverEffects();
        let sLang = localStorage.getItem('user_lang') || 'ja';
        setLanguage(sLang);
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileNav = document.getElementById('mobileNav');
        const mobileMenuCloseBtn = document.getElementById('mobileMenuCloseBtn');
        
        if (mobileMenuBtn && mobileNav) {
            mobileMenuBtn.addEventListener('click', () => mobileNav.classList.add('active'));
        }
        if (mobileMenuCloseBtn && mobileNav) {
            mobileMenuCloseBtn.addEventListener('click', () => mobileNav.classList.remove('active'));
        }
        const langTrigger = document.getElementById('langTrigger');
        const langMenu = document.getElementById('langMenu');
        if(langTrigger && langMenu) {
            langTrigger.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                langMenu.classList.toggle('open'); 
            });
        }
        
        const mobileLangTrigger = document.getElementById('mobileLangTrigger');
        const mobileLangMenu = document.getElementById('mobileLangMenu');
        if(mobileLangTrigger && mobileLangMenu) {
            mobileLangTrigger.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                mobileLangMenu.classList.toggle('open'); 
            });
        }

        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', () => {
                const val = opt.getAttribute('data-value');
                localStorage.setItem('user_lang', val);
                setLanguage(val);
                if(langMenu) langMenu.classList.remove('open');
                if(mobileLangMenu) mobileLangMenu.classList.remove('open');
            });
        });

        document.addEventListener('click', (e) => { 
            if (langTrigger && langMenu && !langTrigger.contains(e.target)) langMenu.classList.remove('open'); 
            if (mobileLangTrigger && mobileLangMenu && !mobileLangTrigger.contains(e.target)) mobileLangMenu.classList.remove('open');
        });

        const htmlEl = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let particleHue = 210;

        function initParticles(theme) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particleHue = theme === 'light' ? 210 : 220;
            particles = [];
            for(let i=0; i<8; i++) particles.push(new Particle());
        }

        class Particle {
            constructor() { 
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height; 
                this.size = Math.random() * 150 + 50; 
                this.speedX = Math.random() * 0.2 - 0.1; 
                this.speedY = Math.random() * 0.2 - 0.1; 
                this.opacity = Math.random() * 0.3 + 0.1; 
            }
            update() { 
                this.x += this.speedX; this.y += this.speedY; 
                if(this.x < 0 || this.x > canvas.width) this.speedX *= -1; 
                if(this.y < 0 || this.y > canvas.height) this.speedY *= -1; 
            }
            draw() { 
                ctx.fillStyle = `hsla(${particleHue}, 100%, 50%, ${this.opacity * 0.2})`; 
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); 
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', () => { initParticles(htmlEl.getAttribute('data-theme')); });
        animate();
        function applyTheme(theme) {
            htmlEl.setAttribute('data-theme', theme);
            if (themeToggle) {
                themeToggle.innerHTML = theme === 'light' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
                try { if(typeof lucide !== 'undefined') lucide.createIcons(); } catch(e){}
            }
            initParticles(theme);
        }

        const savedTheme = localStorage.getItem('user_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(savedTheme);

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const next = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                applyTheme(next);
                localStorage.setItem('user_theme', next);
            });
        }
    });
</script>
</body>
</html>
