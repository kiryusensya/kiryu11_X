<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>_.k__yu.10 Support</title>
<link rel="icon" href="https://static.wixstatic.com/media/2f0694_eb4d3063598a4cc5b6bd6b8e31cba915~mv2.png/v1/crop/x_248,y_0,w_1065,h_950/fill/w_816,h_728,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/1767545356653.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
/* --- 共通変数 --- */
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Regular.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Bold.woff') format('woff'); font-weight: 700; }
@font-face { font-family: 'HarmonyOS Sans SC'; src: url('assets/fonts/HarmonyOS_SansSC_Medium.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'HarmonyOS Sans TC'; src: url('assets/fonts/HarmonyOS_SansTC_Medium.woff') format('woff'); font-weight: 400; }

:root {
  --primary: #007DFF;
  --bg-color: #F1F3F5;
  --card-bg: rgba(255, 255, 255, 0.8);
  --modal-text-main: #000000;
  --modal-text-sub: #666666;
  --nav-text: #000;
  --sidebar-text: #000;
  --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif;
  --spring-ease: cubic-bezier(0.33, 1, 0.68, 1);
  --btn-close-border: #000000;
}

:root:lang(ja) { --font-stack: 'HarmonyOS Sans', 'Noto Sans JP', sans-serif; }
:root:lang(en) { --font-stack: 'HarmonyOS Sans', sans-serif; }
:root:lang(zh) { --font-stack: 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif; }
:root:lang(zh-TW) { --font-stack: 'HarmonyOS Sans TC', 'Microsoft JhengHei', sans-serif; }
:root:lang(ko) { --font-stack: 'HarmonyOS Sans', 'Noto Sans KR', sans-serif; }
:root:lang(ru) { --font-stack: 'HarmonyOS Sans', sans-serif; }

[data-theme="dark"] {
  --bg-color: #000000;
  --card-bg: #1C1C1E;
  --modal-text-main: #FFFFFF;
  --modal-text-sub: #A0A0A0;
  --nav-text: #fff;
  --sidebar-text: #fff;
  --btn-close-border: #FFFFFF;
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0; padding: 0;
  background-color: var(--bg-color);
  color: var(--modal-text-main);
  font-family: var(--font-stack);
  min-height: 100vh;
  overflow-x: hidden; 
  display: flex;
  flex-direction: column;
  transition: background-color 0.5s ease;
  position: relative;
}

#particleCanvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 0; opacity: 0.4; pointer-events: none;
  filter: blur(80px);
}

/* --- ヘッダーレイアウト --- */
.unified-header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100px;
    z-index: 50;
    pointer-events: none;
}

.header-left-group {
    position: absolute;
    top: 30px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    pointer-events: auto;
}

.hamburger-btn {
    display: none;
    background: transparent;
    border: none;
    color: var(--sidebar-text);
    cursor: pointer;
    padding: 0;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
}
.hamburger-btn:hover { transform: scale(1.1); }

.header-brand {
    font-size: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--sidebar-text);
}
.header-brand i { color: #FFA500; }
.brand-text-mobile { display: none; }

.header-right {
    position: absolute;
    top: 24px;
    right: 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    pointer-events: auto;
}

.rgl-tabs { display: flex; gap: 30px; }
.rgl-tab {
    position: relative;
    margin: 0 4px !important;
    padding: 0 !important;
    border: none !important;
    background: transparent !important;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--nav-text);
    opacity: 0.6;
    transition: opacity 0.2s ease;
    z-index: 1;
    cursor: pointer;
}
.rgl-tab:hover, .rgl-tab.active { opacity: 1; }
.rgl-tab::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: calc(100% + 37px); height: 38px; border-radius: 50px;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%) scale(0.9);
    opacity: 0; z-index: -1; pointer-events: none;
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.rgl-tab:hover::before, .rgl-tab.active::before { opacity: 1; transform: translate(-50%, -50%) scale(1); }
[data-theme="dark"] .rgl-tab::before { background: rgba(0, 0, 0, 0.3); border-color: rgba(255, 255, 255, 0.1); }
[data-theme="dark"] .rgl-tab { color: #fff; }

.theme-pill {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--card-bg); border: 1px solid rgba(128,128,128,0.2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.3s; backdrop-filter: blur(10px);
    color: var(--modal-text-main);
}
.theme-pill:hover { transform: scale(1.1); }
[data-theme="dark"] .theme-pill { color: #fff; }

/* --- メインコンテンツエリア --- */
.support-wrapper {
    width: 100%;
    min-height: 100vh;
    padding: 100px 40px 40px 40px; 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start; /* 中央配置から上寄せに変更 */
    z-index: 5;
    position: relative;
    box-sizing: border-box;
}

.page-title-area {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeInUp 0.6s ease forwards;
    flex-shrink: 0;
}
.page-title {
    font-size: 36px;
    font-weight: 800; margin: 0 0 8px 0;
    text-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
.page-sub { opacity: 0.6; font-size: 13px; }

/* --- エラー検索専用カードレイアウト --- */
.search-card-wrapper {
    width: 100%;
    max-width: 800px; /* PCでの最大幅 */
    animation: fadeInUp 0.8s ease forwards;
}

.search-card {
    background: var(--card-bg);
    border: 1px solid rgba(128,128,128,0.2);
    border-radius: 32px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    color: var(--modal-text-main);
    transition: all 0.3s var(--spring-ease);
}
[data-theme="dark"] .search-card { border-color: rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

.search-title { margin:0 0 10px 0; font-size:24px; font-weight:800; text-align: center; }
.search-sub { color:var(--modal-text-sub); margin:0 0 30px 0; font-size:14px; text-align: center; }

.search-input-group {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.code-search-field {
    width: 100%; border: 1px solid rgba(128,128,128,0.2); background: rgba(128, 128, 128, 0.05);
    height: 56px; border-radius: 16px;
    text-align: center; outline: none; transition: 0.3s;
    color: var(--modal-text-main); font-family: var(--font-stack); font-size: 17px; font-weight: 700; padding: 0 20px;
}
[data-theme="dark"] .code-search-field { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
.code-search-field:focus { border-color: var(--primary); background: rgba(0, 125, 255, 0.05); }

.btn-search-code {
    width: 100%; height: 56px; border: none; background: var(--primary); color: white;
    border-radius: 50px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.2s; font-family: var(--font-stack);
}
.btn-search-code:active { transform: scale(0.98); }
.btn-search-code:disabled { opacity: 0.6; pointer-events: none; }

/* 検索結果エリア */
.search-result-area {
    width: 100%;
    margin-top: 30px;
    padding-top: 30px;
    border-top: 1px solid rgba(128,128,128,0.2);
    display: none;
    flex-direction: column;
    animation: fadeInUp 0.4s ease forwards;
}
.result-box {
    background: rgba(128,128,128,0.1);
    border-radius: 16px;
    padding: 24px;
    text-align: left;
}
.result-code-title { margin: 0 0 12px 0; font-size: 20px; color: var(--primary); font-weight: 800;}
.result-message { margin: 0; font-size: 15px; line-height: 1.6; white-space: pre-wrap; font-weight: 500;}


/* スマホメニューオーバーレイ */
.nav-overlay {
    position: fixed; inset: 0; background: var(--bg-color); z-index: 10000; padding: 40px; display: flex; flex-direction: column; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); visibility: hidden;
}
.nav-overlay.active { transform: translateX(0); visibility: visible; }
.nav-close-btn { align-self: flex-end; background: transparent; border: 1px solid var(--btn-close-border); color: var(--modal-text-main); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 40px; }
.nav-content { display: flex; flex-direction: column; gap: 40px; margin-top: 40px; }
.nav-item { font-size: 32px; font-weight: 800; color: var(--modal-text-main); text-decoration: none; opacity: 0; transform: translateX(-20px); transition: opacity 0.3s ease, transform 0.3s ease; }
.nav-overlay.active .nav-item { opacity: 1; transform: translateX(0); }
.nav-overlay.active .nav-item:nth-child(1) { transition-delay: 0.1s; }
.nav-overlay.active .nav-item:nth-child(2) { transition-delay: 0.2s; }

/* スマホ対応レスポンシブ */
@media (max-width: 900px) {
    .rgl-tabs { display: none; }
    .hamburger-btn { display: flex; }
    .brand-text-pc { display: none; }
    .brand-text-mobile { display: inline; }
    .unified-header { height: auto; }
    .header-left-group { top: 0; left: 0; margin: 24px 0 0 24px; position: relative; }
    .header-right { top: 24px; right: 24px; margin: 0; position: absolute; }
    .support-wrapper { padding: 100px 20px 40px 20px; }
    
    .search-card { padding: 30px 20px; }
}

@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

</style>
</head>
<body>

<div class="nav-overlay" id="navOverlay">
    <button class="nav-close-btn" id="navCloseBtn">
        <i data-lucide="x"></i>
    </button>
    <div class="nav-content">
        <a href="index.html" class="nav-item" data-translate="tab_home">ACTIVATION</a>
        <a href="support.html" class="nav-item" data-translate="tab_support">SUPPORT</a>
    </div>
</div>

<canvas id="particleCanvas"></canvas>

<nav class="unified-header">
    <div class="header-left-group">
        <button class="hamburger-btn" id="hamburgerBtn">
            <i data-lucide="menu" size="24"></i>
        </button>
        <div class="header-brand">
            <i data-lucide="shield-check"></i>
            <span class="brand-text-pc" data-translate="brand_name">kr_開発者版 | Support</span>
            <span class="brand-text-mobile" data-translate="brand_mobile">Support</span>
        </div>
    </div>

    <div class="header-right">
        <div class="rgl-tabs">
            <a href="index.html" class="rgl-tab" data-translate="tab_home">ACTIVATION</a>
            <a href="#" class="rgl-tab active" data-translate="tab_support">SUPPORT</a>
        </div>
        <div class="theme-pill" id="themeToggle"><i data-lucide="sun" id="themeIcon"></i></div>
        <div class="theme-pill" style="width:40px; height:40px; border:none; cursor:default;"><i data-lucide="user-round" size="20"></i></div>
    </div>
</nav>

<div class="support-wrapper">
    <div class="page-title-area">
        <h1 class="page-title" data-translate="page_title">Support Center</h1>
        <div class="page-sub" data-translate="page_sub">エラーコード検索</div>
    </div>

    <div class="search-card-wrapper">
        <div class="search-card">
            
            <i data-lucide="search" style="color:var(--primary); width:48px; height:48px; margin-bottom:20px;"></i>
            <h2 class="search-title" data-translate="error_modal_title">エラーコード検索</h2>
            <p class="search-sub" data-translate="error_modal_sub">サポートが必要なエラーコードを入力してください。</p>

            <div class="search-input-group">
                <input type="text" id="errorCodeInput" class="code-search-field" placeholder="" autocomplete="off">
                <button id="btnErrorCheck" class="btn-search-code" onclick="searchErrorCode()"><span data-translate="btn_search">検索する</span></button>
                <div id="errorSearchStatus" style="color:#FF3B30; font-size:13px; min-height:20px; text-align:center;"></div>
            </div>

            <div id="searchResultArea" class="search-result-area">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h3 style="margin:0; font-size:18px; font-weight:800;" data-translate="error_result_title">検索結果</h3>
                    <button onclick="resetSearch()" style="background:transparent; border:none; color:var(--modal-text-sub); cursor:pointer; font-size:14px; text-decoration:underline;" data-translate="btn_back">クリア</button>
                </div>
                <div class="result-box">
                    <h4 class="result-code-title" id="resultErrorCode">Error: ----</h4>
                    <p class="result-message" id="resultErrorMessage"></p>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    // ハンバーガーメニュー制御
    const navOverlay = document.getElementById('navOverlay');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navCloseBtn = document.getElementById('navCloseBtn');

    if(hamburgerBtn) {
        hamburgerBtn.addEventListener('click', () => {
            navOverlay.classList.add('active');
        });
    }
    if(navCloseBtn) {
        navCloseBtn.addEventListener('click', () => {
            navOverlay.classList.remove('active');
        });
    }

    // Translations
    const TRANSLATIONS = {
        ja: { 
            brand_name: "_.k__yu.10 | Support", brand_mobile: "Support",
            tab_home: "ホーム", tab_news: "ニュース", tab_support: "サポート",
            page_title: "サポートセンター", page_sub: "エラーコードを検索して解決策を見つけます", 
            error_modal_title: "エラー検索", error_modal_sub: "サポートが必要なエラーコードを入力してください。",
            btn_search: "検索する", error_empty: "エラーコードを入力してください。", error_not_found: "エラーコードが見つかりません。",
            error_result_title: "検索結果", btn_back: "クリア"
        },
        en: { 
            brand_name: "_.k__yu.10 | Support", brand_mobile: "Support",
            tab_home: "Home", tab_news: "NEWS", tab_support: "Support",
            page_title: "Support Center", page_sub: "Search for error codes to find solutions", 
            error_modal_title: "Error Search", error_modal_sub: "Enter the error code you need support with.",
            btn_search: "Search", error_empty: "Please enter an error code.", error_not_found: "Error code not found.",
            error_result_title: "Result", btn_back: "Clear"
        },
        zh: { 
            brand_name: "_.k__yu.10 | Support", brand_mobile: "Support",
            tab_home: "首页", tab_news: "新闻", tab_support: "支持",
            page_title: "服务中心", page_sub: "搜索错误代码以查找解决方案", 
            error_modal_title: "错误查询", error_modal_sub: "请输入需要支持的错误代码。",
            btn_search: "查询", error_empty: "请输入错误代码。", error_not_found: "未找到该错误代码。",
            error_result_title: "查询结果", btn_back: "清除"
        },
        "zh-TW": { 
            brand_name: "_.k__yu.10 | Support", brand_mobile: "Support",
            tab_home: "首頁", tab_news: "新聞", tab_support: "支援",
            page_title: "服務中心", page_sub: "搜尋錯誤代碼以尋找解決方案", 
            error_modal_title: "錯誤查詢", error_modal_sub: "請輸入需要支援的錯誤代碼。",
            btn_search: "查詢", error_empty: "請輸入錯誤代碼。", error_not_found: "未找到該錯誤代碼。",
            error_result_title: "查詢結果", btn_back: "清除"
        },
        ko: { 
            brand_name: "_.k__yu.10 | Support", brand_mobile: "Support",
            tab_home: "메인 페이지", tab_news: "뉴스", tab_support: "지원",
            page_title: "서비스 센터", page_sub: "오류 코드를 검색하여 해결책을 찾으세요", 
            error_modal_title: "오류 검색", error_modal_sub: "지원이 필요한 오류 코드를 입력하세요.",
            btn_search: "검색", error_empty: "오류 코드를 입력하세요.", error_not_found: "오류 코드를 찾을 수 없습니다.",
            error_result_title: "검색 결과", btn_back: "지우기"
        },
        ru: { 
            brand_name: "_.k__yu.10 | Support", brand_mobile: "Support",
            tab_home: "Главная", tab_news: "Новости", tab_support: "Поддержка",
            page_title: "Центр поддержки", page_sub: "Поиск кодов ошибок для поиска решений", 
            error_modal_title: "Поиск ошибки", error_modal_sub: "Введите код ошибки для поддержки.",
            btn_search: "Поиск", error_empty: "Введите код ошибки.", error_not_found: "Код ошибки не найден.",
            error_result_title: "Результат", btn_back: "Очистить"
        }
    };

    // 言語設定
    function setLanguage() {
        const lang = localStorage.getItem('user_lang') || 'ja';
        const t = TRANSLATIONS[lang] || TRANSLATIONS.ja;
        document.documentElement.lang = lang;
        
        document.querySelectorAll('[data-translate]').forEach(el => {
            const key = el.getAttribute('data-translate');
            if(t[key]) el.textContent = t[key];
        });
        return t;
    }

    // テーマ設定
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const htmlEl = document.documentElement;

    function initTheme() {
        const saved = localStorage.getItem('user_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(saved);
    }
    function applyTheme(theme) {
        htmlEl.setAttribute('data-theme', theme);
        themeIcon.setAttribute('data-lucide', theme === 'light' ? 'sun' : 'moon');
        lucide.createIcons();
        initParticles(theme);
    }
    themeToggle.addEventListener('click', () => {
        const current = htmlEl.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem('user_theme', next);
    });

    // パーティクル背景
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let particleHue = 210;
    function initParticles(theme) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particleHue = theme === 'light' ? 210 : 220;
        particles = [];
        for(let i=0; i<8; i++) particles.push(new Particle());
    }
    class Particle {
        constructor() { 
            this.x = Math.random() * canvas.width; 
            this.y = Math.random() * canvas.height; 
            this.size = Math.random() * 150 + 50; 
            this.speedX = Math.random() * 0.2 - 0.1; 
            this.speedY = Math.random() * 0.2 - 0.1; 
            this.opacity = Math.random() * 0.3 + 0.1; 
        }
        update() { 
            this.x += this.speedX; this.y += this.speedY; 
            if(this.x < 0 || this.x > canvas.width) this.speedX *= -1; 
            if(this.y < 0 || this.y > canvas.height) this.speedY *= -1; 
        }
        draw() { 
            ctx.fillStyle = `hsla(${particleHue}, 100%, 50%, ${this.opacity * 0.2})`; 
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); 
        }
    }
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    window.addEventListener('resize', () => { initParticles(htmlEl.getAttribute('data-theme')); });

    // 初期化
    initTheme();
    animate();
    setLanguage();

    // -----------------------------------------
    // エラー検索機能
    // -----------------------------------------
    const GAS_API_URL = "api/proxy"; 

    window.resetSearch = function() {
        document.getElementById('errorCodeInput').value = '';
        document.getElementById('errorSearchStatus').textContent = '';
        document.getElementById('searchResultArea').style.display = 'none';
        document.getElementById('errorCodeInput').focus();
    };

    window.searchErrorCode = async function() {
        const code = document.getElementById('errorCodeInput').value.trim();
        const statusEl = document.getElementById('errorSearchStatus');
        const btn = document.getElementById('btnErrorCheck');
        const resultArea = document.getElementById('searchResultArea');
        const lang = localStorage.getItem('user_lang') || 'ja';
        const t = TRANSLATIONS[lang] || TRANSLATIONS.ja;

        resultArea.style.display = 'none'; // 検索中は結果を隠す

        if (!code) {
            statusEl.textContent = t.error_empty || "エラーコードを入力してください。";
            return;
        }

        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader" class="fa-spin" style="animation: spin 1s linear infinite;"></i>`; 
        lucide.createIcons();
        statusEl.textContent = "";

        try {
            const res = await fetch(`${GAS_API_URL}?type=error_search&code=${encodeURIComponent(code)}&lang=${lang}`);
            const data = await res.json();

            if (data.success) {
                document.getElementById('resultErrorCode').textContent = "Error: " + data.code;
                document.getElementById('resultErrorMessage').textContent = data.errorMessage;
                resultArea.style.display = 'flex'; // 結果を表示
            } else {
                statusEl.textContent = data.message === "Error code not found" ? (t.error_not_found || "見つかりません。") : data.message;
            }
        } catch (e) {
            statusEl.textContent = "Network Error: 接続に失敗しました。";
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<span data-translate="btn_search">${t.btn_search}</span>`;
        }
    };
    
    // Enterキーで検索実行
    document.getElementById('errorCodeInput').addEventListener('keydown', function(e) {
        if(e.key === 'Enter') {
            e.preventDefault();
            searchErrorCode();
        }
    });

    // スピナーアニメーション用のCSS追加（JS内から）
    const style = document.createElement('style');
    style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
    document.head.appendChild(style);

</script>
</body>
</html>
