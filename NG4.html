<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>血殺 / 乱血殺 エディタ</title>

  <style>
    /* --- FONT FACE DEFINITIONS (optional) --- */
    @font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Medium.woff') format('woff'); font-weight: 500; font-style: normal; }
    @font-face { font-family: 'HarmonyOS Sans'; src: url('assets/fonts/HarmonyOS_Sans_Bold.woff') format('woff'); font-weight: 700; font-style: normal; }

    :root:lang(ja){ --font-stack: 'HarmonyOS Sans','Noto Sans JP',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }

    :root{
      --bg:#0b0d12;
      --card:#121625;
      --card2:#0f1320;
      --text:#e9ecf1;
      --muted:#a7b0c0;
      --line:#27304a;
      --accent:#7aa2ff;
      --good:#2dd4bf;
      --warn:#fbbf24;
      --bad:#fb7185;
      --shadow: 0 12px 28px rgba(0,0,0,.35);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: var(--font-stack);
      background: radial-gradient(1200px 800px at 10% 0%, rgba(122,162,255,.18), transparent 55%),
                  radial-gradient(900px 600px at 100% 10%, rgba(45,212,191,.14), transparent 45%),
                  var(--bg);
      color:var(--text);
    }
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: rgba(11,13,18,.65);
      border-bottom: 1px solid rgba(39,48,74,.55);
    }
    .wrap{ max-width: 1200px; margin:0 auto; padding: 18px 16px; }
    .top{
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      flex-wrap:wrap;
    }
    .brand{
      display:flex; flex-direction:column; gap:4px;
    }
    .brand h1{ margin:0; font-size: 18px; letter-spacing:.02em; }
    .brand p{ margin:0; color:var(--muted); font-size: 12px; }

    .actions{ display:flex; gap:10px; flex-wrap:wrap; }
    button, .btn{
      border:1px solid rgba(39,48,74,.85);
      background: linear-gradient(180deg, rgba(18,22,37,.95), rgba(12,15,27,.95));
      color:var(--text);
      padding:10px 12px;
      border-radius: 14px;
      cursor:pointer;
      box-shadow: 0 8px 16px rgba(0,0,0,.22);
      font-weight: 600;
      font-size: 13px;
    }
    button:hover{ border-color: rgba(122,162,255,.75); }
    button.primary{
      border-color: rgba(122,162,255,.9);
      background: linear-gradient(180deg, rgba(122,162,255,.28), rgba(18,22,37,.95));
    }
    button.good{ border-color: rgba(45,212,191,.9); }
    button.bad{ border-color: rgba(251,113,133,.85); }

    main .wrap{ padding: 18px 16px 40px; }
    .grid{
      display:grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items:start;
    }
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
    }

    .card{
      background: linear-gradient(180deg, rgba(18,22,37,.92), rgba(13,16,28,.92));
      border: 1px solid rgba(39,48,74,.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card .hd{
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(39,48,74,.55);
      display:flex; justify-content:space-between; align-items:center; gap:10px;
    }
    .card .hd h2{
      margin:0; font-size: 14px; color: var(--text);
    }
    .card .bd{ padding: 14px; }

    input, textarea, select{
      width:100%;
      background: rgba(10,12,18,.55);
      color: var(--text);
      border: 1px solid rgba(39,48,74,.85);
      border-radius: 12px;
      padding: 10px 10px;
      outline:none;
      font-size: 13px;
    }
    input::placeholder, textarea::placeholder{ color: rgba(167,176,192,.7); }
    textarea{ min-height: 84px; resize: vertical; }
    label{ display:block; font-size:12px; color: var(--muted); margin: 12px 0 6px; }
    .row{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px){ .row{ grid-template-columns: 1fr; } }

    .list{
      display:flex; flex-direction:column; gap: 10px;
    }
    .item{
      border: 1px solid rgba(39,48,74,.65);
      background: linear-gradient(180deg, rgba(15,19,32,.95), rgba(12,15,27,.95));
      border-radius: 14px;
      padding: 10px 10px;
      cursor:pointer;
    }
    .item:hover{ border-color: rgba(122,162,255,.55); }
    .item.active{
      border-color: rgba(122,162,255,.95);
      box-shadow: 0 10px 22px rgba(122,162,255,.15);
    }
    .item .t{ display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .badge{
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(39,48,74,.7);
      color: var(--muted);
      white-space:nowrap;
    }
    .badge.kessatsu{ border-color: rgba(251,191,36,.8); color: #fcd34d; }
    .badge.rankessatsu{ border-color: rgba(251,113,133,.85); color: #fda4af; }
    .item .name{ font-weight: 700; font-size: 13px; }
    .item .desc{ margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.3; }

    .steps{
      display:flex; flex-direction:column; gap: 10px;
      margin-top: 10px;
    }
    .step{
      border: 1px solid rgba(39,48,74,.65);
      background: rgba(10,12,18,.35);
      border-radius: 14px;
      padding: 10px;
    }
    .step .topline{
      display:flex; align-items:center; justify-content:space-between; gap: 10px;
      margin-bottom: 8px;
    }
    .step .idx{ color: var(--muted); font-size: 12px; }
    .step .mini-actions{ display:flex; gap: 6px; }
    .step .mini-actions button{ padding: 8px 10px; font-size: 12px; border-radius: 12px; }
    .stepgrid{
      display:grid;
      grid-template-columns: 1.2fr .9fr 1fr;
      gap: 10px;
    }
    @media (max-width: 980px){
      .stepgrid{ grid-template-columns: 1fr; }
    }

    .preview{
      border: 1px solid rgba(39,48,74,.65);
      border-radius: 16px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(15,19,32,.65), rgba(10,12,18,.35));
      margin-top: 12px;
    }
    .preview h3{
      margin:0 0 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing:.02em;
    }
    .preview .big{
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .preview .meta{ color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .preview ol{ margin: 0; padding-left: 18px; }
    .preview li{ margin: 6px 0; font-size: 13px; line-height: 1.35; }
    .muted{ color: var(--muted); }
    .tiny{ font-size: 12px; }

    .file{
      display:none;
    }
    .footer-note{
      margin-top: 10px;
      color: rgba(167,176,192,.75);
      font-size: 12px;
      line-height: 1.35;
    }
  </style>
</head>

<body>
<header>
  <div class="wrap top">
    <div class="brand">
      <h1>血殺 / 乱血殺 — 技データを“細かく”編集するツール</h1>
      <p>ローカル保存 / JSON共有 / 手順（ステップ）を細分化して管理</p>
    </div>
    <div class="actions">
      <button class="primary" id="btnNew">＋ 新規作成</button>
      <button class="good" id="btnExport">JSON書き出し</button>
      <button class="good" id="btnImport">JSON読み込み</button>
      <button class="bad" id="btnReset" title="全データ削除">リセット</button>
      <input class="file" id="fileImport" type="file" accept="application/json" />
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid">
      <!-- LEFT: list -->
      <section class="card">
        <div class="hd">
          <h2>技リスト</h2>
          <span class="tiny muted" id="count"></span>
        </div>
        <div class="bd">
          <input id="search" placeholder="検索（名前/説明/ステップ）" />
          <div style="height:12px"></div>
          <div class="list" id="list"></div>
          <div class="footer-note">
            ※ クリックで編集対象を切替。データは自動でブラウザに保存されます。
          </div>
        </div>
      </section>

      <!-- RIGHT: editor -->
      <section class="card">
        <div class="hd">
          <h2>編集</h2>
          <div style="display:flex; gap:10px;">
            <button id="btnDuplicate">複製</button>
            <button class="bad" id="btnDelete">削除</button>
          </div>
        </div>

        <div class="bd" id="editor">
          <div class="row">
            <div>
              <label>技名</label>
              <input id="name" placeholder="例：血殺 / 乱血殺 / 派生名など" />
            </div>
            <div>
              <label>種別</label>
              <select id="type">
                <option value="血殺">血殺</option>
                <option value="乱血殺">乱血殺</option>
                <option value="派生">派生</option>
                <option value="メモ">メモ</option>
              </select>
            </div>
          </div>

          <label>概要（短い説明）</label>
          <textarea id="desc" placeholder="例：背後時に強い / 壁際派生 / 〇〇条件で発動…"></textarea>

          <div class="row">
            <div>
              <label>発動条件（任意）</label>
              <input id="cond" placeholder="例：空中 / 壁走り後 / ガード後 / ヒット時…" />
            </div>
            <div>
              <label>タグ（任意）</label>
              <input id="tags" placeholder="例：対複数, 対ボス, リーチ長, 無敵" />
            </div>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top: 14px;">
            <div>
              <div style="font-weight:800; font-size: 13px;">手順（ステップ）</div>
              <div class="tiny muted">入力 / タイミング / 条件 / メモ を1ステップとして細分化できます</div>
            </div>
            <button class="primary" id="btnAddStep">＋ ステップ追加</button>
          </div>

          <div class="steps" id="steps"></div>

          <div class="preview">
            <h3>プレビュー（共有用に整形）</h3>
            <div class="big" id="pvTitle">-</div>
            <div class="meta" id="pvMeta">-</div>
            <ol id="pvSteps"></ol>
          </div>

          <div class="footer-note">
            ヒント：ステップの「入力」欄に <span class="muted">→ / ↓ / ↑ / □ / △</span> などをそのまま書くと、手順として見やすく管理できます。
          </div>
        </div>
      </section>
    </div>
  </div>
</main>

<script>
  // ---- Data Model ----
  // technique: { id, name, type, desc, cond, tags, steps:[{input,timing,condition,note}] }

  const LS_KEY = "kessatsu_editor_v1";

  const $ = (id) => document.getElementById(id);

  const state = {
    items: [],
    activeId: null,
    query: ""
  };

  function uid(){
    return Math.random().toString(16).slice(2) + Date.now().toString(16);
  }

  function defaultItem(){
    return {
      id: uid(),
      name: "血殺",
      type: "血殺",
      desc: "",
      cond: "",
      tags: "",
      steps: [
        { input: "", timing: "", condition: "", note: "" }
      ]
    };
  }

  function load(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed)){
          state.items = parsed;
          state.activeId = parsed[0]?.id ?? null;
          return;
        }
      }
    }catch(e){}
    // seed
    state.items = [
      {
        id: uid(),
        name: "血殺（例）",
        type: "血殺",
        desc: "例データ：手順を細かく書けます。",
        cond: "例：背後 / カウンター / 〇〇後",
        tags: "例：対複数, 無敵, 崩し",
        steps: [
          { input: "（入力）例：→ + □", timing: "（タイミング）例：最速", condition: "（条件）例：密着", note: "（メモ）例：ヒット確認で派生" },
          { input: "（入力）例：△", timing: "例：1拍", condition: "例：ヒット時", note: "例：ここから乱血殺に移行" }
        ]
      },
      {
        id: uid(),
        name: "乱血殺（例）",
        type: "乱血殺",
        desc: "例データ：派生や分岐もステップで表現。",
        cond: "例：ゲージ満タン時",
        tags: "例：高火力, リスク有",
        steps: [
          { input: "（入力）例：↓ ↘ → + △", timing: "例：溜めなし", condition: "例：空中不可", note: "" }
        ]
      }
    ];
    state.activeId = state.items[0].id;
    save();
  }

  function save(){
    localStorage.setItem(LS_KEY, JSON.stringify(state.items));
  }

  // ---- Rendering ----
  function badgeClass(type){
    if(type === "血殺") return "badge kessatsu";
    if(type === "乱血殺") return "badge rankessatsu";
    return "badge";
  }

  function matchesQuery(item, q){
    if(!q) return true;
    const hay = [
      item.name, item.type, item.desc, item.cond, item.tags,
      ...(item.steps||[]).flatMap(s => [s.input, s.timing, s.condition, s.note])
    ].join("\n").toLowerCase();
    return hay.includes(q.toLowerCase());
  }

  function renderList(){
    const list = $("list");
    list.innerHTML = "";
    const q = state.query.trim();
    const filtered = state.items.filter(it => matchesQuery(it, q));

    $("count").textContent = `${filtered.length} / ${state.items.length}`;

    filtered.forEach(it => {
      const div = document.createElement("div");
      div.className = "item" + (it.id === state.activeId ? " active" : "");
      div.onclick = () => { state.activeId = it.id; render(); };

      const top = document.createElement("div");
      top.className = "t";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = it.name || "（無題）";

      const badge = document.createElement("div");
      badge.className = badgeClass(it.type);
      badge.textContent = it.type || "未設定";

      top.appendChild(name);
      top.appendChild(badge);

      const desc = document.createElement("div");
      desc.className = "desc";
      const line = (it.desc || "").trim();
      desc.textContent = line ? line.slice(0, 60) : "（説明なし）";

      div.appendChild(top);
      div.appendChild(desc);
      list.appendChild(div);
    });
  }

  function getActive(){
    return state.items.find(x => x.id === state.activeId) || null;
  }

  function renderEditor(){
    const item = getActive();
    const ed = $("editor");
    if(!item){
      ed.innerHTML = '<div class="muted">データがありません。「新規作成」してください。</div>';
      return;
    }

    $("name").value = item.name ?? "";
    $("type").value = item.type ?? "血殺";
    $("desc").value = item.desc ?? "";
    $("cond").value = item.cond ?? "";
    $("tags").value = item.tags ?? "";

    renderSteps(item);
    renderPreview(item);
  }

  function renderSteps(item){
    const wrap = $("steps");
    wrap.innerHTML = "";
    (item.steps || []).forEach((s, idx) => {
      const box = document.createElement("div");
      box.className = "step";

      const top = document.createElement("div");
      top.className = "topline";

      const left = document.createElement("div");
      left.className = "idx";
      left.textContent = `ステップ ${idx+1}`;

      const acts = document.createElement("div");
      acts.className = "mini-actions";

      const up = document.createElement("button");
      up.textContent = "↑";
      up.title = "上へ";
      up.onclick = () => {
        if(idx === 0) return;
        const a = item.steps[idx-1];
        item.steps[idx-1] = item.steps[idx];
        item.steps[idx] = a;
        save(); render();
      };

      const down = document.createElement("button");
      down.textContent = "↓";
      down.title = "下へ";
      down.onclick = () => {
        if(idx === item.steps.length-1) return;
        const a = item.steps[idx+1];
        item.steps[idx+1] = item.steps[idx];
        item.steps[idx] = a;
        save(); render();
      };

      const del = document.createElement("button");
      del.textContent = "削除";
      del.className = "bad";
      del.onclick = () => {
        item.steps.splice(idx, 1);
        if(item.steps.length === 0) item.steps.push({input:"",timing:"",condition:"",note:""});
        save(); render();
      };

      acts.appendChild(up);
      acts.appendChild(down);
      acts.appendChild(del);

      top.appendChild(left);
      top.appendChild(acts);

      const grid = document.createElement("div");
      grid.className = "stepgrid";

      const f1 = document.createElement("div");
      const l1 = document.createElement("label");
      l1.textContent = "入力（コマンド）";
      const i1 = document.createElement("input");
      i1.value = s.input ?? "";
      i1.placeholder = "例：→ + □ / ↓↘→ + △ / 連打 / 長押し…";
      i1.oninput = (e) => { s.input = e.target.value; save(); renderPreview(item); };
      f1.appendChild(l1); f1.appendChild(i1);

      const f2 = document.createElement("div");
      const l2 = document.createElement("label");
      l2.textContent = "タイミング";
      const i2 = document.createElement("input");
      i2.value = s.timing ?? "";
      i2.placeholder = "例：最速 / 1拍 / 着地直前 / 確反…";
      i2.oninput = (e) => { s.timing = e.target.value; save(); renderPreview(item); };
      f2.appendChild(l2); f2.appendChild(i2);

      const f3 = document.createElement("div");
      const l3 = document.createElement("label");
      l3.textContent = "条件 / 分岐";
      const i3 = document.createElement("input");
      i3.value = s.condition ?? "";
      i3.placeholder = "例：ヒット時のみ / ガード時は中止 / 背後限定…";
      i3.oninput = (e) => { s.condition = e.target.value; save(); renderPreview(item); };
      f3.appendChild(l3); f3.appendChild(i3);

      const f4 = document.createElement("div");
      f4.style.gridColumn = "1 / -1";
      const l4 = document.createElement("label");
      l4.textContent = "メモ（ダメージ/用途/注意など）";
      const t4 = document.createElement("textarea");
      t4.value = s.note ?? "";
      t4.placeholder = "例：暴れ潰し。ここで派生を選ぶ。壁際だと安定…";
      t4.oninput = (e) => { s.note = e.target.value; save(); renderPreview(item); };
      f4.appendChild(l4); f4.appendChild(t4);

      grid.appendChild(f1);
      grid.appendChild(f2);
      grid.appendChild(f3);
      grid.appendChild(f4);

      box.appendChild(top);
      box.appendChild(grid);
      wrap.appendChild(box);
    });
  }

  function renderPreview(item){
    $("pvTitle").textContent = `${item.name || "（無題）"}`;
    const meta = [];
    if(item.type) meta.push(`種別：${item.type}`);
    if(item.cond) meta.push(`条件：${item.cond}`);
    if(item.tags) meta.push(`タグ：${item.tags}`);
    $("pvMeta").textContent = meta.join(" / ") || "-";

    const ol = $("pvSteps");
    ol.innerHTML = "";
    (item.steps||[]).forEach(s => {
      const li = document.createElement("li");
      const parts = [];
      if((s.input||"").trim()) parts.push(`【入力】${s.input.trim()}`);
      if((s.timing||"").trim()) parts.push(`【タイミング】${s.timing.trim()}`);
      if((s.condition||"").trim()) parts.push(`【条件】${s.condition.trim()}`);
      if((s.note||"").trim()) parts.push(`【メモ】${s.note.trim()}`);
      li.textContent = parts.join(" ");
      ol.appendChild(li);
    });
  }

  function render(){
    renderList();
    renderEditor();
  }

  // ---- Events ----
  $("search").addEventListener("input", (e) => {
    state.query = e.target.value;
    renderList();
  });

  function bindEditor(){
    const item = getActive();
    if(!item) return;

    ["name","type","desc","cond","tags"].forEach(key => {
      $(key).addEventListener("input", (e) => {
        const it = getActive();
        if(!it) return;
        it[key] = e.target.value;
        save();
        renderList();
        renderPreview(it);
      });
      // select change
      if(key === "type"){
        $(key).addEventListener("change", (e) => {
          const it = getActive();
          if(!it) return;
          it[key] = e.target.value;
          save();
          render();
        });
      }
    });

    $("btnAddStep").addEventListener("click", () => {
      const it = getActive();
      if(!it) return;
      it.steps = it.steps || [];
      it.steps.push({ input:"", timing:"", condition:"", note:"" });
      save();
      render();
      // scroll to bottom
      setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior:"smooth" }), 0);
    });
  }

  $("btnNew").addEventListener("click", () => {
    const it = defaultItem();
    it.name = "新しい技";
    state.items.unshift(it);
    state.activeId = it.id;
    save();
    render();
  });

  $("btnDelete").addEventListener("click", () => {
    const it = getActive();
    if(!it) return;
    if(!confirm(`「${it.name}」を削除しますか？`)) return;
    state.items = state.items.filter(x => x.id !== it.id);
    state.activeId = state.items[0]?.id ?? null;
    save();
    render();
  });

  $("btnDuplicate").addEventListener("click", () => {
    const it = getActive();
    if(!it) return;
    const copy = JSON.parse(JSON.stringify(it));
    copy.id = uid();
    copy.name = (it.name || "（無題）") + "（複製）";
    state.items.unshift(copy);
    state.activeId = copy.id;
    save();
    render();
  });

  $("btnExport").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state.items, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
    a.download = `kessatsu-data_${stamp}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $("btnImport").addEventListener("click", () => $("fileImport").click());

  $("fileImport").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!Array.isArray(data)) throw new Error("JSONが配列ではありません");
      // minimal sanitize
      state.items = data.map(x => ({
        id: x.id || uid(),
        name: x.name || "（無題）",
        type: x.type || "血殺",
        desc: x.desc || "",
        cond: x.cond || "",
        tags: x.tags || "",
        steps: Array.isArray(x.steps) ? x.steps.map(s => ({
          input: s.input || "",
          timing: s.timing || "",
          condition: s.condition || "",
          note: s.note || ""
        })) : [{input:"",timing:"",condition:"",note:""}]
      }));
      state.activeId = state.items[0]?.id ?? null;
      save();
      render();
      alert("読み込みました！");
    }catch(err){
      alert("読み込みに失敗しました： " + err.message);
    }finally{
      e.target.value = "";
    }
  });

  $("btnReset").addEventListener("click", () => {
    if(!confirm("全データを削除して初期化しますか？")) return;
    localStorage.removeItem(LS_KEY);
    load();
    render();
  });

  // ---- init ----
  load();
  render();
  // bind once (editor inputs exist)
  bindEditor();
</script>
</body>
</html>
